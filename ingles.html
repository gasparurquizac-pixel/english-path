<body>

<header>
<div><h1>English Path ✳</h1><small>Un poco cada día.</small></div>
<label>Nivel
<select id="level"><option>B1</option><option>B2</option></select>

</header>
<nav>
<button id="home">Practicar</button>

<div id="app"></div>
<footer>
El progreso se guarda en este navegador si permite almacenamiento local.

Estas prácticas no certifican tu nivel.

</main>

const app=document.querySelector("#app");
const level=document.querySelector("#level");
let state={answers:0,correct:0,completed:[],level:"B1"};
try{
 const saved=JSON.parse(localStorage.getItem("english-path-offline"));
 if(saved)state={...state,...saved};
}catch{}
if(!data[state.level])state.level="B1";
level.value=state.level;
let session=null;

function save(){
 try{localStorage.setItem("english-path-offline",JSON.stringify(state))}catch{}
}
function stopVoice(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
}
function speak(text){
 if(!("speechSynthesis" in window)){
  alert("La voz no está disponible. Usá la transcripción.");
  return;
 }
 stopVoice();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="en-GB";
 utterance.rate=.85;
 speechSynthesis.speak(utterance);
}
function home(){
 stopVoice();
 session=null;
 app.innerHTML=`
 <section class="panel">
 <small>TU PRÓXIMO PASO · ${state.level}</small>
 <h2>Small steps. Real progress.</h2>
 <p>Elegí una habilidad. Cada sesión tiene tres ejercicios
 con correcciones explicadas en español.</p>
 <div class="grid">
 ${Object.keys(data[state.level]).map((name,i)=>`
 <button class="card" data-type="${name}">
 <b>${["Aa","✳","▤","♫"][i]} ${name}</b>
 <small>${state.completed.includes(state.level+":"+name)?
 "✓ Completada · Volver a practicar":"3 ejercicios · Comenzar →"}</small>
 </button>`).join("")}
 </div>
 </section>`;
 app.querySelectorAll("[data-type]").forEach(button=>{
  button.onclick=()=>{
   session={level:state.level,type:button.dataset.type,index:0,score:0,answered:false};
   question();
  };
 });
}
function question(){
 stopVoice();
 const s=session;
 s.answered=false;
 const q=data[s.level][s.type][s.index];
 app.innerHTML=`
 <section class="panel">
 <small>${s.level} · ${s.type} · ${s.index+1} DE 3</small>
 <div class="progress" style="margin-top:15px">
 <div style="width:${s.index/3*100}%"></div>
 </div>
 ${s.type==="Lectura"?`<p class="reading" lang="en">${q[4]}</p>`:""}
 ${s.type==="Escucha"?`
 <p>Escuchá el audio y elegí la respuesta.</p>
 <button id="listen" class="primary">♫ Reproducir audio</button>
 <details style="margin-top:18px">
 <summary>Ver transcripción</summary>
 <p lang="en">${q[4]}</p>
 </details>`:""}
 <h2 lang="en">${q[0]}</h2>
 <div class="options">
 ${q[1].map((answer,i)=>`
 <button data-answer="${i}" lang="en">
 ${String.fromCharCode(65+i)}. ${answer}
 </button>`).join("")}
 </div>
 <div id="feedback" aria-live="polite"></div>
 <button id="back">Salir de la sesión</button>
 </section>`;
 if(document.querySelector("#listen")){
  document.querySelector("#listen").onclick=()=>speak(q[4]);
 }
 document.querySelector("#back").onclick=home;
 app.querySelectorAll("[data-answer]").forEach(button=>{
  button.onclick=()=>answer(Number(button.dataset.answer));
 });
}
function answer(index){
 const s=session;
 if(s.answered)return;
 s.answered=true;
 const q=data[s.level][s.type][s.index];
 const correct=index===q[2];
 state.answers++;
 if(correct){state.correct++;s.score++}
 save();
 app.querySelectorAll("[data-answer]").forEach(button=>{
  const n=Number(button.dataset.answer);
  button.disabled=true;
  if(n===q[2])button.classList.add("correct");
  else if(n===index)button.classList.add("wrong");
 });
 document.querySelector("#feedback").innerHTML=`
 <div class="feedback">
 <b>${correct?"¡Muy bien!":"Una oportunidad para aprender."}</b>
 <br>${q[3]}
 </div>
 <button class="primary" id="next">
 ${s.index<2?"Siguiente ejercicio →":"Ver resultado →"}
 </button><br><br>`;
 document.querySelector("#next").onclick=()=>{
  if(s.index<2){s.index++;question()}
  else finish();
 };
}
function finish(){
 stopVoice();
 const key=session.level+":"+session.type;
 if(!state.completed.includes(key))state.completed.push(key);
 save();
 app.innerHTML=`
 <section class="panel">
 <small>SESIÓN COMPLETADA</small>
 <h2>${session.score===3?"Great work!":"Keep going!"}</h2>
 <p>Acertaste <b>${session.score} de 3</b> ejercicios.</p>
 <div class="feedback">
 ${session.score===3?
 "Probá otra habilidad para seguir avanzando.":
 "Podés repetir la sesión para afianzar las explicaciones. Equivocarse también es aprender."}
 </div>
 <button class="primary" id="continue">Continuar →</button>
 </section>`;
 document.querySelector("#continue").onclick=home;
}
function progress(){
 stopVoice();
 session=null;
 app.innerHTML=`
 <section class="panel">
 <h2>Cada paso cuenta.</h2>
 <div class="stats">
 <span>${state.answers} respuestas</span>
 <span>${state.answers?Math.round(state.correct/state.answers*100):0}% correctas</span>
 <span>${state.completed.length} de 8 sesiones</span>
 </div>
 ${["B1","B2"].map(l=>{
 const n=state.completed.filter(x=>x.startsWith(l+":")).length;
 return `<h3>Ruta ${l} · ${n}/4</h3>
 <div class="progress"><div style="width:${n*25}%"></div></div>`;
 }).join("")}
 <p>Las estadísticas incluyen los intentos repetidos.
 Una sesión completada significa que respondiste sus tres ejercicios.</p>
 <button id="reset">Borrar mi progreso</button>
 </section>`;
 document.querySelector("#reset").onclick=()=>{
  if(confirm("¿Borrar todo el progreso guardado?")){
   state={answers:0,correct:0,completed:[],level:level.value};
   save();progress();
  }
 };
}
level.onchange=()=>{
 state.level=level.value;
 save();home();
};
document.querySelector("#home").onclick=home;
document.querySelector("#progress").onclick=progress;
window.addEventListener("pagehide",stopVoice);
home();
</script>

answer=function(i){
 const s=session;
 if(s.answered)return;
 s.answered=true;

 const id=s.ids[s.index];
 const q=data[s.level][s.type][id];
 const ok=i===q[2];

 state.answers++;
 if(ok){
  state.correct++;
  s.score++;
 }

 state.practice[key(s.level,s.type,id)]={correct:ok};
 save();

 app.querySelectorAll("[data-answer]").forEach(button=>{
  button.disabled=true;
  const n=Number(button.dataset.answer);

  if(n===q[2])button.classList.add("correct");
  else if(n===i)button.classList.add("wrong");
 });

 document.querySelector("#feedback").innerHTML=`
 <div class="feedback">
 <b>${ok?"¡Muy bien!":"Una oportunidad para aprender."}</b>
 <br>${q[3]}
 </div>
 <button class="primary" id="next">
 ${s.index<s.ids.length-1?
 "Siguiente ejercicio →":"Ver resultado →"}
 </button><br><br>`;

 document.querySelector("#next").onclick=()=>{
  if(s.index<s.ids.length-1){
   s.index++;
   question();
  }else{
   finish();
  }
 };
};

const make=(text,correct,wrong1,wrong2,why,passage)=>{
 const choices=[correct,wrong1,wrong2];
 const position=[...text].reduce(
  (n,c)=>n+c.charCodeAt(0),0
 )%3;

 for(let n=0;n<position;n++){
  choices.unshift(choices.pop());
 }

 return [
  text,choices,position,why,
  ...(passage?[passage]:[])
 ];
};

for(const level of ["B1","B2"]){
 for(const type of ["Lectura","Escucha"]){
  const offset=type==="Escucha"?2:0;

  const questions=passages[level].flatMap(builder=>
   contexts.map((_,j)=>{
    const original=contexts[(j+offset)%contexts.length];

    const context=type==="Escucha"?{
     ...original,
     n:["Noah","Isla","Leo","Grace","Jack"][j],
     city:["Reading","Norwich","Lincoln","Lancaster","Winchester"][j],
     day:["Saturday","Sunday","Friday","Tuesday","Monday"][j],
     time:["8:15","9:45","12:00","14:15","15:00"][j],
     later:["10:30","12:00","14:30","16:00","17:30"][j]
    }:original;

    const row=builder(context);

    const prefix=type==="Escucha"?
     `You hear the following message about ${context.city}. `:"";

    return make(
     `${row[0]} [${context.city} · ${type}]`,
     row[1],row[2],row[3],row[5],
     prefix+row[4]
    );
   })
  );

  add(level,type,questions);
 }
}

app.innerHTML=`<section class="panel"><button class="ep-back" id="backHome">← Todas las habilidades</button><small style="display:block">${state.level} · ${type}</small><h2>¿Qué querés practicar?</h2><div class="ep-controls"><label>Tema<select id="ep-topic"><option value="all">Todos los temas (${list.length})</option>${topics.map(t=>`<option value="${esc(t)}" ${t===selectedTopic?'selected':''}>${esc(t)} (${list.filter(q=>topic(q)===t).length})</option>`).join('')}</select></label><label>Preguntas por sesión<select id="ep-size">${[5,10,20].map(n=>`<option ${Number(state.preferences.size)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Modo<select id="ep-mode"><option value="mixed" ${mode==='mixed'?'selected':''}>Mi práctica: nuevas y repaso</option><option value="new" ${mode==='new'?'selected':''}>Solo preguntas nuevas</option><option value="errors" ${mode==='errors'?'selected':''}>Repasar mis errores</option></select></label></div><div id="ep-count" class="ep-muted" aria-live="polite"></div><div class="ep-buttons" style="margin-top:20px"><button class="primary" id="ep-start">Empezar sesión →</button></div><p class="ep-muted">${type==='Escucha'?'El audio usa la voz sintetizada de tu navegador. Podés volver a escucharlo o consultar la transcripción.':type==='Vocabulario'?'Algunos ejercicios de vocabulario incluyen audio para practicar reconocimiento y significado.':'Al terminar cada pregunta vas a ver la respuesta y su explicación.'}</p><details><summary>Ver los temas disponibles</summary><div class="ep-topic-grid" style="margin-top:15px">${topics.map(t=>`<div class="ep-topic"><b>${esc(t)}</b><p>${list.filter(q=>topic(q)===t).length} ejercicios</p></div>`).join('')}</div></details></section>`;
const control=s=>document.querySelector(s);
control('#backHome').onclick=home;
const update=()=>{
chosen.topic=control('#ep-topic').value;
chosen.mode=control('#ep-mode').value;
state.preferences.mode=chosen.mode;
state.preferences.size=Number(control('#ep-size').value);
save();
const n=eligible().length;
control('#ep-count').textContent=n?`${n} preguntas disponibles con estos filtros. La sesión tendrá ${Math.min(n,state.preferences.size)}.`:'No quedan preguntas con estos filtros. Elegí otro tema o cambiá el modo.';
control('#ep-start').disabled=!n;
};
['#ep-topic','#ep-mode','#ep-size'].forEach(id=>control(id).onchange=update);
control('#ep-start').onclick=start;
update();
}
function eligible(){
return data[state.level][chosen.type].map((q,i)=>({q,i})).filter(({q,i})=>{
if(chosen.topic!=='all'&&topic(q)!==chosen.topic)return false;
const r=rec(state.level,chosen.type,i);
return chosen.mode==='errors'?r?.correct===false:chosen.mode==='new'?!r:true;
}).map(x=>x.i);
}
function start(){
const ids=randomise(eligible());
if(chosen.mode==='mixed')ids.sort((a,b)=>{
const rank=i=>{const r=rec(state.level,chosen.type,i);return !r?0:r.correct?2:1};
return rank(a)-rank(b);
});
if(!ids.length)return;
session={level:state.level,type:chosen.type,ids:ids.slice(0,state.preferences.size),index:0,score:0,answered:false};
question();
}
question=function(){
stopVoice();const s=session,q=data[s.level][s.type][s.ids[s.index]];s.answered=false;
const audio=q[5]?.audio||(s.type==='Escucha'?q[4]:'');
app.innerHTML=`<section class="panel"><small>${s.level} · ${esc(s.type)} · ${s.index+1} DE ${s.ids.length}</small><div class="progress" style="margin:15px 0"><div style="width:${s.index/s.ids.length*100}%"></div></div><span class="ep-badge">${esc(topic(q))}</span>${s.type==='Lectura'?`<p class="reading" lang="en">${esc(q[4])}</p>`:''}${audio?`<p>Escuchá y elegí la respuesta.</p><button class="primary" id="listen">♫ Reproducir audio</button><details style="margin-top:16px"><summary>Ver transcripción</summary><p lang="en">${esc(audio)}</p></details>`:''}<h2 class="ep-q">${esc(q[0])}</h2><div class="options">${q[1].map((a,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button id="leave">Volver a los temas</button></section>`;
if(audio)document.querySelector('#listen').onclick=()=>speak(audio);
document.querySelector('#leave').onclick=()=>choose(s.type,chosen?.topic||'all',chosen?.mode||'mixed');
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
};
answer=function(i){
const s=session;if(s.answered)return;
s.answered=true;const id=s.ids[s.index],q=data[s.level][s.type][id],ok=i===q[2];
state.answers++;if(ok){state.correct++;s.score++}
const k=exerciseKey(s.level,s.type,id),old=state.practice[k]||{};
state.practice[k]={...old,correct:ok,attempts:(old.attempts||0)+1,lastAt:Date.now()};save();
app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);if(n===q[2])b.classList.add('correct');else if(n===i)b.classList.add('wrong')});
document.querySelector('#feedback').innerHTML=`<div class="feedback ep-explain"><b>${ok?'¡Muy bien!':'Vamos a aprender de este error.'}</b><p>Respuesta correcta: <strong>${esc(q[1][q[2]])}</strong></p>${esc(q[3])}</div><button class="primary" id="next">${s.index<s.ids.length-1?'Siguiente pregunta →':'Ver resultado →'}</button><br><br>`;
document.querySelector('#next').onclick=()=>{if(s.index<s.ids.length-1){s.index++;question()}else finish()};
};
finish=function(){
stopVoice();const s=session,t=s.type;
app.innerHTML=`<section class="panel"><small>SESIÓN COMPLETADA · ${s.level}</small><h2>${s.score===s.ids.length?'Great work!':'Keep going!'}</h2><p>Acertaste <b>${s.score} de ${s.ids.length}</b> preguntas.</p><div class="stats"><span>${done(s.level,t)} / ${data[s.level][t].length} practicadas en ${esc(t)}</span><span>${wrong(s.level,t)} errores pendientes</span></div><p>Podés elegir otro tema, seguir con preguntas nuevas o volver a intentar los errores.</p><div class="ep-buttons"><button class="primary" id="again">Otra sesión</button><button id="review">Repasar errores de ${esc(t)}</button><button id="allskills">Todas las habilidades</button></div></section>`;
document.querySelector('#again').onclick=()=>choose(t,chosen?.topic||'all',chosen?.mode||'mixed');
document.querySelector('#review').onclick=()=>choose(t,'all','errors');
document.querySelector('#allskills').onclick=home;
};
progress=function(){
stopVoice();session=null;
const stats=['B1','B2'].map(l=>levelStats(l)),seen=stats.reduce((n,s)=>n+s.done,0),right=stats.reduce((n,s)=>n+s.known,0);
app.innerHTML=`<section class="panel"><h2>Cada paso cuenta.</h2><div class="stats"><span>${fmt(seen)} / ${fmt(allCount())} ejercicios practicados</span><span>${fmt(right)} correctos en su último intento</span><span>${fmt(state.answers)} respuestas acumuladas</span></div>${['B1','B2'].map((l,j)=>`<h3>Ruta ${l} · ${stats[j].done} / ${stats[j].total}</h3>${types.map(t=>`<p>${esc(t)}: ${done(l,t)} / ${data[l][t].length} practicados · ${wrong(l,t)} errores pendientes</p><div class="progress"><div style="width:${done(l,t)/data[l][t].length*100}%"></div></div>`).join('')}`).join('')}<h3>Repasar mis errores · ${state.level}</h3><div class="ep-buttons">${types.map(t=>`<button data-review="${t}">${t} (${wrong(state.level,t)})</button>`).join('')}</div><p class="ep-muted">El progreso se guarda en este navegador. No se sincroniza automáticamente entre dispositivos. Las respuestas acumuladas incluyen tus versiones anteriores.</p><button id="reset">Borrar mi progreso</button></section>`;
app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>choose(b.dataset.review,'all','errors'));
document.querySelector('#reset').onclick=()=>{if(confirm('¿Borrar todas las respuestas y el progreso guardado en este navegador?')){state.answers=0;state.correct=0;state.completed=[];state.practice={};save();progress()}};
};
document.querySelector('#home').onclick=home;
document.querySelector('#progress').onclick=progress;
level.onchange=()=>{state.level=level.value;save();home()};
save();home();
window.englishPathApp={choose,eligible,start,count:allCount};
})();

</script>

['Cinco bloques útiles','Get on with someone: llevarse bien. Carry on doing: continuar. Give up doing: dejar un hábito o actividad. Put off a meeting: posponer. Run out of something: quedarse sin algo.'],

lesson('advanced-conditionals','Condiciones y consecuencias complejas','Interpretar condiciones formales y relaciones entre pasado y presente.',[
['Tres tiempos que no son lo mismo','El segundo condicional imagina presente/futuro: If I had time, I would help. El tercero imagina un pasado diferente: If I had known, I would have helped. Un mixto relaciona una condición pasada con una consecuencia actual.'],
['Alternativas a if','Unless significa if not. Provided that y as long as presentan condiciones: siempre que. En condiciones futuras básicas, la subordinada suele usar presente, no will.'],
['Inversión formal','Should you need… equivale aproximadamente a If you should need…. Had I known… equivale a If I had known…. Estas formas son más formales y cambian el orden, no eliminan la relación condicional.']
],[['Unless she calls, we will leave.','Nos iremos si ella no llama.'],['You can borrow it provided that you return it.','Podés pedirlo prestado siempre que lo devuelvas.'],['Had I known, I would have waited.','De haberlo sabido, habría esperado.'],['If I had accepted the job, I would be living there now.','Si hubiera aceptado el trabajo, ahora viviría allí.']],[['Unless she does not call, we will leave.','Unless she calls, we will leave.','Si la intención es if she does not call, no añadas otra negación a unless.'],['Had I knew…','Had I known…','La inversión del pasado perfecto conserva el participio.']],
{'Gramática':['Condicionales avanzados','Condicionales mixtos']},
['If I had taken that job, I ___ in Madrid now.',['would be living','had lived','will have lived'],0,'La condición pasada tiene una consecuencia hipotética presente: would be living.']),
lesson('wishes','Deseos, arrepentimientos y preferencias','Distinguir deseos presentes, arrepentimientos pasados y cambios de conducta.',[
['Wish e if only','Wish + pasado expresa un deseo contrario al presente. Wish + past perfect expresa arrepentimiento por el pasado. If only suele transmitir un deseo o arrepentimiento más enfático.'],
['Wish + would','Puede expresar deseo de que cambie una situación o conducta, a menudo con molestia. No es una sustitución general de wish + pasado para cualquier deseo sobre uno mismo.'],
['Preferencias y urgencia','Would rather + sujeto diferente + pasado expresa preferencia: I would rather you stayed. It is time + sujeto + pasado expresa que algo ya debería ocurrir. Estas formas de pasado no necesariamente hablan de tiempo pasado.']
],[['I wish I had more time.','Ojalá tuviera más tiempo ahora.'],['I wish I had checked the figures.','Ojalá hubiera revisado las cifras.'],['I wish they would stop interrupting.','Ojalá dejaran de interrumpir.'],['I would rather you came tomorrow.','Preferiría que vinieras mañana.']],[['I wish I have more time.','I wish I had more time.','El deseo contrario al presente usa una forma de pasado.'],['I would rather you come yesterday.','I would rather you had come yesterday.','Para preferir un pasado distinto, con otro sujeto se usa past perfect.']],
{'Gramática':['Deseos y arrepentimientos','Preferencias']},
['I regret deleting the file. I wish I ___ a copy.',['save','had saved','will save'],1,'Un arrepentimiento pasado se expresa con wish + past perfect.']),
lesson('deductions','Deducir y evaluar acciones pasadas','Expresar certeza, imposibilidad, crítica e innecesariedad sin confundirlas.',[
['Deducciones','Must have + participio expresa una deducción fuerte sobre el pasado. Cannot/can’t have + participio expresa que algo no pudo haber pasado según la evidencia. Might/may/could have puede presentar una posibilidad, según el contexto.'],
['Críticas y consejos retrospectivos','Should have + participio indica que algo habría sido aconsejable. No afirma por sí solo que la acción ocurrió; en una crítica, suele implicar que no ocurrió.'],
['Acciones innecesarias','Need not have + participio expresa una acción realizada que no hacía falta. Did not need to indica que no había necesidad; por sí solo puede no aclarar si finalmente se hizo. La interpretación depende también del contexto.']
],[['She knew everything; she must have read the report.','Sabía todo; debe de haber leído el informe.'],['He was abroad; he cannot have been at the meeting.','Estaba en el extranjero; no puede haber estado en la reunión.'],['You should have checked first.','Deberías haber revisado antes.'],['You need not have bought a ticket.','No hacía falta que compraras una entrada, aunque la compraste.']],[['She must has seen it.','She must have seen it.','Después del modal va have, no has.'],['You should had checked.','You should have checked.','La estructura es modal + have + participio.']],
{'Gramática':['Modales perfectos']},
['You bought two tickets, but I already had one. You ___ bought mine.',['must not','need not have','cannot to have'],1,'La compra ocurrió y era innecesaria: need not have bought.']),
lesson('passive-participles','Pasivas y oraciones reducidas','Comprender construcciones formales y evitar participios con sujeto ambiguo.',[
['Pasiva con infinitivo o -ing','La pasiva conserva be + participio en distintas estructuras: needs to be checked; dislikes being told. La forma depende de lo que exige el verbo anterior.'],
['Transmitir información','Is reported/believed to… permite presentar información atribuida. To have + participio sitúa el hecho antes del reporte: is reported to have left. Si el infinitivo también es pasivo: to have been stolen.'],
['Reducir oraciones','Un participio pasado puede reducir una relativa pasiva: the items displayed. Having + participio sitúa una acción completada antes de otra. En estas cláusulas iniciales, el sujeto implícito debe coincidir con el de la principal para evitar confusión.']
],[['The document needs to be checked.','El documento necesita revisión.'],['She dislikes being interrupted.','No le gusta que la interrumpan.'],['The director is reported to have resigned.','Se informa que el director renunció.'],['Having checked the report, Ana sent it.','Después de revisar el informe, Ana lo envió.']],[['Having checked the report, the email was sent.','Having checked the report, Ana sent the email.','La primera versión parece atribuir la revisión al email. Hacé explícito el sujeto correcto.'],['It needs to checked.','It needs to be checked.','Falta be en el infinitivo pasivo.']],
{'Gramática':['Pasiva avanzada','Participios']},
['Having ___ the details, she signed the contract.',['check','checking','checked'],2,'Having + participio expresa una acción anterior al acto de firmar.']),
lesson('relatives-emphasis','Precisar y destacar información','Usar relativas explicativas y estructuras de énfasis.',[
['Relativas explicativas','Añaden información no necesaria para identificar el referente y suelen ir entre comas. Para cosas se usa which; no that. Which también puede referirse a toda la oración previa.'],
['Whose y whom','Whose expresa posesión y puede referirse a personas u organizaciones. Whom es formal para objetos humanos, especialmente detrás de una preposición: with whom. En registros informales suelen usarse otras estructuras.'],
['Oraciones hendidas','It was Ana who noticed the error destaca a Ana. What we need is more time destaca la necesidad. El énfasis ayuda a contrastar o corregir información; no hace que el resto de la oración deje de importar.']
],[['The report, which arrived yesterday, is useful.','El informe, que llegó ayer, es útil.'],['The manager with whom I spoke agreed.','El gerente con quien hablé estuvo de acuerdo.'],['It was Ana who found the error.','Fue Ana quien encontró el error.'],['What we need is a clear plan.','Lo que necesitamos es un plan claro.']],[['The report, that arrived yesterday,…','The report, which arrived yesterday,…','That no se usa en la relativa explicativa entre comas.'],['The company which staff complained…','The company whose staff complained…','Se necesita expresar posesión: cuyo personal.']],

lesson('comparisons-future','Comparar tendencias y proyectar resultados','Describir cambios relacionados y acciones en distintos momentos futuros.',[
['Cambios relacionados','The more…, the more… relaciona dos cambios. Usá fewer con contables plurales y less con cantidades incontables en el uso estándar: fewer errors, less time. No longer indica que una situación dejó de continuar.'],
['Futuro continuo y perfecto','Will be + -ing sitúa una acción en curso en un momento futuro. Will have + participio mira hacia atrás desde un punto futuro y presenta algo ya terminado para entonces.'],
['Futuro perfecto continuo','Will have been + -ing destaca la duración de una actividad hasta un punto futuro. No lo uses automáticamente con verbos de estado; por ejemplo, will have known suele ser más natural que will have been knowing.']
],[['The more you practise, the fewer mistakes you make.','Cuanto más practicás, menos errores cometés.'],['At ten tomorrow, I will be travelling.','Mañana a las diez estaré viajando.'],['By Friday, we will have finished.','Para el viernes habremos terminado.'],['By June, she will have been teaching for ten years.','En junio llevará diez años enseñando.']],[['Will have working.','Will have been working.','El perfecto continuo necesita been.'],['Less errors.','Fewer errors.','En el uso estándar, errors es contable plural: fewer.']],
{'Gramática':['Comparaciones avanzadas','Futuro continuo','Futuro perfecto continuo']},
['By next June, she ___ here for ten years.',['will working','will have been working','will have work'],1,'La duración de una actividad hasta un punto futuro se expresa con will have been working.']),
lesson('inversion','Inversión para dar énfasis','Reconocer un orden formal que aparece en textos y discursos.',[
['Qué cambia','Algunas expresiones negativas o restrictivas al inicio provocan inversión del auxiliar y sujeto en la oración principal. No se trata de una pregunta, aunque el orden se parezca.'],
['Elegir el auxiliar','Si ya hay auxiliar, se invierte: Never have I seen…. Si un verbo en simple no tiene auxiliar, se añade do/does/did y se usa la forma base: Not only did she help….'],
['Expresiones y pares','Only after…, under no circumstances…, never before… pueden provocar inversión. Los pares fijos incluyen no sooner…than y hardly…when. En Only after…, la inversión aparece en la principal, no necesariamente dentro de la parte introducida por after.']
],[['Never have I seen such a result.','Nunca he visto un resultado así.'],['Not only did she help, but she also stayed late.','No solo ayudó, sino que además se quedó hasta tarde.'],['Only after the meeting did we understand.','Solo después de la reunión comprendimos.'],['Under no circumstances should you share the password.','Bajo ninguna circunstancia debés compartir la contraseña.']],[['Not only she helped…','Not only did she help…','Hace falta inversión con did y forma base help.'],['No sooner had she arrived when…','No sooner had she arrived than…','No sooner se combina con than.']],
{'Gramática':['Inversión']},

lesson('reporting-links','Informar, contrastar y justificar','Elegir patrones verbales y conectores apropiados en contextos formales.',[
['Verbos que informan','El verbo de reporte determina la estructura: deny doing; warn someone not to do; suggest that someone do/should do. No todos aceptan la misma combinación.'],
['Significados que dependen del patrón','Remember doing es recordar un hecho anterior; remember to do es acordarse de hacer algo pendiente. Stop doing es dejar una actividad; stop to do es detener otra para hacer esta.'],
['Contraste y causa','Even though + oración expresa concesión. Despite + sustantivo/-ing; despite the fact that + oración. Owing to y due to suelen ir con un grupo nominal. La elección del conector debe representar la relación real entre las ideas.']
],[['He denied changing the figures.','Negó haber cambiado las cifras.'],['Remember to send it.','Acordate de enviarlo.'],['I remember sending it.','Recuerdo haberlo enviado.'],['Despite the delay, the meeting was useful.','A pesar de la demora, la reunión fue útil.']],[['She denied to change it.','She denied changing it.','Deny se combina con -ing.'],['Despite of the delay.','Despite the delay.','Despite no lleva of; in spite of sí.']],
{'Gramática':['Estilo indirecto avanzado','Gerundio e infinitivo','Concesión','Causa y consecuencia'],'Escucha':['Escucha · Aclarar un malentendido']},

lesson('professional','Negociar y comunicarse en el trabajo','Expresar reservas, condiciones y propuestas sin confundir cortesía con acuerdo.',[
['Escuchar lo implícito','That sounds promising puede ir seguido de una reserva. Before we commit… señala que todavía no hay compromiso. Provided we… introduce una condición. Leé o escuchá la intervención completa antes de decidir si alguien acepta.'],
['Vocabulario de decisiones','Workload es carga de trabajo. Stakeholder es una parte interesada o afectada. Accountability es responsabilidad de rendir cuentas. Un benchmark es una referencia para comparar, no una garantía de calidad.'],
['Phrasal verbs profesionales','Look into: investigar. Come up with: idear. Get across: transmitir con claridad. Rule out: descartar. Put up with: tolerar. Aprendé sus objetos y partículas como parte de la expresión.']
],[['I would support a pilot, provided we limit its scope.','Apoyaría un piloto si delimitamos su alcance.'],['We need to look into the complaint.','Necesitamos investigar la queja.'],['Can you get the main point across?','¿Podés transmitir la idea principal con claridad?'],['We cannot rule out further delays.','No podemos descartar más demoras.']],[['Provided that… significa aceptación sin condiciones.','Provided that… introduce una condición.','La cortesía o el interés inicial no eliminan una reserva posterior.'],['We need to look the problem.','We need to look into the problem.','Look into requiere la partícula para significar investigar.']],

lesson('critical-reading','Leer evidencia y noticias con criterio','Distinguir afirmaciones, evidencia, inferencias y límites de un argumento.',[
['Correlación y causalidad','Que dos hechos coincidan no demuestra que uno cause el otro. Buscá posibles explicaciones alternativas, grupos de comparación y factores que cambiaron al mismo tiempo.'],
['Muestra y representación','La autoselección y el lugar donde se reclutan participantes pueden sesgar una muestra. Una encuesta en una página de quejas no equivale a la opinión de toda una ciudad. La cautela no significa que todo resultado sea falso.'],
['Lenguaje que limita una conclusión','May, suggests, appears to y promising rather than conclusive moderan una afirmación. Una inference es una conclusión derivada, no un hecho dicho explícitamente. Contrastá el titular con el alcance real de la evidencia.']
],[['The findings suggest an association.','Los hallazgos sugieren una asociación.'],['This does not establish causation.','Esto no establece causalidad.'],['The sample may not be representative.','La muestra podría no ser representativa.'],['The headline overstates the evidence.','El titular exagera lo que permite afirmar la evidencia.']],[['La cifra subió después del cambio, así que el cambio fue la única causa.','La coincidencia temporal es compatible con varias explicaciones.','Para atribuir una causa hace falta un diseño y evidencia adecuados.'],['Un resultado prometedor ya es concluyente.','Un resultado prometedor merece investigación adicional.','Promising y conclusive tienen grados de certeza diferentes.']],

['Evaluar el conjunto','Una opción de menor costo inicial puede tener gastos de soporte, formación o migración. Para comparar, necesitás el mismo horizonte temporal y supuestos equivalentes: compare like with like.'],
['Privacidad y utilidad','La personalización puede ser útil sin justificar retención ilimitada de datos. Consent es consentimiento informado; encryption es cifrado; un data breach es una vulneración de seguridad. No son conceptos intercambiables.'],
['Ciclo de vida y hábitos','La fabricación es solo una parte del impacto ambiental. También importan transporte, mantenimiento, duración y uso real. Una alternativa puede mejorar un aspecto y empeorar otro: ese equilibrio es un trade-off.']

lesson('independent-learning','Participar, aprender y argumentar con autonomía','Interpretar matices y explicar una posición con fundamento.',[
['Reconocer una posición equilibrada','Un hablante puede valorar una decisión y reconocer sus costos. I do not regret it, but… no equivale a rechazo total ni a entusiasmo sin reservas. Distinguí la idea central de un ejemplo o una objeción secundaria.'],
['Explicar tu razonamiento','Una estructura útil es: postura, razón, ejemplo, límite o alternativa. Usá conectores con sentido: however para contraste, therefore para consecuencia, for instance para ejemplo. No alcanza con añadir palabras formales.'],
['Aprender más allá de acertar','Transferir conocimientos significa usarlos en situaciones nuevas. Una racha o el número de ejercicios completados no mide toda tu habilidad. Después de practicar, intentá resumir un texto en tus palabras y explicar por qué descartaste otra respuesta. Esta ruta no evalúa todavía escritura libre ni conversación.']
],[['I see the benefits; however, the costs are unevenly shared.','Veo los beneficios; sin embargo, los costos se reparten de forma desigual.'],['For instance, some residents face higher rents.','Por ejemplo, algunos residentes afrontan alquileres más altos.'],['The evidence supports a trial, not a guarantee.','La evidencia respalda una prueba, no una garantía.'],['I do not regret the decision, but preparation mattered.','No me arrepiento de la decisión, pero prepararse fue importante.']],[['Un hablante que menciona un inconveniente rechaza toda la propuesta.','Puede apoyar la propuesta con reservas o condiciones.','La actitud global depende del conjunto de la intervención.'],['Una racha larga demuestra dominio de todas las habilidades.','La racha registra constancia, no todas las capacidades lingüísticas.','La comprensión y la transferencia requieren evidencia adicional.']],

(()=>{

state.study={lastUnit:{},read:{},checks:{},...state.study};
for(const key of ['lastUnit','read','checks'])if(!state.study[key]||typeof state.study[key]!=='object')state.study[key]={};

function route(){

const list=units(),done=overall(state.level),last=list.find(unit=>unit.id===state.study.lastUnit[state.level]);
const next=last&&!statsFor(state.level,last).complete?last:list.find(unit=>!statsFor(state.level,unit).complete)||list[0];
app.innerHTML=`<section class="panel study-intro"><span class="study-kicker">RUTA DE ESTUDIO · ${state.level}</span><h2>Entender, practicar, avanzar.</h2><p>12 unidades para conectar las explicaciones con la práctica. Podés seguir el orden sugerido o elegir cualquier tema.</p><div class="stats"><span>${done} de ${list.length} unidades recorridas</span><span>2.000 ejercicios entre B1 y B2</span></div><div class="progress study-route-progress"><div style="width:${done/list.length*100}%"></div></div><p class="study-suggest"><b>${done===list.length?'Seguí repasando':'Tu próximo paso'}:</b> ${esc(next.title)}</p><button class="primary" id="study-continue">${done===list.length?'Volver a la primera unidad':'Continuar mi ruta'} →</button><p class="study-note">Una unidad se considera recorrida cuando marcás la explicación como leída y respondés al menos cinco de sus ejercicios. Eso registra el recorrido, no certifica dominio del tema.</p></section><section class="study-grid">${list.map((unit,i)=>{
const s=statsFor(state.level,unit);
return `<article class="study-card ${s.complete?'study-done':''} ${unit.id===next.id&&!s.complete?'study-next':''}"><span class="study-pill">UNIDAD ${String(i+1).padStart(2,'0')} · ${s.complete?'RECORRIDA':s.read?'EXPLICACIÓN LEÍDA':s.seen?'PRÁCTICA INICIADA':'POR EXPLORAR'}</span><h3>${esc(unit.title)}</h3><p>${esc(unit.goal)}</p><small>${s.seen} / ${s.available} ejercicios practicados · ${s.wrong} errores pendientes</small><button data-unit="${unit.id}" style="margin-top:15px">${s.complete?'Repasar la unidad':'Ver explicación'} →</button></article>`;
}).join('')}</section><p class="study-note">Los temas pueden relacionarse entre unidades. Si ya practicaste ejercicios de un tema, se reflejan acá. La práctica libre sigue disponible en “Practicar”.</p>`;
document.querySelector('#study-continue').onclick=()=>openUnit(next.id);
app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>openUnit(b.dataset.unit));
scrollTop();
}
function openUnit(id){
stopVoice();session=null;view='lesson';navState('study-route');
const list=units(),unit=list.find(u=>u.id===id);if(!unit){route();return}
state.study.lastUnit[state.level]=id;save();
const key=unitKey(state.level,id),s=statsFor(state.level,unit),index=list.indexOf(unit),check=unit.check;
const selected=state.study.checks[key];
const answered=Number.isInteger(selected)&&selected>=0&&selected<check[1].length;
const blocks=Object.entries(unit.practice).flatMap(([type,topics])=>topics.map(t=>({type,topic:t,count:data[state.level][type].filter(q=>q[5]?.topic===t).length}))).filter(x=>x.count);
app.innerHTML=`<section class="panel study-top"><button id="study-back">← Mi ruta</button><p class="study-kicker">${state.level} · UNIDAD ${String(index+1).padStart(2,'0')} DE ${list.length}</p><h2>${esc(unit.title)}</h2><p><b>Al terminar:</b> ${esc(unit.goal)}</p><p class="study-note">Ritmo sugerido: leé la explicación y después hacé una sesión breve. Podés volver a esta página cuando lo necesites.</p><div class="study-sections">${unit.blocks.map(([heading,text])=>`<h3>${esc(heading)}</h3><p>${esc(text)}</p>`).join('')}</div><h3>Ejemplos en contexto</h3><div class="study-examples">${unit.examples.map(([en,es])=>`<div class="study-example"><p lang="en"><b>${esc(en)}</b></p><p>${esc(es)}</p></div>`).join('')}</div><h3>Errores y confusiones frecuentes</h3>${unit.mistakes.map(([before,after,why])=>`<div class="study-mistake"><p><b>Revisá:</b> ${esc(before)}</p><p><b>Mejor:</b> ${esc(after)}</p><p class="study-note">${esc(why)}</p></div>`).join('')}<h3>Comprobación rápida</h3><p class="study-note">Esta pregunta es parte de la explicación; no modifica las estadísticas de los 2.000 ejercicios.</p><p><b>${esc(check[0])}</b></p><div class="study-check">${check[1].map((a,i)=>`<button data-check="${i}" ${answered?'disabled':''} class="${answered&&i===check[2]?'correct':answered&&i===selected?'wrong':''}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div id="study-check-result" aria-live="polite">${answered?checkFeedback(unit,selected):''}</div><div class="study-actions"><button id="study-read" class="${s.read?'study-read':'primary'}">${s.read?'✓ Explicación marcada como leída':'Ya leí la explicación'}</button><button id="study-retry-check">Reintentar comprobación</button></div><p id="study-read-status" class="study-note" aria-live="polite">${s.read?'Podés pasar a los ejercicios o volver a leer.':'Marcala como leída cuando hayas terminado de revisarla.'}</p><h3>Ahora, llevá la idea a la práctica</h3><p>${s.seen} de ${s.available} ejercicios relacionados respondidos. ${s.wrong} para repasar.</p><div class="study-practice">${blocks.map((b,i)=>`<button data-practice="${i}"><b>${esc(b.type)}</b><br>${esc(b.topic)}<small>${b.count} ejercicios disponibles</small></button>`).join('')}</div><p class="study-note">Una unidad recorrida requiere explicación leída y cinco ejercicios respondidos. Los aciertos y errores se muestran por separado para ayudarte a decidir qué repasar.</p><div class="study-actions"><button id="study-route-bottom">Ver toda la ruta</button>${index<list.length-1?'<button id="study-next">Ver la siguiente explicación →</button>':''}</div></section>`;
document.querySelector('#study-back').onclick=route;
document.querySelector('#study-route-bottom').onclick=route;
if(index<list.length-1)document.querySelector('#study-next').onclick=()=>openUnit(list[index+1].id);
app.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
const choice=Number(b.dataset.check);state.study.checks[key]=choice;save();
app.querySelectorAll('[data-check]').forEach(option=>{option.disabled=true;const n=Number(option.dataset.check);if(n===check[2])option.classList.add('correct');else if(n===choice)option.classList.add('wrong')});
document.querySelector('#study-check-result').innerHTML=checkFeedback(unit,choice);
});
document.querySelector('#study-retry-check').onclick=()=>{delete state.study.checks[key];save();openUnit(id)};
document.querySelector('#study-read').onclick=()=>{
state.study.read[key]=true;save();
const b=document.querySelector('#study-read');b.textContent='✓ Explicación marcada como leída';b.classList.remove('primary');b.classList.add('study-read');
document.querySelector('#study-read-status').textContent='Guardado. Elegí un bloque de práctica para continuar.';
};
app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{
const block=blocks[Number(b.dataset.practice)];view='free';navState('home');window.englishPathApp.choose(block.type,block.topic,'mixed');
});
scrollTop();
}
function checkFeedback(unit,selected){
return `<div class="feedback study-check-feedback"><b>${selected===unit.check[2]?'¡Bien!':'Revisemos la idea.'}</b><p>Respuesta: ${esc(unit.check[1][unit.check[2]])}</p>${esc(unit.check[3])}</div>`;
}
const freeHome=home;
home=function(){view='free';navState('home');freeHome()};
const oldProgress=progress;
progress=function(){
view='progress';navState('progress');oldProgress();
document.querySelector('#reset').onclick=()=>{if(confirm('¿Borrar todas tus respuestas, marcas de lectura y comprobaciones en este navegador?')){state.answers=0;state.correct=0;state.completed=[];state.practice={};state.study={lastUnit:{},read:{},checks:{}};save();progress()}};
const section=document.createElement('section');section.className='panel';
section.innerHTML=`<h2>Tu ruta de estudio</h2>${['B1','B2'].map(l=>`<p><b>${l}:</b> ${overall(l)} / ${lessons[l].length} unidades recorridas · ${lessons[l].filter(u=>state.study.read[unitKey(l,u.id)]).length} explicaciones marcadas como leídas</p>`).join('')}<p class="study-note">Recorrida significa explicación leída y al menos cinco ejercicios respondidos. No es una evaluación completa del nivel.</p><button id="study-from-progress">Continuar mi ruta →</button><button id="study-reset" style="margin-top:10px">Reiniciar solo mi ruta</button>`;
app.appendChild(section);
document.querySelector('#study-from-progress').onclick=route;
document.querySelector('#study-reset').onclick=()=>{if(confirm('¿Borrar las marcas de lectura y comprobaciones de la ruta? Tus respuestas a los 2.000 ejercicios se conservan.')){state.study={lastUnit:{},read:{},checks:{}};save();progress()}};
};
button.onclick=route;
document.querySelector('#home').onclick=home;
document.querySelector('#progress').onclick=progress;
level.onchange=()=>{
state.level=level.value;save();
if(view==='progress')progress();else if(view==='free')home();else route();
};
save();route();
window.englishStudy={route,openUnit,statsFor,recordsFor,overall};
})();

</script>
</body></html>
