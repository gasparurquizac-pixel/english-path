(()=>{
if(window.englishPathStudyRoute)return;
window.englishPathStudyRoute=true;
const lessons=window.englishLessons;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
state.study={lastUnit:{},read:{},checks:{},...state.study};
for(const key of ['lastUnit','read','checks'])if(!state.study[key]||typeof state.study[key]!=='object')state.study[key]={};
let view='route';
const unitKey=(level,id)=>level+':'+id;
const units=()=>lessons[state.level];
const recordsFor=(level,unit)=>{
const result=[];
for(const [type,topics] of Object.entries(unit.practice))data[level][type].forEach((q,i)=>{
if(topics.includes(q[5]?.topic))result.push({type,index:i,q,record:state.practice[`${level}:${type}:${i}`]});
});
return result;
};
const statsFor=(level,unit)=>{
const rows=recordsFor(level,unit),seen=rows.filter(x=>x.record),right=seen.filter(x=>x.record.correct);
const read=!!state.study.read[unitKey(level,unit.id)];
return {available:rows.length,seen:seen.length,right:right.length,wrong:seen.length-right.length,read,complete:read&&seen.length>=5};
};
const overall=level=>lessons[level].filter(unit=>statsFor(level,unit).complete).length;
const nav=document.querySelector('nav');
const button=document.createElement('button');button.id='study-route';button.textContent='Mi ruta';
nav.prepend(button);
const navState=active=>{
for(const id of ['study-route','home','progress']){
const b=document.querySelector('#'+id);
if(id===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
}
};
const style=document.createElement('style');
style.textContent=`nav button[aria-current="page"]{background:#286348;color:#fff;border-color:#286348}.study-intro{background:#e7eddc}.study-kicker{font-size:12px;letter-spacing:.08em;color:#526d58}.study-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.study-card{background:white;border:1px solid #dce3d5;border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:flex-start}.study-card h3{font-size:18px;line-height:1.4;margin:12px 0 5px}.study-card p{font-size:14px;margin:8px 0 16px}.study-card button{margin-top:auto}.study-pill{font-size:11px;border-radius:8px;padding:5px 9px;background:#edf2e6;color:#456244}.study-next{border:2px solid #65805a}.study-done{background:#f1f7eb}.study-note{font-size:13px;color:#63766a;line-height:1.7}.study-sections h3{margin-top:26px}.study-examples{display:grid;gap:12px}.study-example{border-left:3px solid #8ca174;padding:12px 16px;background:#f4f7ef}.study-example p{margin:0}.study-example p+p{font-size:14px;color:#63766a;margin-top:5px}.study-mistake{border:1px solid #eadfd2;border-radius:10px;padding:16px;margin:12px 0}.study-mistake p{margin:5px 0}.study-check button{display:block;text-align:left;width:100%;margin:8px 0}.study-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.study-practice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.study-practice button{text-align:left}.study-practice small{display:block;margin-top:5px}.study-check-feedback{font-size:14px}.study-suggest{border-left:3px solid #8ca174;padding-left:14px}.study-route-progress{margin:18px 0}.study-read{background:#e5eedb;color:#203d34}.study-top{scroll-margin-top:16px}@media(max-width:560px){.study-grid,.study-practice{grid-template-columns:1fr}.study-actions button{width:100%}nav{gap:6px}nav button{padding:11px 6px;font-size:14px}.study-card{padding:18px}}`;
document.head.appendChild(style);
function scrollTop(){if(typeof window.scrollTo==='function')window.scrollTo({top:0,behavior:'instant'})}
function route(){
stopVoice();session=null;view='route';navState('study-route');
const list=units(),done=overall(state.level),last=list.find(unit=>unit.id===state.study.lastUnit[state.level]);
const next=last&&!statsFor(state.level,last).complete?last:list.find(unit=>!statsFor(state.level,unit).complete)||list[0];
app.innerHTML=`<section class="panel study-intro"><span class="study-kicker">RUTA DE ESTUDIO · ${state.level}</span><h2>Entender, practicar, avanzar.</h2><p>12 unidades para conectar las explicaciones con la práctica. Podés seguir el orden sugerido o elegir cualquier tema.</p><div class="stats"><span>${done} de ${list.length} unidades recorridas</span><span>2.000 ejercicios entre B1 y B2</span></div><div class="progress study-route-progress"><div style="width:${done/list.length*100}%"></div></div><p class="study-suggest"><b>${done===list.length?'Seguí repasando':'Tu próximo paso'}:</b> ${esc(next.title)}</p><button class="primary" id="study-continue">${done===list.length?'Volver a la primera unidad':'Continuar mi ruta'} →</button><p class="study-note">Una unidad se considera recorrida cuando marcás la explicación como leída y respondés al menos cinco de sus ejercicios. Eso registra el recorrido, no certifica dominio del tema.</p></section><section class="study-grid">${list.map((unit,i)=>{
const s=statsFor(state.level,unit);
return `<article class="study-card ${s.complete?'study-done':''} ${unit.id===next.id&&!s.complete?'study-next':''}"><span class="study-pill">UNIDAD ${String(i+1).padStart(2,'0')} · ${s.complete?'RECORRIDA':s.read?'EXPLICACIÓN LEÍDA':s.seen?'PRÁCTICA INICIADA':'POR EXPLORAR'}</span><h3>${esc(unit.title)}</h3><p>${esc(unit.goal)}</p><small>${s.seen} / ${s.available} ejercicios practicados · ${s.wrong} errores pendientes</small><button data-unit="${unit.id}" style="margin-top:15px">${s.complete?'Repasar la unidad':'Ver explicación'} →</button></article>`;
}).join('')}</section><p class="study-note">Los temas pueden relacionarse entre unidades. Si ya practicaste ejercicios de un tema, se reflejan acá. La práctica libre sigue disponible en “Practicar”.</p>`;
document.querySelector('#study-continue').onclick=()=>openUnit(next.id);
app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>openUnit(b.dataset.unit));
scrollTop();
}
function openUnit(id){
stopVoice();session=null;view='lesson';navState('study-route');
const list=units(),unit=list.find(u=>u.id===id);if(!unit){route();return}
state.study.lastUnit[state.level]=id;save();
const key=unitKey(state.level,id),s=statsFor(state.level,unit),index=list.indexOf(unit),check=unit.check;
const selected=state.study.checks[key];
const answered=Number.isInteger(selected)&&selected>=0&&selected<check[1].length;
const blocks=Object.entries(unit.practice).flatMap(([type,topics])=>topics.map(t=>({type,topic:t,count:data[state.level][type].filter(q=>q[5]?.topic===t).length}))).filter(x=>x.count);
app.innerHTML=`<section class="panel study-top"><button id="study-back">← Mi ruta</button><p class="study-kicker">${state.level} · UNIDAD ${String(index+1).padStart(2,'0')} DE ${list.length}</p><h2>${esc(unit.title)}</h2><p><b>Al terminar:</b> ${esc(unit.goal)}</p><p class="study-note">Ritmo sugerido: leé la explicación y después hacé una sesión breve. Podés volver a esta página cuando lo necesites.</p><div class="study-sections">${unit.blocks.map(([heading,text])=>`<h3>${esc(heading)}</h3><p>${esc(text)}</p>`).join('')}</div><h3>Ejemplos en contexto</h3><div class="study-examples">${unit.examples.map(([en,es])=>`<div class="study-example"><p lang="en"><b>${esc(en)}</b></p><p>${esc(es)}</p></div>`).join('')}</div><h3>Errores y confusiones frecuentes</h3>${unit.mistakes.map(([before,after,why])=>`<div class="study-mistake"><p><b>Revisá:</b> ${esc(before)}</p><p><b>Mejor:</b> ${esc(after)}</p><p class="study-note">${esc(why)}</p></div>`).join('')}<h3>Comprobación rápida</h3><p class="study-note">Esta pregunta es parte de la explicación; no modifica las estadísticas de los 2.000 ejercicios.</p><p><b>${esc(check[0])}</b></p><div class="study-check">${check[1].map((a,i)=>`<button data-check="${i}" ${answered?'disabled':''} class="${answered&&i===check[2]?'correct':answered&&i===selected?'wrong':''}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div id="study-check-result" aria-live="polite">${answered?checkFeedback(unit,selected):''}</div><div class="study-actions"><button id="study-read" class="${s.read?'study-read':'primary'}">${s.read?'✓ Explicación marcada como leída':'Ya leí la explicación'}</button><button id="study-retry-check">Reintentar comprobación</button></div><p id="study-read-status" class="study-note" aria-live="polite">${s.read?'Podés pasar a los ejercicios o volver a leer.':'Marcala como leída cuando hayas terminado de revisarla.'}</p><h3>Ahora, llevá la idea a la práctica</h3><p>${s.seen} de ${s.available} ejercicios relacionados respondidos. ${s.wrong} para repasar.</p><div class="study-practice">${blocks.map((b,i)=>`<button data-practice="${i}"><b>${esc(b.type)}</b><br>${esc(b.topic)}<small>${b.count} ejercicios disponibles</small></button>`).join('')}</div><p class="study-note">Una unidad recorrida requiere explicación leída y cinco ejercicios respondidos. Los aciertos y errores se muestran por separado para ayudarte a decidir qué repasar.</p><div class="study-actions"><button id="study-route-bottom">Ver toda la ruta</button>${index<list.length-1?'<button id="study-next">Ver la siguiente explicación →</button>':''}</div></section>`;
document.querySelector('#study-back').onclick=route;
document.querySelector('#study-route-bottom').onclick=route;
if(index<list.length-1)document.querySelector('#study-next').onclick=()=>openUnit(list[index+1].id);
app.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
const choice=Number(b.dataset.check);state.study.checks[key]=choice;save();
app.querySelectorAll('[data-check]').forEach(option=>{option.disabled=true;const n=Number(option.dataset.check);if(n===check[2])option.classList.add('correct');else if(n===choice)option.classList.add('wrong')});
document.querySelector('#study-check-result').innerHTML=checkFeedback(unit,choice);
});
document.querySelector('#study-retry-check').onclick=()=>{delete state.study.checks[key];save();openUnit(id)};
document.querySelector('#study-read').onclick=()=>{
state.study.read[key]=true;save();
const b=document.querySelector('#study-read');b.textContent='✓ Explicación marcada como leída';b.classList.remove('primary');b.classList.add('study-read');
document.querySelector('#study-read-status').textContent='Guardado. Elegí un bloque de práctica para continuar.';
};
app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{
const block=blocks[Number(b.dataset.practice)];view='free';navState('home');window.englishPathApp.choose(block.type,block.topic,'mixed');
});
window.klevyProductive?.appendUnitPractice(state.level,unit.id);
scrollTop();
}
function checkFeedback(unit,selected){
return `<div class="feedback study-check-feedback"><b>${selected===unit.check[2]?'¡Bien!':'Revisemos la idea.'}</b><p>Respuesta: ${esc(unit.check[1][unit.check[2]])}</p>${esc(unit.check[3])}</div>`;
}
const freeHome=home;
home=function(){view='free';navState('home');freeHome()};
const oldProgress=progress;
progress=function(){
view='progress';navState('progress');oldProgress();
document.querySelector('#reset').onclick=()=>{if(confirm('¿Borrar todas tus respuestas, marcas de lectura y comprobaciones en este navegador?')){state.answers=0;state.correct=0;state.completed=[];state.practice={};state.study={lastUnit:{},read:{},checks:{}};save();progress()}};
const section=document.createElement('section');section.className='panel';
section.innerHTML=`<h2>Tu ruta de estudio</h2>${['B1','B2'].map(l=>`<p><b>${l}:</b> ${overall(l)} / ${lessons[l].length} unidades recorridas · ${lessons[l].filter(u=>state.study.read[unitKey(l,u.id)]).length} explicaciones marcadas como leídas</p>`).join('')}<p class="study-note">Recorrida significa explicación leída y al menos cinco ejercicios respondidos. No es una evaluación completa del nivel.</p><button id="study-from-progress">Continuar mi ruta →</button><button id="study-reset" style="margin-top:10px">Reiniciar solo mi ruta</button>`;
app.appendChild(section);
document.querySelector('#study-from-progress').onclick=route;
document.querySelector('#study-reset').onclick=()=>{if(confirm('¿Borrar las marcas de lectura y comprobaciones de la ruta? Tus respuestas a los 2.000 ejercicios se conservan.')){state.study={lastUnit:{},read:{},checks:{}};save();progress()}};
};
button.onclick=route;
document.querySelector('#home').onclick=home;
document.querySelector('#progress').onclick=progress;
level.onchange=()=>{
state.level=level.value;save();
if(view==='progress')progress();else if(view==='free')home();else route();
};
save();route();
window.englishStudy={route,openUnit,statsFor,recordsFor,overall};
})();

</script>



<script>
(()=>{
window.klevyPracticeTasks={
speaking:{B1:[
{id:'daily-introduction',title:'Presentarte y contar tu rutina',goal:'Hablar de tu vida y comparar lo habitual con esta semana.',seconds:60,brief:['Presentate sin dar datos privados.','Describí dos hábitos y algo diferente que hacés esta semana.','Explicá qué querés mejorar de tu inglés.'],question:'Tell me a little about yourself. What do you usually do during the week, and what is different this week?',followUp:'Which part of your daily routine would you like to change, and why?',chunks:['I usually… but this week I am…','One thing I would like to improve is…'],model:'I work during the week and usually study English in the evening. I often practise for fifteen minutes after dinner. This week I am spending more time on speaking because I want to feel more confident. At weekends, I like walking and meeting friends. One thing I would like to improve is understanding people when they speak quickly.',review:['Diferencié una rutina de una situación temporal.','Añadí al menos una razón o un ejemplo.','Elegí una frase que quiero decir con más claridad.']},
{id:'hotel-problem',title:'Resolver un problema en el hotel',goal:'Explicar un problema y pedir una solución con cortesía.',seconds:60,brief:['Reservaste una habitación tranquila, pero la tuya da a una calle ruidosa.','Explicá el problema y pedí cambiar de habitación.','Preguntá si hay algún cargo adicional.'],question:'Good evening. You said there was a problem with your room. How can I help?',followUp:'We have a quieter room available tomorrow. Would that work for you?',chunks:['I booked… but unfortunately…','Would it be possible to…?'],model:'Good evening. I booked a quiet room, but my room is next to a very busy road. I could not sleep well last night. Would it be possible to move to a quieter room? I do not mind a smaller room. Could you also tell me if there would be an extra charge? Thank you for your help.',review:['Expliqué qué reservé y cuál es el problema.','Pedí una solución concreta con cortesía.','Incluí una pregunta sobre el costo.']},
{id:'past-experience',title:'Contar algo que no salió como esperabas',goal:'Narrar un hecho pasado con orden y un resultado.',seconds:75,brief:['Elegí una experiencia real sencilla o inventá una para practicar.','Contá qué planeabas, qué pasó y cómo reaccionaste.','Terminá con lo que aprendiste.'],question:'Tell me about a day when your plans changed unexpectedly. What happened, and what did you do?',followUp:'If something similar happened again, what would you do differently?',chunks:['At first… Then… In the end…','While I was… something happened.'],model:'Last month, I planned to visit a friend in another town. While I was waiting at the station, I heard that my train was cancelled. At first, I felt worried because my friend was already preparing lunch. I called her and found a bus instead. I arrived late, but we still had a lovely afternoon. I learned to check transport updates before leaving home.',review:['Ordené los hechos para que se entiendan.','Usé pasado para narrar la experiencia.','Expliqué el resultado o una lección.']},
{id:'transport-choice',title:'Elegir cómo viajar',goal:'Comparar opciones y justificar una preferencia.',seconds:60,brief:['El tren cuesta £24 y tarda una hora. El autobús cuesta £12 y tarda dos horas.','Elegí para un viaje en el que querés llegar a tiempo a una entrevista.','Compará costo, tiempo y comodidad.'],question:'You can take a train or a bus to your interview. Which would you choose, and why?',followUp:'Would you make the same choice if you were travelling for a holiday instead?',chunks:['The train is faster than…','Although it costs more, I would…'],model:'I would choose the train for the interview. It is more expensive than the bus, but it takes only one hour. I would like to arrive early and have time to relax. The bus is cheaper, so it could be a good choice for a holiday. For this journey, though, saving time is more important to me than saving money.',review:['Comparé las dos opciones.','Relacioné mi elección con la entrevista.','Mencioné una ventaja de la otra opción.']},
{id:'appointment-call',title:'Cambiar una cita por teléfono',goal:'Dar un motivo y acordar un horario nuevo.',seconds:60,brief:['Tenés una cita el martes a las 10, pero trabajás a esa hora.','Pedí otro horario por la tarde.','Confirmá el día y la nueva hora antes de despedirte.'],question:'Hello, reception speaking. How can I help you today?',followUp:'We can offer you Tuesday at four or Thursday at three. Which is more convenient?',chunks:['I have an appointment on… at…','Could I change it to…?'],model:'Hello. I have an appointment on Tuesday at ten, but I have to work that morning. Could I change it to a time in the afternoon? Tuesday at four would be convenient for me. So, just to confirm, the new appointment is on Tuesday at four o’clock. Do I need to bring anything? Thank you very much.',review:['Di el motivo del cambio.','Propuse o acepté una alternativa.','Confirmé día y hora.']},
{id:'advice-friend',title:'Aconsejar sin dar órdenes',goal:'Dar sugerencias y explicar por qué pueden ayudar.',seconds:60,brief:['Un amigo tiene muchas tareas y poco tiempo para estudiar.','Proponé dos cambios realistas.','Reconocé que no todas las soluciones sirven para todos.'],question:'I want to study English, but I am always busy and tired. What would you suggest?',followUp:'What could I do on a day when I only have five minutes?',chunks:['You could try…','If I were you, I would…'],model:'You could try studying for a short time every day instead of doing a long lesson at the weekend. If I were you, I would choose a regular time, perhaps after breakfast. You should also pick activities you enjoy, such as a short podcast. Of course, everyone’s routine is different. On a very busy day, even five minutes of practice can help you keep the habit.',review:['Di dos sugerencias concretas.','Usé lenguaje de consejo y no solo órdenes.','Expliqué al menos una razón.']},
{id:'message-summary',title:'Escuchar un mensaje y responder',goal:'Recuperar los detalles importantes y confirmar una acción.',seconds:60,brief:['Escuchá el mensaje sin mirar la transcripción primero.','Resumí cuándo y dónde es la reunión y qué necesitás llevar.','Respondé para confirmar y hacé una pregunta útil.'],question:'Hi! Our meeting is still on Friday at eleven, but we have moved it to the room beside reception. Please bring your laptop and the latest version of the report. You do not need to print it. Can you confirm that you will be there?',followUp:'What would you say if you could attend but could not bring your laptop?',chunks:['Just to confirm…','I will bring… Do we also need…?'],model:'Thanks for the message. Just to confirm, the meeting is on Friday at eleven in the room beside reception. I will bring my laptop and the latest report, and I will not print it. I will be there a few minutes early. Do we also need to prepare a short presentation, or will we only discuss the report?',review:['Recuperé los datos sin cambiar su significado.','Confirmé lo que voy a hacer.','Añadí una pregunta pertinente.']},
{id:'local-opinion',title:'Opinar sobre tu ciudad',goal:'Expresar una opinión con razones y un ejemplo.',seconds:75,brief:['Elegí una mejora para una ciudad real o imaginaria: transporte, parques o bibliotecas.','Da dos razones y un ejemplo.','Mencioná una dificultad posible.'],question:'What is one change that would make your town or city a better place to live?',followUp:'Who would benefit most from that change, and who might find it difficult?',chunks:['In my opinion…','For example… However…'],model:'In my opinion, the city should improve its bus service. More reliable buses would help people get to work on time and could reduce the number of cars. For example, a bus every fifteen minutes would make it easier to travel without driving. However, the council would need money and more drivers. I think it could start by improving the busiest routes.',review:['Mi opinión principal quedó clara.','La apoyé con razones y un ejemplo.','Reconocí una dificultad.']}
],B2:[
{id:'negotiate-pilot',title:'Negociar un proyecto piloto',goal:'Expresar reservas y ofrecer apoyo condicionado.',seconds:90,brief:['Tu equipo quiere lanzar un servicio el mes próximo. El equipo de soporte ya está al límite.','Proponé un piloto pequeño y una condición medible.','Explicá qué dejarías para una segunda etapa.'],question:'We would like to launch the full service next month. Can we count on your support?',followUp:'If the pilot works well but the support workload doubles, would you still expand it?',chunks:['I could support that, provided…','My main reservation is…'],model:'I can see the benefits of launching soon, but my main reservation is the support team’s capacity. I could support a pilot with one department, provided we set a limit on the number of users and review the workload after two weeks. I would postpone the optional features rather than promise support we cannot deliver. If the results are positive and the workload remains manageable, we could expand gradually.',review:['Expresé una reserva específica sin rechazar todo.','Propuse una condición y cómo revisarla.','Expliqué un equilibrio entre alcance y recursos.']},
{id:'evaluate-evidence',title:'Explicar qué permite concluir un estudio',goal:'Separar resultados observados de explicaciones posibles.',seconds:90,brief:['Un curso voluntario obtuvo mejores notas. Los participantes también recibieron tutorías adicionales.','Explicá por qué el resultado es prometedor pero no prueba qué lo causó.','Proponé una mejora para la siguiente evaluación.'],question:'The volunteers who took our course improved their scores. Does this prove that the new materials are effective?',followUp:'What evidence would make you more confident about the materials?',chunks:['The results are encouraging; however…','One alternative explanation is…'],model:'The results are encouraging, but they do not establish that the materials caused the improvement. The volunteers may have been more motivated, and they also received extra tutoring. Either factor could explain part of the difference. I would compare groups receiving the same amount of tutor contact and, where practical, assign participants randomly. That would not remove every limitation, but it would make the conclusion more convincing.',review:['Diferencié mejora y causalidad.','Mencioné dos explicaciones alternativas.','Propuse una comparación más justa.']},
{id:'balanced-remote-work',title:'Defender una opinión con matices',goal:'Presentar una postura, reconocer una objeción y responderla.',seconds:90,brief:['Opiná sobre trabajo remoto o híbrido.','Incluí una ventaja, un riesgo y una condición para que funcione.','Evitá presentar tu experiencia como una regla universal.'],question:'Should every employee who can work remotely be allowed to do so all the time?',followUp:'How would you respond to a manager who says collaboration always requires an office?',chunks:['I would distinguish between…','That concern is valid, although…'],model:'I would avoid a single rule for every role. Remote work can reduce commuting and give people more flexibility, but it can also make informal support harder to access. A hybrid arrangement may work well if expectations are clear and office days have a purpose. The concern about collaboration is valid, although physical presence does not automatically produce it. I would judge arrangements by their effects on the team rather than by attendance alone.',review:['Planteé una postura con límites claros.','Tomé en serio una objeción.','Di un criterio para evaluar la propuesta.']},
{id:'repair-misunderstanding',title:'Reparar un malentendido profesional',goal:'Reconocer tu parte, aclarar la situación y acordar un cambio.',seconds:75,brief:['Pediste un informe “pronto”, pero no especificaste el viernes como fecha límite.','Reconocé la ambigüedad sin culpar a la otra persona.','Acordá una fecha viable y una forma de confirmar futuros plazos.'],question:'I did not realise you needed the report by Friday. Your email only said soon. What should we do now?',followUp:'What would you do if the original deadline could no longer be met?',chunks:['I can see how that was unclear.','Let us agree on a realistic…'],model:'I can see how that was unclear. I assumed the deadline was understood, but I should have stated it explicitly. Let us check what can realistically be completed by Friday and whether we need to adjust the scope. If that is not workable, I will explain the revised timeline to the client. In future, I will include a specific date and ask you to confirm it rather than rely on an assumption.',review:['Reconocí la ambigüedad y mi responsabilidad.','Propuse una solución concreta.','Expliqué cómo evitar repetir el problema.']},
{id:'compare-suppliers',title:'Comparar propuestas más allá del precio',goal:'Justificar una recomendación considerando costos y riesgos.',seconds:90,brief:['Proveedor A: £2.000 iniciales y soporte incluido. Proveedor B: £1.400 iniciales y soporte mensual aparte.','Decí qué información falta antes de elegir.','Proponé criterios comunes para comparar. No hace falta calcular un precio final.'],question:'Supplier B has the lowest initial price. Should we choose it?',followUp:'How would your recommendation change if we only needed the service for three months?',chunks:['The initial price does not tell us…','To compare like with like…'],model:'Not necessarily. The initial price does not tell us the total commitment. We need to know the monthly support fee, the minimum contract length and the cost of transferring our records. I would ask both suppliers for comparable estimates over the period we expect to use the service. I would also check support quality and cancellation terms. Supplier B may still be better value, but the lower first payment is not enough to establish that.',review:['Identifiqué información faltante.','Propuse una comparación coherente.','Evité afirmar un resultado que los datos no prueban.']},
{id:'reflect-past-decision',title:'Reflexionar sobre una decisión',goal:'Relacionar una decisión pasada, sus consecuencias y un aprendizaje.',seconds:90,brief:['Elegí una decisión real sencilla o un ejemplo ficticio.','Explicá el contexto, el resultado y una alternativa posible.','Usá una estructura de arrepentimiento o condicional pasado sin forzarla.'],question:'Tell me about a decision that taught you something important. What might have happened if you had chosen differently?',followUp:'Has that experience changed the way you make decisions now?',chunks:['Looking back, I wish I had…','If I had…, I might have…'],model:'I once accepted a project without checking how much time it would require. I was pleased to be offered it, but I underestimated the amount of preparation. In the end, I completed it by giving up most of my weekend. Looking back, I wish I had clarified the scope first. If I had asked more questions, I might have negotiated a longer deadline. Since then, I have tried to discuss expectations before making a commitment.',review:['La relación entre decisión y resultado se entendió.','Expresé una alternativa pasada de forma coherente.','Expliqué un cambio en mi manera de actuar.']},
{id:'tourism-discussion',title:'Responder a una objeción en un debate',goal:'Integrar un punto válido de la otra persona y mantener tu posición.',seconds:90,brief:['Una ciudad recibe turismo, pero algunos residentes tienen dificultades con los alquileres.','Reconocé los beneficios del turismo.','Proponé una medida y explicá cómo evaluar sus efectos.'],question:'Tourism brings jobs. Why should we put any limits on it?',followUp:'How could we tell whether your proposal was helping residents without harming local businesses?',chunks:['I agree that…, but that does not mean…','A proportionate response might be…'],model:'I agree that tourism brings employment, and I would not want to lose that benefit. However, it does not follow that unlimited growth benefits everyone equally. If long-term housing becomes scarce, residents may bear substantial costs. A proportionate response could protect housing while encouraging visits outside the busiest season. I would monitor rents, the availability of year-round jobs and feedback from local businesses, rather than use visitor numbers as the only measure of success.',review:['Reconocí un punto válido del argumento contrario.','Propuse una medida proporcionada.','Di indicadores para evaluar resultados.']},
{id:'job-interview',title:'Explicar tus capacidades en una entrevista',goal:'Sostener una afirmación con un ejemplo y una reflexión.',seconds:90,brief:['Elegí una capacidad: organizar, colaborar, resolver problemas o aprender.','Usá un ejemplo real o aclaradamente ficticio para practicar.','Explicá tu acción, el resultado y qué mejorarías.'],question:'Could you describe a time when you solved a problem or helped a team work more effectively?',followUp:'What would you change if you faced the same situation again?',chunks:['The situation was… My role was…','The result was… What I learned was…'],model:'In one project, our team was missing deadlines because responsibilities were unclear. I suggested a short planning meeting and a shared list showing who owned each task. My role was to organise the first version and check that the team found it useful. We identified overlaps and reduced last-minute confusion. I would not claim that the list solved everything, but it made responsibilities more visible. Next time, I would agree on the process earlier.',review:['Di un ejemplo que respalda mi capacidad.','Diferencié mi contribución del trabajo del equipo.','Incluí un aprendizaje o una mejora.']}
]},
writing:{B1:[
{id:'friendly-email',title:'Un correo para organizar una visita',goal:'Dar información y hacer preguntas en un mensaje amistoso.',range:[80,120],prompt:'A friend is visiting your town next month. Write an email suggesting a place to stay, one activity you could do together and two things you need to know about the visit.',points:['Sugerí alojamiento y explicá por qué.','Proponé una actividad concreta.','Hacé dos preguntas útiles sobre la visita.'],plan:['Saludo y motivo del correo.','Alojamiento y actividad con una razón.','Dos preguntas y despedida.'],chunks:['It would be great to…','You could stay… because…','Could you tell me…?'],model:'Hi Alex,\nI am really happy that you are visiting next month. You could stay at the small hotel near the station because it is comfortable and easy to reach. We could visit the local market on Saturday and have lunch by the river. There are also some lovely walks nearby if the weather is good.\nCould you tell me what time you will arrive? Also, are you staying for the whole weekend or only one night? I can meet you at the station if you like.\nSee you soon!\nSam',notes:['El mensaje cubre los tres objetivos y organiza la información en párrafos.','Because explica una recomendación; las preguntas finales permiten preparar la visita.']},
{id:'change-appointment',title:'Pedir un cambio de cita',goal:'Explicar un problema y solicitar una alternativa con cortesía.',range:[70,110],prompt:'You have a course interview on Tuesday morning, but you must work then. Write to the organiser asking to change the appointment. Explain the problem, suggest two alternatives and ask for confirmation.',points:['Identificá la cita original.','Explicá el motivo y proponé dos alternativas.','Pedí confirmación de la nueva cita.'],plan:['Presentación breve y cita original.','Motivo y opciones de horario.','Agradecimiento y pedido de confirmación.'],chunks:['Unfortunately, I am unable to…','Would it be possible to…?','Please let me know whether…'],model:'Dear organiser,\nI have an interview for the evening course on Tuesday at ten. Unfortunately, I have to work that morning and cannot attend at the arranged time.\nWould it be possible to move the interview to Tuesday after four or Thursday afternoon? I am available at either time and can attend online if that is easier.\nPlease let me know whether one of these options is possible and confirm the new time. I am sorry for the inconvenience.\nThank you for your help.\nKind regards,\nSam',notes:['La solicitud identifica la cita y ofrece alternativas concretas.','El tono es cortés sin añadir información innecesaria.']},
{id:'past-story',title:'Una historia con un cambio de planes',goal:'Narrar hechos pasados en un orden claro.',range:[90,130],prompt:'Write a short story about a day when your plans changed. Explain your original plan, what happened, how you reacted and how the day ended. You may invent the story.',points:['Presentá el plan y el lugar.','Contá qué cambió y qué hiciste.','Terminá con un resultado o aprendizaje.'],plan:['Situación inicial.','Problema y reacción.','Final y reflexión breve.'],chunks:['I was… when…','At first… Then…','In the end…'],model:'Last Saturday, I planned to meet a friend at a museum. I was waiting for the bus when I received a message saying that the museum was closed because of a problem with the lights.\nAt first, I felt disappointed. We had been looking forward to the visit. Then my friend suggested going to a nearby park instead. We bought some sandwiches and found a quiet place beside the lake.\nIn the end, we spent hours talking and enjoying the sunshine. The day was different from our plan, but it was still lovely. We decided to visit the museum another weekend.',notes:['Los conectores ordenan la narración.','La historia combina una situación en curso con acontecimientos terminados.']},
{id:'place-review',title:'Recomendar un lugar',goal:'Describir una experiencia y recomendar con razones.',range:[80,120],prompt:'Write a review of a café, park, museum or other place you know. Describe what you liked, mention one limitation and say who you would recommend it to. You can use an imaginary place.',points:['Describí dos aspectos concretos.','Mencioná una limitación.','Explicá para quién lo recomendás.'],plan:['Nombre y experiencia general.','Detalles positivos y una dificultad.','Recomendación final.'],chunks:['What I liked most was…','However,…','I would recommend it to…'],model:'I recently visited a small café called Green Corner. What I liked most was the friendly service and the quiet garden at the back. The sandwiches were fresh, and there were several vegetarian options.\nHowever, the café is quite small, so finding a table can be difficult at lunchtime. I would suggest arriving early or going in the afternoon.\nI would recommend it to anyone who wants a relaxed place to meet a friend or read for an hour. It may not be the best choice for a very large group.',notes:['La opinión se apoya en detalles observables.','La limitación ayuda a que la recomendación sea más precisa.']},
{id:'shopping-request',title:'Resolver un problema con una compra',goal:'Explicar un defecto y solicitar una solución.',range:[80,120],prompt:'You bought a pair of headphones online last week, but one side does not work. Write to customer service. Give the purchase details, explain the problem and request a replacement or refund.',points:['Indicá qué compraste y cuándo.','Describí el problema con claridad.','Pedí una solución y preguntá cómo devolver el producto.'],plan:['Compra y referencia ficticia.','Problema y comprobaciones realizadas.','Solución solicitada y siguiente paso.'],chunks:['I am writing about…','Unfortunately,…','Could you explain how…?'],model:'Dear customer service team,\nI am writing about a pair of headphones I bought from your website last week. My order number is SAMPLE123.\nUnfortunately, the sound only works on one side. I have tried the headphones with two different devices, but the problem is the same.\nI would prefer a replacement. If the same model is not available, could you offer a refund instead? Please explain how I should return the headphones and whether you will provide a return label.\nThank you for your assistance.\nKind regards,\nSam',notes:['Los detalles permiten identificar y entender el caso.','La petición distingue una preferencia principal de una alternativa.']},
{id:'advice-message',title:'Dar consejos a un amigo',goal:'Proponer cambios realistas y explicar sus beneficios.',range:[80,120],prompt:'A friend wants to improve their English but feels too busy. Write a message suggesting two small changes, explaining how they could help and encouraging your friend.',points:['Reconocé la dificultad.','Proponé dos acciones realistas con razones.','Cerrá con ánimo y una meta pequeña.'],plan:['Mostrar comprensión.','Dos sugerencias con ejemplos.','Cierre alentador.'],chunks:['You could try…','If I were you,…','You do not have to…'],model:'Hi Alex,\nI understand that it is difficult to study after a busy day. You do not have to do a long lesson every evening. You could listen to a short English recording while travelling and repeat one or two useful phrases afterwards.\nIf I were you, I would also choose a regular time for five minutes of writing. For example, you could describe one thing that happened during the day.\nStart with a small goal that fits your routine. Missing one day does not mean that you have failed. Keep going!\nSam',notes:['El mensaje combina empatía y sugerencias específicas.','Las razones conectan cada actividad con un beneficio.']},
{id:'compare-options',title:'Elegir entre dos opciones',goal:'Comparar ventajas y justificar una decisión.',range:[90,130],prompt:'Your group can meet at a free park or rent an indoor room. The park is spacious but depends on the weather. The room costs money but has tables and equipment. Write a message recommending one option for a study afternoon.',points:['Compará ambas opciones.','Relacioná tu elección con estudiar en grupo.','Reconocé una desventaja y proponé cómo afrontarla.'],plan:['Recomendación inicial.','Comparación y razones.','Desventaja y solución.'],chunks:['Compared with…','Although…','For this activity, I think…'],model:'I think we should rent the indoor room for our study afternoon. The park is free and more spacious, but we cannot be sure about the weather. It may also be difficult to hear each other if the park is crowded.\nThe room has tables and a screen, so it would be easier to work with notes and show examples. Although it costs money, we could share the fee between everyone.\nFor this activity, having a quiet place is more important than having a large space. We could save the park idea for a social meeting another day.',notes:['La elección se conecta con la finalidad de la actividad.','Se reconoce el costo en lugar de ignorarlo.']},
{id:'learning-plan',title:'Diseñar tu próxima semana de inglés',goal:'Expresar planes concretos y adaptarlos a tu rutina.',range:[80,120],prompt:'Write a plan for one week of English practice. Choose two skills, say when you will practise and explain what you will do if you have very little time one day.',points:['Elegí dos habilidades y una actividad para cada una.','Definí momentos concretos y realistas.','Incluí una alternativa para un día ocupado.'],plan:['Objetivo de la semana.','Actividades y horarios.','Plan alternativo y revisión final.'],chunks:['This week, I am going to…','If I have less time,…','At the end of the week,…'],model:'This week, I am going to focus on speaking and listening. On Monday, Wednesday and Friday, I will listen to a short dialogue after breakfast and repeat a few phrases. On Tuesday and Thursday, I will record a one-minute answer about my day.\nIf I have very little time, I will practise just one useful sentence instead of skipping everything. At the weekend, I will listen to one of my recordings again and choose something to improve.\nMy goal is to become more comfortable expressing simple ideas, not to speak without any mistakes.',notes:['El plan define acciones que se pueden llevar a cabo.','La alternativa evita que la práctica dependa de un día perfecto.']}
],B2:[
{id:'balanced-opinion',title:'Una opinión con argumentos y matices',goal:'Sostener una postura y responder a una objeción.',range:[140,190],prompt:'Some employers want all staff back in the office, while others offer remote work. Write an opinion text explaining your position. Discuss benefits, address one reasonable objection and suggest a condition for a successful arrangement.',points:['Presentá una postura delimitada.','Desarrollá razones y una objeción razonable.','Proponé una condición práctica y una conclusión.'],plan:['Introducción con postura.','Razones, ejemplo y objeción.','Condición y conclusión.'],chunks:['I would argue that…','A reasonable concern is…','Provided that…'],model:'I would argue that working arrangements should reflect the needs of the role rather than follow a single rule for everyone. Remote work can reduce commuting and give employees greater control over their time. It may also help organisations recruit beyond their local area.\nA reasonable concern is that informal support becomes harder to access, particularly for new colleagues. However, returning to an office does not automatically create meaningful collaboration. Teams still need opportunities to exchange ideas and ask for help.\nA flexible arrangement is more likely to succeed if expectations are explicit. For example, a team could agree on shared availability and use office days for activities that genuinely benefit from meeting in person. Managers should also check whether some staff are working extra hours to remain visible.\nOverall, I support flexibility provided that its effects are reviewed fairly. Performance, access to support and wellbeing are more useful measures than physical attendance alone.',notes:['La postura evita una regla universal para trabajos diferentes.','La objeción recibe una respuesta y lleva a condiciones concretas.']},
{id:'formal-proposal',title:'Proponer una mejora viable',goal:'Presentar un problema, una intervención acotada y una evaluación.',range:[140,190],prompt:'Your community centre wants to improve access to its courses. Write a proposal identifying one barrier, suggesting a small pilot, explaining the resources needed and saying how success should be measured.',points:['Identificá una barrera específica.','Describí un piloto y recursos realistas.','Proponé indicadores y una revisión.'],plan:['Problema observado.','Piloto, recursos y riesgos.','Evaluación y recomendación.'],chunks:['The main barrier appears to be…','I propose a limited pilot…','Success should be assessed by…'],model:'The main barrier appears to be the centre’s timetable. Most courses take place during working hours, which makes participation difficult for people with fixed daytime jobs.\nI propose a six-week pilot offering one existing course in the early evening. This would allow us to test demand without committing to a complete timetable change. We would need a tutor, an available room and clear information about transport and registration. A short questionnaire could help identify practical difficulties before the course begins.\nThe pilot should be assessed by more than the number of registrations. We should also track attendance, reasons for dropping out and feedback from people who had not previously used the centre. Staff workload should be reviewed to ensure that the change is sustainable.\nIf the findings show genuine improvement in access, the centre could consider extending the approach. If not, the feedback would still help us refine the timing or investigate other barriers.',notes:['El alcance del piloto es limitado y comprobable.','Los indicadores buscan acceso sostenido, no solo inscripciones.']},
{id:'evidence-summary',title:'Resumir evidencia sin exagerarla',goal:'Explicar resultados, límites y una conclusión proporcionada.',range:[130,180],prompt:'A voluntary training programme reported improved staff performance. Participants also received extra manager support, and there was no comparison group. Write a short briefing explaining what can and cannot be concluded and recommending a follow-up.',points:['Resumí el resultado observado.','Explicá dos límites de la interpretación.','Recomendá una evaluación más sólida.'],plan:['Hallazgo y nivel de certeza.','Explicaciones alternativas.','Próximo estudio y conclusión.'],chunks:['The findings are encouraging, but…','This makes it difficult to distinguish…','A follow-up should…'],model:'The programme was followed by an improvement in staff performance, which is encouraging. However, the available evidence does not establish that the training itself caused the change.\nParticipation was voluntary, so those who joined may have been more motivated than other employees. Participants also received extra support from managers. Without a comparison group, it is difficult to separate the effect of the materials from the effects of motivation and additional attention.\nA follow-up should compare groups receiving similar levels of support and use the same performance measures over an agreed period. Random assignment would strengthen the design where it is practical and appropriate. The evaluation should also consider whether any gains continue after the initial support ends.\nThe sensible conclusion is therefore cautious: the programme deserves further investigation, but the current results should not be presented as a guarantee of success across the organisation.',notes:['El texto distingue un cambio observado de una causa demostrada.','La recomendación responde a los límites concretos identificados.']},
{id:'professional-repair',title:'Aclarar expectativas por correo',goal:'Asumir responsabilidad y acordar un plan viable.',range:[130,180],prompt:'A colleague missed a deadline that you had not stated clearly. Write an email acknowledging the ambiguity, explaining the practical impact without blaming them and proposing a revised plan and a clearer process.',points:['Reconocé tu contribución al malentendido.','Explicá el impacto de forma neutral.','Acordá un próximo paso y un cambio de proceso.'],plan:['Reconocimiento de la ambigüedad.','Impacto y propuesta inmediata.','Proceso futuro y cierre.'],chunks:['Looking back at my message,…','Could we agree on…?','To avoid a similar misunderstanding,…'],model:'Hi Alex,\nLooking back at my message, I can see that I did not state the deadline clearly. I referred to the report as urgent but assumed that Friday had already been agreed. I should have checked that assumption.\nThe client review is now approaching, so we need to establish what can realistically be completed in time. Could we agree on a short update today covering the sections that are ready, the work remaining and any support you need? We can then decide whether to reduce the scope of the first version or request a revised date.\nTo avoid a similar misunderstanding, I suggest that future requests include a specific deadline and a brief confirmation of the expected output. If a date is not workable, we should raise that early rather than rely on hints.\nThank you for helping us find a practical way forward.\nBest,\nSam',notes:['La responsabilidad se reconoce sin acusaciones indirectas.','La propuesta distingue acciones inmediatas de cambios para el futuro.']},
{id:'compare-services',title:'Recomendar entre dos servicios',goal:'Comparar alternativas con criterios coherentes.',range:[140,190],prompt:'Your team is choosing software. One supplier offers a low initial price but charges separately for training and support. Another includes both at a higher initial price. Write a recommendation explaining what information is missing and how the options should be compared.',points:['Definí criterios relevantes.','Señalá costos o riesgos que faltan.','Recomendá un proceso de decisión, sin inventar cifras.'],plan:['Por qué el precio inicial no alcanza.','Información y criterios comunes.','Recomendación condicionada.'],chunks:['The headline price does not include…','To compare like with like,…','My recommendation would depend on…'],model:'The lower initial price is attractive, but it is not sufficient grounds for choosing a supplier. The two offers do not currently include the same services, so a direct comparison would be misleading.\nBefore deciding, we should request a total estimate over the period we expect to use the software. This should include training, ongoing support, data transfer and any cancellation fees. We also need to understand the response times promised by each supplier and whether additional users would increase the cost.\nTo compare like with like, both suppliers should use the same assumptions about staff numbers and support requirements. Feedback from existing customers could help us assess whether the service described in the contract is delivered reliably.\nMy recommendation would depend on that information rather than on the first payment alone. If the more expensive offer provides better overall value and reduces operational risk, the higher initial cost may be justified.',notes:['No se inventa cuál oferta termina siendo más barata.','La comparación incluye valor, condiciones y riesgo, además de precio.']},
{id:'reflective-experience',title:'Una reflexión sobre una experiencia',goal:'Relacionar decisiones, resultados y aprendizajes futuros.',range:[140,190],prompt:'Write a reflection on a project, course or decision that did not go exactly as planned. Explain the situation, your contribution, what you would change in retrospect and how you will apply the lesson. You may use a fictional example.',points:['Presentá el contexto sin detalles innecesarios.','Analizá tu acción y una alternativa.','Extraé una lección aplicable.'],plan:['Situación y expectativas.','Resultado y reflexión sobre una alternativa.','Cambio concreto para el futuro.'],chunks:['In retrospect,…','Had I clarified…, I might have…','Since then, I have tried to…'],model:'During a group project, I agreed to prepare the final presentation without checking whether everyone understood the deadline. I assumed that the research would arrive in time because we had discussed it briefly.\nTwo sections were still incomplete the evening before the presentation. We managed to produce a usable version, but the last-minute work was stressful and left little time for rehearsal. My response at first was to focus on what others had not delivered. In retrospect, I should also have considered whether the responsibilities and timing had been explicit enough.\nHad I clarified the expected output earlier, I might have noticed the difficulties while there was still time to help. A shared document alone would not have solved the problem; we also needed a short progress check.\nSince then, I have tried to confirm responsibilities, intermediate dates and support needs at the start of a project. The aim is not to control every detail, but to make assumptions visible.',notes:['La reflexión diferencia responsabilidad personal y colectiva.','El aprendizaje se convierte en acciones observables para otro proyecto.']},
{id:'public-message',title:'Responder a una afirmación pública',goal:'Cuestionar un argumento respetuosamente y proponer una mejora.',range:[140,190],prompt:'A local article says rising tourist numbers prove that the town is doing better. Write a response acknowledging a benefit of tourism, explaining why the measure is incomplete and suggesting two additional indicators.',points:['Reconocé un beneficio real posible.','Cuestioná el alcance de la conclusión, no a la persona.','Proponé dos indicadores relacionados con residentes y negocios.'],plan:['Punto de acuerdo.','Límite del indicador actual.','Alternativas y conclusión.'],chunks:['The article is right to note…','However, this does not tell us…','A fuller assessment would include…'],model:'The article is right to note that tourism can support local employment and bring customers to businesses. Rising visitor numbers may therefore be welcome news. However, this figure alone does not show whether the benefits are widely shared or sustainable.\nFor example, some new jobs may be seasonal, while higher demand for short-term accommodation can put pressure on housing. These effects do not mean that tourism is undesirable, but they should be included in the assessment.\nA fuller picture would consider the availability and quality of year-round jobs, together with the affordability of housing for residents. Feedback from local businesses could also help distinguish short periods of intense demand from a stable trading environment.\nThe aim should be to preserve the benefits of tourism while addressing costs that fall unevenly on the community. Visitor numbers are one useful indicator, but they should inform the discussion rather than end it.',notes:['Se concede un punto válido antes de limitar la conclusión.','Los indicadores propuestos se relacionan con el bienestar local.']},
{id:'learning-review',title:'Evaluar cómo estás aprendiendo',goal:'Usar evidencia de tu práctica para decidir el próximo paso.',range:[130,180],prompt:'Write a review of your English learning so far. Identify one activity that helps you, one difficulty that remains and a practical plan to test a different approach. Do not treat the number of exercises as the only evidence of progress.',points:['Usá un ejemplo concreto de lo que ya podés hacer.','Identificá una dificultad específica.','Proponé una práctica y cómo revisarás su utilidad.'],plan:['Evidencia de avance.','Dificultad y posible causa.','Plan breve con una revisión.'],chunks:['One sign of progress is…','I still find it difficult to…','I will review the approach by…'],model:'One sign of progress is that I can now explain a simple problem without translating every sentence first. Short speaking tasks have helped because they require me to organise my own ideas rather than recognise an answer on a screen.\nI still find it difficult to respond quickly when a question changes. I may know the vocabulary, but I spend too long trying to produce a perfect sentence. To address this, I plan to practise brief answers with a different follow-up question each time.\nFor the next week, I will record a one-minute response on three separate days. I will listen again for clarity and choose one useful phrase to improve, rather than count every mistake. At the end of the week, I will compare how easily I can develop an idea in a new prompt.\nCompleting exercises remains useful, but I want to judge progress partly by what I can communicate independently.',notes:['El avance se ilustra con capacidad comunicativa, no solo cantidad.','El plan define una práctica y una forma concreta de revisarla.']}
]}
};
})();

(()=>{
if(window.klevyProductive)return;
const tasks=window.klevyPracticeTasks;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
state.skills={speaking:{},writing:{},...state.skills};
for(const type of ['speaking','writing'])if(!state.skills[type]||typeof state.skills[type]!=='object')state.skills[type]={};
const key=(level,id)=>`${level}:${id}`;
const words=text=>text.trim().split(/\s+/).filter(x=>/[a-zA-Z0-9À-ž]/.test(x)).length;
let active=false,tab='speaking',mountedKey='',recorder=null,micStream=null,recordURL='',recordAudio=null,clock=null,recordToken=0;
let pendingSave=null,flushDraft=null;
function saveProgress(){
try{localStorage.setItem('english-path-offline',JSON.stringify(state));return true}catch{return false}
}
function status(message){const el=document.querySelector('#productive-status');if(el)el.textContent=message}
function clearClock(){if(clock){clearInterval(clock);clock=null}}
function stopTracks(stream){if(stream)stream.getTracks().forEach(track=>track.stop())}
function cleanup(){

async function startRecording(taskKey){
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status('La grabación no está disponible acá. Abrí el enlace en Safari actualizado, o respondé en voz alta sin grabar.');return}

const begin=document.querySelector('#prod-record');begin.disabled=true;status('Esperando acceso al micrófono…');
let opened=null;
try{
opened=await navigator.mediaDevices.getUserMedia({audio:true});
if(token!==recordToken||mountedKey!==taskKey){stopTracks(opened);return}
if(document.visibilityState==='hidden'){stopTracks(opened);begin.disabled=false;status('Volvé a la actividad y tocá Grabar para empezar.');return}
if(recordAudio)recordAudio.hidden=true;document.querySelector('#prod-discard').hidden=true;
micStream=opened;
const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(type=>window.MediaRecorder.isTypeSupported?.(type));
const current=new window.MediaRecorder(opened,mime?{mimeType:mime}:undefined);recorder=current;
const chunks=[];
current.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
current.onstop=()=>{
stopTracks(opened);if(micStream===opened)micStream=null;if(recorder===current)recorder=null;
clearClock();
if(token!==recordToken||mountedKey!==taskKey)return;
document.querySelector('#prod-record').disabled=false;document.querySelector('#prod-stop-record').disabled=true;
if(!chunks.length){status('No se generó audio. Podés volver a intentar o practicar sin grabación.');return}
if(recordURL)URL.revokeObjectURL(recordURL);
const blob=new Blob(chunks,{type:current.mimeType||chunks[0].type||'audio/mp4'});recordURL=URL.createObjectURL(blob);
recordAudio=document.querySelector('#prod-recording');recordAudio.src=recordURL;recordAudio.hidden=false;
document.querySelector('#prod-discard').hidden=false;
status('Grabación lista. Escuchala y elegí una frase o idea para mejorar.');
};
current.onerror=()=>{
stopTracks(opened);clearClock();
if(token===recordToken){document.querySelector('#prod-record').disabled=false;document.querySelector('#prod-stop-record').disabled=true;status('No se pudo completar la grabación. Podés volver a intentar.');}
};
current.start();
document.querySelector('#prod-stop-record').disabled=false;status('Grabando. Tocá Terminar grabación cuando acabes.');
const began=Date.now();document.querySelector('#prod-timer').textContent='0 segundos · límite 120 segundos';
clock=setInterval(()=>{const elapsed=Math.floor((Date.now()-began)/1000);const el=document.querySelector('#prod-timer');if(el)el.textContent=`${elapsed} segundos · límite 120 segundos`;if(elapsed>=120)stopRecording()},1000);
}catch(error){
stopTracks(opened);if(micStream===opened)micStream=null;
if(token===recordToken&&mountedKey===taskKey){document.querySelector('#prod-record').disabled=false;document.querySelector('#prod-stop-record').disabled=true;status(error.name==='NotAllowedError'?'El micrófono no está habilitado. Podés permitirlo en los ajustes del sitio en Safari o practicar sin grabación.':'No se pudo iniciar el micrófono. Podés responder en voz alta sin grabar.');}
}
}

<script>

const atDay=(now,days=0)=>{const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()+days);return d.getTime()};

function getSchedule(record){
if(!record)return null;
if(record.srs&&Number.isFinite(record.srs.dueAt))return record.srs;
const last=Number(record.lastAt)||0;
return {dueAt:record.correct?(last?atDay(last,1):0):0,streak:0,lastDay:last?today(last):'',legacy:true};
}
function nextSchedule(previous,correct,now=Date.now()){
const s=previous?.srs||{},sameDay=s.lastDay===today(now);
const streak=correct?(sameDay&&s.streak>0?s.streak:Math.min((Number(s.streak)||0)+1,intervals.length)):0;
const days=correct?intervals[Math.max(0,streak-1)]:1;
return {version:1,streak,intervalDays:days,dueAt:atDay(now,days),lastDay:today(now)};
}
function recommendedUnit(level){
const list=window.englishLessons[level],last=state.study?.lastUnit?.[level];
return list.find(u=>u.id===last&&!window.englishStudy.statsFor(level,u).complete)||list.find(u=>!window.englishStudy.statsFor(level,u).complete)||list[0];

function pool(level){
const rows=[];
for(const type of types)data[level][type].forEach((q,index)=>{
const record=state.practice[exerciseKey(type,index,level)],schedule=getSchedule(record);

});

}
const hash=text=>[...text].reduce((n,c)=>((n*31+c.charCodeAt(0))>>>0),17);
function chooseBalanced(rows,count,seed,already=[]){
const remaining=[...rows].sort((a,b)=>(a.schedule?.dueAt||0)-(b.schedule?.dueAt||0)||hash(seed+identity(a))-hash(seed+identity(b)));
return window.klevyVariety.selectRows(remaining,count,{level:already[0]?.level||rows[0]?.level||state.level,already});
}

function makePlan(level,date=today(),now=Date.now()){
const unit=recommendedUnit(level),all=pool(level),chosen=[],seen=new Set();
const take=(rows,n,reason)=>{for(const r of chooseBalanced(rows.filter(x=>!seen.has(identity(x))),n,date+level+reason,chosen.map(x=>({...x,level,q:data[level][x.type][x.index]})))){seen.add(identity(r));chosen.push({type:r.type,index:r.index,reason})}};

take(introduced,6-chosen.length,'Una pregunta nueva de tu ruta');

drafts.sort((a,b)=>Number(!!a.record.done)-Number(!!b.record.done)||(Number(a.record.savedAt)||0)-(Number(b.record.savedAt)||0));
return {version:1,date,level,createdAt:now,unitId:unit.id,items:chosen,answers:{},speakingId:oral,writingId:drafts[0]?.id||links?.[1]||window.klevyPracticeTasks.writing[level][0].id,speakingDone:false,writingDone:false};
}
function validPlan(plan,level,date){
return plan?.version===1&&plan.level===level&&plan.date===date&&Array.isArray(plan.items)&&plan.items.every(x=>types.includes(x.type)&&Number.isInteger(x.index)&&!!data[level][x.type][x.index])&&window.klevyPracticeTasks.speaking[level].some(t=>t.id===plan.speakingId)&&window.klevyPracticeTasks.writing[level].some(t=>t.id===plan.writingId);
}
function getPlan(level=state.level,date=today()){
const key=planKey(level,date);let p=state.daily.plans[key];
if(!validPlan(p,level,date)){p=makePlan(level,date);state.daily.plans[key]=p;const keys=Object.keys(state.daily.plans).sort();for(const old of keys.slice(0,Math.max(0,keys.length-60)))delete state.daily.plans[old];persist()}

}
const answered=plan=>plan.items.filter(x=>!!plan.answers[identity(x)]).length;
const allDone=plan=>answered(plan)===plan.items.length&&plan.speakingDone&&plan.writingDone;
function dueCounts(level){const rows=pool(level).filter(x=>x.record&&x.schedule.dueAt<=Date.now());return {errors:rows.filter(x=>!x.record.correct).length,review:rows.filter(x=>x.record.correct).length}}
const nav=document.querySelector('nav'),button=document.createElement('button');button.id='daily-nav';button.textContent='Mi día';nav.prepend(button);
function navState(){for(const id of ['daily-nav','study-route','home','productive-nav','progress']){const b=document.querySelector('#'+id);if(id==='daily-nav')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}}

document.head.appendChild(style);

window.klevyProductive.cleanup();onDaily=true;session=null;navState();
const p=getPlan(),counts=dueCounts(state.level),unit=window.englishLessons[state.level].find(u=>u.id===p.unitId),n=answered(p);

app.innerHTML=`<section class="panel daily-hero"><span class="study-kicker">MI PRÁCTICA DE HOY · ${state.level}</span><h2>${complete?'Hoy ya practicaste. ¡Buen trabajo!':'Un poco de repaso. Una respuesta propia.'}</h2><p>Repasá lo aprendido y usalo al hablar y escribir. Podés hacer una parte y retomar el resto después.</p><div class="stats"><span>${doneBlocks} / 3 pasos realizados</span><span>${counts.errors} ${counts.errors===1?'error':'errores'} y ${counts.review} ${counts.review===1?'repaso':'repasos'} para hoy</span></div><div class="progress"><div style="width:${doneBlocks/3*100}%"></div></div><p class="daily-meta">${esc(new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}))} · Ritmo orientativo: 15–20 minutos. La fecha sigue la de este dispositivo.</p>${!storageHealthy?'<p role="alert" class="daily-success">No se pudo guardar en este navegador. Podés practicar, pero esta sesión podría perderse al cerrar.</p>':''}${message?`<p class="daily-success" role="status">${esc(message)}</p>`:''}${complete?'<p class="daily-success">Terminaste la propuesta de hoy. Mañana revisaremos qué conviene retomar. También podés seguir con práctica libre.</p>':''}</section><section class="daily-grid"><article class="daily-card ${n===p.items.length?'daily-done':''}"><span class="daily-eyebrow">PASO 1 · RECORDAR</span><h3>${n===p.items.length?'✓ Repaso de preguntas realizado':'Retomá lo que más te sirve'}</h3><p>${p.items.length?`${n} de ${p.items.length} ${p.items.length===1?'pregunta respondida':'preguntas respondidas'}. Mezclamos errores pendientes, repasos y contenido de tu ruta según lo que haya disponible.`:'Hoy no hay preguntas nuevas o vencidas para seleccionar. Podés continuar con las actividades de expresión.'}</p>${p.items.length?`<div class="daily-actions"><button id="daily-start" class="primary" ${n===p.items.length?'disabled':''}>${n?'Continuar repaso':'Empezar repaso'} →</button></div><details><summary>¿Qué vamos a repasar?</summary><ul clas ection>`;

<script>
(()=>{
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const consultationHistory=new Map();
const materials=window.klevyContextMaterials,root=document.querySelector('#app');
state.notebook=state.notebook||{};state.context=state.context||{lessons:{}};

function shell(title,body){root.innerHTML=`<section class="panel ctx"><p class="small">INGLÉS EN CONTEXTO · ${E(state.level)}</p><h2>${E(title)}</h2><div class="ctx-actions"><button id="ctx-materials">Materiales</button><button id="ctx-notebook">Mi cuaderno (${Object.keys(state.notebook).length})</button></div>${body}</section>`;document.querySelector('#ctx-materials').onclick=hub;document.querySelector('#ctx-notebook').onclick=notebook}
function hub(){activate();shell('Comprender y usar el idioma',`<p>Fragmentos originales con fuente, preguntas de comprensión y un resumen oral. Niveles orientativos; las actividades fueron creadas para esta app.</p><div class="ctx-grid">${materials.filter(m=>m.level===state.level).map(m=>`<article><p class="small">${E(m.category)} · ${E(m.source)}</p><h3>${E(m.title)}</h3><p>${E(m.goal)}</p><button data-material="${m.id}">Abrir actividad →</button></article>`).join('')}</div><p class="small">Tocá una palabra del texto para consultarla y guardarla con su contexto. Las consultas y los repasos se registran por separado.</p>`);root.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>lesson(b.dataset.material))}
function entry(term,meaning,sentence='',materialId=''){const key=window.klevyLexicon.normalize(term);let item=state.notebook[key];if(!item)item=state.notebook[key]={term,meaning,sentence,materialId,example:'',createdAt:Date.now(),consultations:0};else{if(!item.sentence&&sentence)item.sentence=sentence;if(!item.materialId&&materialId)item.materialId=materialId}persist();return item}
function lesson(id){activate();const m=materials.find(x=>x.id===id);if(!m)return hub();const rec=state.context.lessons[id]||(state.context.lessons[id]={answers:{},notes:'',oral:false});const texts=m.segments.map(x=>typeof x==='string'?x:x.text);shell(m.title,`<p>${E(m.intro)}</p><p class="small">Fragmento original de <a href="${E(m.url)}" target="_blank" rel="noopener noreferrer">${E(m.sourceTitle)} ↗</a> · ${E(m.source)}<br>${E(m.date)}</p>${m.audio?`<h3>Audio original</h3><audio controls preload="none" src="${E(m.audio.url)}"></audio><p class="small">Audio completo (${E(m.audio.duration)}); debajo se muestra un fragmento de la transcripción. ${E(m.audio.credit)}</p>`:''}<button id="ctx-listen">♫ Escuchar lectura sintética</button><button id="ctx-silence">Detener</button><p class="small">Lectura de estudio con la voz del dispositivo. Puede diferir del audio original.</p><div class="ctx-transcript">${m.segments.map((s,i)=>`<p>${typeof s==='object'?`<strong>${E(s.speaker)}: </strong>`:''}<span lang="en" data-context-sentence data-context-material="${m.id}" id="ctx-segment-${i}">${E(texts[i])}</span></p>`).join('')}</div><h3>Expresiones en contexto</h3>${m.collocations.map((c,i)=>`<article><strong lang="en">${E(c.term)}</strong> — ${E(c.meaning)}<p class="small">Registro: ${E(c.register)}. ${E(c.note)}</p><p lang="en">${E(c.quote)}</p><p>Ejemplo de práctica creado para la app: <span lang="en">${E(c.example)}</span></p><button data-expression="${i}">Guardar expresión</button></article>`).join('')}<h3>Comprobá lo que entendiste</h3>${m.questions.map((q,i)=>`<article><p lang="en">${E(q[0])}</p>${q[1].map((o,j)=>`<button class="ctx-choice" data-question="${i}" data-choice="${j}" ${rec.answers[i]!==undefined?'disabled':''}><span lang="en">${E(o)}</span></button>`).join('')}<p id="ctx-feedback-${i}" aria-live="polite">${rec.answers[i]!==undefined?E((rec.answers[i]===q[2]?'Correcto. ':'Para repasar. ')+q[3]):''}</p></article>`).join('')}<h3>Ahora, contalo con tus palabras</h3><p lang="en">${E(m.oral)}</p><p lang="en">${E(m.followUp)}</p><p>Prepará un resumen de 45–90 segundos. Incluí la idea principal, un detalle del texto y tu opinión. Usá al menos una expresión nueva.</p><details><summary>Ver un modelo orientativo</summary><p lang="en">${E(m.model)}</p></details><div class="ctx-actions"><button id="prod-record">Grabarme</button><button id="prod-stop-record" disabled>Terminar grabación</button><button id="prod-discard">Descartar audio</button><span id="prod-timer">0:00</span></div><p id="productive-status" role="status"></p><audio id="prod-recording" controls hidden></audio><p class="small">La grabación es temporal y se borra al salir. Autoevaluación: la app no puntúa ni corrige tu pronunciación.</p><label>Mi resumen o notas<textarea id="ctx-notes" rows="4">${E(rec.notes)}</textarea></label><label><input type="checkbox" id="ctx-oral" ${rec.oral?'checked':''}> Practiqué el resumen y revisé si se entiende la idea principal.</label><p id="ctx-save-status" role="status"></p>`);
let position=0;document.querySelector('#ctx-listen').onclick=()=>{if(document.querySelector('#prod-stop-record')?.disabled===false){document.querySelector('#productive-status').textContent='Terminá la grabación antes de escuchar.';return}root.querySelectorAll('audio').forEach(a=>a.pause());stopVoice();position=0;function next(){if(position>=texts.length||!document.querySelector('#ctx-segment-0'))return;const el=document.querySelector('#ctx-segment-'+position);const u=new SpeechSynthesisUtterance(texts[position]);u.lang='en-GB';u.rate=.85;u.onstart=()=>el.classList.add('ctx-active');u.onend=()=>{el.classList.remove('ctx-active');position++;next()};u.onerror=()=>el.classList.remove('ctx-active');speechSynthesis.speak(u)}if('speechSynthesis'in window)next();else document.querySelector('#ctx-save-status').textContent='La lectura de voz no está disponible en este navegador.'};document.querySelector('#ctx-silence').onclick=()=>{stopVoice();root.querySelectorAll('.ctx-active').forEach(x=>x.classList.remove('ctx-active'))};
root.querySelectorAll('[data-expression]').forEach(b=>b.onclick=()=>{const c=m.collocations[+b.dataset.expression];entry(c.term,c.meaning,c.quote,m.id);b.textContent='Guardada ✓'});
root.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{const i=+b.dataset.question,j=+b.dataset.choice;rec.answers[i]=j;persist();root.querySelectorAll(`[data-question="${i}"]`).forEach(x=>x.disabled=true);document.querySelector('#ctx-feedback-'+i).textContent=(j===m.questions[i][2]?'Correcto. ':'Para repasar. ')+m.questions[i][3]});
document.querySelector('#ctx-notes').oninput=e=>{rec.notes=e.target.value;persist()};document.querySelector('#ctx-oral').onchange=e=>{rec.oral=e.target.checked;persist();document.querySelector('#ctx-save-status').textContent='Autoevaluación guardada.'};window.klevyProductive.prepareRecorder('context:'+id);document.querySelector('#prod-record').onclick=()=>{root.querySelectorAll('audio').forEach(a=>a.pause());window.klevyProductive.startRecording('context:'+id)};root.querySelectorAll('audio').forEach(a=>a.onplay=()=>{stopVoice();if(document.querySelector('#prod-stop-record')?.disabled===false){a.pause();document.querySelector('#productive-status').textContent='Terminá la grabación antes de reproducir audio.'}});document.querySelector('#prod-stop-record').onclick=()=>window.klevyProductive.stopRecording();document.querySelector('#prod-discard').onclick=()=>{window.klevyProductive.cleanup();window.klevyProductive.prepareRecorder('context:'+id);document.querySelector('#prod-recording').hidden=true};}
function notebook(){activate();const items=Object.entries(state.notebook),now=Date.now();shell('Mi cuaderno de expresiones',`<p>Guardá frases útiles y escribí un ejemplo propio. El repaso usa tu autoevaluación: intentá recordar el significado antes de mostrarlo.</p>${items.length?'':'<p>Todavía no guardaste expresiones. Abrí un material o consultá una palabra de cualquier ejercicio.</p>'}${items.map(([key,v],i)=>{const m=materials.find(m=>m.id===v.materialId)||v.source;return `<article data-entry="${i}"><h3 lang="en">${E(v.term)}</h3><p lang="en">${E(v.sentence||'')}</p>${m?`<p class="small">Fuente: <a href="${E(m.url)}" target="_blank" rel="noopener noreferrer">${E(m.source)}</a></p>`:''}<p class="small">${v.consultations||0} consultas${v.lastConsulted?' (última: '+new Date(v.lastConsulted).toLocaleDateString('es-AR')+')':''} · ${v.reviews||0} repasos · ${!v.srs||v.srs.dueAt<=now?'Para repasar':`Próximo repaso: ${new Date(v.srs.dueAt).toLocaleDateString('es-AR')}`}</p><details><summary>Mostrar significado</summary><label>Significado<input data-meaning="${i}" value="${E(v.meaning)}"></label><div class="ctx-actions"><button data-recall="${i}" data-success="yes">Lo recordé</button><button data-recall="${i}" data-success="no">Necesito repasarlo</button></div></details><label>Mi propio ejemplo<textarea data-example="${i}" rows="2" placeholder="Write your own sentence…">${E(v.example)}</textarea></label><button data-delete="${i}">Eliminar expresión</button><p class="ctx-status" role="status"></p></article>`}).join('')}`);root.querySelectorAll('[data-meaning]').forEach(el=>el.oninput=()=>{items[+el.dataset.meaning][1].meaning=el.value;persist()});root.querySelectorAll('[data-example]').forEach(el=>el.oninput=()=>{items[+el.dataset.example][1].example=el.value;persist()});root.querySelectorAll('[data-recall]').forEach(b=>b.onclick=()=>{const v=items[+b.dataset.recall][1];v.srs=window.klevyDaily.nextSchedule(v,b.dataset.success==='yes',Date.now());v.reviews=(v.reviews||0)+1;persist();b.closest('article').querySelector('.ctx-status').textContent='Repaso guardado. Próximo: '+new Date(v.srs.dueAt).toLocaleDateString('es-AR');b.closest('details').querySelectorAll('button').forEach(x=>x.disabled=true)});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta expresión del cuaderno?')){delete state.notebook[items[+b.dataset.delete][0]];persist();notebook()}})}
window.addEventListener('klevy:word-consulted',e=>{const d=e.detail,key=window.klevyLexicon.normalize(d.term),now=Date.now();const history=consultationHistory.get(key)||[];if(now-(history.at(-1)||0)<1000)return;history.push(now);consultationHistory.set(key,history.slice(-20));if(state.notebook[key]){const v=state.notebook[key];v.consultations=(v.consultations||0)+1;v.lastConsulted=now;persist()}});
window.addEventListener('klevy:save-expression',e=>{const d=e.detail;const item=entry(d.term,d.meaning,d.sentence,d.materialId);item.consultations=Math.max(item.consultations||0,consultationHistory.get(window.klevyLexicon.normalize(d.term))?.length||1);item.lastConsulted=Date.now();persist()});
const style=document.createElement('style');style.textContent=`nav{grid-template-columns:repeat(6,minmax(0,1fr))}.ctx article{padding:18px;margin:16px 0;border:1px solid #cedac8;border-radius:12px;background:#fff}.ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ctx-grid article{margin:0}.ctx-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.ctx p{line-height:1.75}.ctx textarea,.ctx input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;margin:8px 0 16px;padding:12px;font:inherit}.ctx audio{width:100%;margin:12px 0}.ctx-choice{display:block;margin:8px 0;width:100%;text-align:left}.ctx-transcript{padding:18px;background:#eef3e6;border-radius:12px}.ctx-active{background:#fbe9a9}.ctx details{margin:14px 0}.ctx label{display:block;margin-top:12px}@media(max-width:720px){nav{grid-template-columns:repeat(3,minmax(0,1fr))}#productive-nav{grid-column:auto}.ctx-grid{grid-template-columns:1fr}.ctx-actions button{flex:1}}`;document.head.append(style);
document.querySelector('nav').addEventListener('click',e=>{if(e.target.closest('button')?.id!=='context-nav'){window.klevyProductive.cleanup();document.querySelector('#context-nav').removeAttribute('aria-current');document.querySelectorAll('#app audio').forEach(a=>a.pause())}},true);
const btn=document.createElement('button');btn.id='context-nav';btn.textContent='Contexto';document.querySelector('nav').append(btn);btn.onclick=hub;window.klevyContext={hub,lesson,notebook,entry,materials};
})();
