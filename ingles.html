{id:'change-booking',level:'B1',title:'Cambiar una reserva',role:'Sos huésped de un hotel.',brief:'Tenés una reserva para el viernes, pero llegás el sábado. Querés mantener dos noches. Practicá pedir el cambio y confirmar sus condiciones.',first:turn('Good afternoon, Riverside Hotel. How can I help you?','Explicá qué reserva tenés y qué cambio necesitás.',['I have a booking for…','Could I change it to…?'],'Hello. I have a booking for Friday for two nights, but I will arrive on Saturday. Could I change it to Saturday and keep the same number of nights?',['Expliqué la fecha original.','Pedí el cambio y aclaré cuántas noches necesito.']),choice:'¿Cómo querés continuar la conversación?',branches:[{id:'price',label:'Quiero saber si cambia el precio',turns:[turn('We have a room available on Saturday. Would you like me to check the price before I change your booking?','Pedí el precio total y preguntá si incluye desayuno.',['What is the total price?','Does that include…?'],'Yes, please. What is the total price for two nights? Does it include breakfast?',['Pregunté por el precio total.','Consulté qué está incluido.']),turn('The total is two hundred pounds, including breakfast. Shall I confirm Saturday and Sunday night?','Confirmá las noches y pedí una confirmación por correo.',['Just to confirm…','Could you send me…?'],'Yes, please. Just to confirm, that is Saturday and Sunday night for two hundred pounds, including breakfast. Could you send me a confirmation email?',['Confirmé las condiciones importantes.','Pedí una confirmación por escrito.'])]},{id:'alternative',label:'Necesito una opción más económica',turns:[turn('Saturday is more expensive than Friday. We also have a smaller room. Would you like to hear about that option?','Preguntá por el precio y una característica importante de la habitación.',['How much is…?','Does the room have…?'],'Yes, please. How much is the smaller room for two nights? Does it have a private bathroom?',['Pedí el precio de la alternativa.','Pregunté por una característica que necesito.']),turn('The smaller room has a private bathroom and costs one hundred and sixty pounds for two nights. Would you like to book it?','Aceptá o rechazá con una razón y confirmá tu decisión.',['I would prefer…','That works for me because…'],'That works for me because it is within my budget. Please change my booking to the smaller room for Saturday and Sunday night.',['Di una decisión clara.','La apoyé con una razón y confirmé las noches.'])]}]},
{id:'return-purchase',level:'B1',title:'Resolver un problema con una compra',role:'Sos cliente de una tienda.',brief:'Compraste unos auriculares ayer. El lado izquierdo no funciona y conservás el comprobante. Buscá una solución con cortesía.',first:turn('Hello. What seems to be the problem with the headphones?','Explicá cuándo los compraste y qué falla.',['I bought these…','The left side does not…'],'I bought these headphones yesterday, but the left side does not work. I have the receipt with me.',['Mencioné cuándo los compré.','Expliqué el problema concreto.']),choice:'Elegí la solución que querés practicar.',branches:[{id:'exchange',label:'Pedir un cambio',turns:[turn('I am sorry about that. Would you like a replacement or a refund?','Pedí otro par y preguntá si podés probarlo.',['I would like a replacement.','Could I test…?'],'I would like a replacement, please. Could I test the new pair before I leave?',['Pedí el cambio con claridad.','Pregunté cómo comprobar que funciona.']),turn('Of course. This pair works correctly. Is there anything else you would like to check?','Confirmá que ambos lados funcionan y cerrá la conversación.',['Both sides…','Thank you for…'],'Both sides work now. That is everything, thank you for your help.',['Confirmé que el problema se resolvió.','Cerré la conversación de forma cortés.'])]},{id:'refund',label:'Pedir un reembolso',turns:[turn('We can exchange them, but the same colour is not in stock. Would a different colour be suitable?','Rechazá la alternativa con cortesía y pedí un reembolso.',['Thank you, but…','Could I have a refund instead?'],'Thank you, but I would prefer a refund because I need a working pair today in that colour. Could you refund the payment instead?',['Rechacé sin sonar agresivo.','Pedí otra solución.']),turn('Certainly. The money will go back to your card within five working days. Would you like a refund receipt?','Aceptá el comprobante y confirmá el plazo.',['Yes, please.','So it should arrive within…'],'Yes, please. So the money should arrive within five working days. Thank you for explaining.',['Confirmé el plazo sin cambiarlo.','Pedí o acepté el comprobante.'])]}]},
{id:'make-plans',level:'B1',title:'Ponerse de acuerdo con un amigo',role:'Organizás una salida con un amigo.',brief:'Querés pasar tiempo con tu amigo el fin de semana. Tenés un presupuesto pequeño y preferís volver temprano. Practicá proponer y acordar.',first:turn('Are you free this weekend? What would you like to do?','Proponé una actividad y explicá una preferencia.',['How about…?','I would prefer… because…'],'How about going for a walk on Saturday afternoon? I would prefer something inexpensive because I am saving money.',['Propuse una actividad concreta.','Expliqué una preferencia o limitación.']),choice:'¿Qué dificultad querés resolver?',branches:[{id:'weather',label:'Cambiar el plan por lluvia',turns:[turn('That sounds nice, but it might rain on Saturday. What could we do indoors instead?','Proponé una alternativa y relacionála con tu presupuesto.',['We could… instead.','It would be cheaper than…'],'We could visit the free museum instead. It would be cheaper than going to the cinema, and we would stay dry.',['Propuse una alternativa viable.','Expliqué por qué sirve.']),turn('Great. The museum closes at five. Shall we meet at two outside the entrance?','Confirmá lugar y hora y añadí un detalle práctico.',['Two o’clock works for me.','I will…'],'Two o’clock works for me. Let’s meet outside the entrance. I will send you a message when I arrive.',['Confirmé la hora y el lugar.','Añadí un detalle útil.'])]},{id:'time',label:'Negociar un horario',turns:[turn('I can only meet in the evening. Would seven o’clock work for you?','Explicá que necesitás volver temprano y proponé una salida breve.',['I need to be home by…','Could we just…?'],'I need to be home by nine. Could we just have a quick coffee at seven near my house?',['Expliqué mi límite de horario.','Ofrecí una alternativa concreta.']),turn('Yes, a quick coffee is fine. Which café should we choose, and when will you need to leave?','Elegí un lugar y confirmá a qué hora te vas.',['Let’s meet at…','I will need to leave at…'],'Let’s meet at the café beside the station at seven. I will need to leave at half past eight.',['Elegí un lugar identificable.','Confirmé el límite de tiempo.'])]}]},
{id:'negotiate-deadline',level:'B2',title:'Negociar una fecha de entrega',role:'Coordinás un proyecto con un cliente.',brief:'El cliente pide un informe completo para el viernes. Podés entregar un resumen revisado ese día, pero los datos completos requieren hasta el martes. Evitá prometer algo inviable.',first:turn('We need the complete report by Friday. Can you commit to that?','Reconocé la necesidad y planteá una limitación con una alternativa concreta.',['I understand the urgency; however…','What I can commit to is…'],'I understand the urgency; however, the full dataset will not be verified by Friday. What I can commit to is a reviewed executive summary on Friday, followed by the complete report on Tuesday.',['Reconocí la necesidad del cliente.','Puse un límite y ofrecí una alternativa viable.']),choice:'Elegí qué prioridad vas a negociar.',branches:[{id:'scope',label:'Reducir el alcance para mantener la fecha',turns:[turn('Friday is fixed because the board meets that afternoon. What would you include in the summary, and what would be missing?','Definí el contenido mínimo y aclará qué no permite concluir todavía.',['The summary would cover…','It would not yet establish…'],'The summary would cover the findings we have checked, the main risks and the decisions needed from the board. It would not yet establish the final cost estimate, so I would label that as provisional.',['Definí un alcance concreto.','Hice visible la incertidumbre.']),turn('That sounds workable. How will you make sure nobody treats the provisional figures as final?','Proponé dos medidas y confirmá el acuerdo.',['I would make the limitation explicit…','To confirm our agreement…'],'I would mark provisional figures clearly and explain their limitations at the start of the meeting. To confirm our agreement, I will send the summary on Friday and the verified full report on Tuesday.',['Propuse medidas para evitar una interpretación errónea.','Confirmé entregables y fechas.'])]},{id:'quality',label:'Defender el tiempo de verificación',turns:[turn('What is the risk of sending the figures now and correcting them later?','Explicá una consecuencia concreta sin exagerar el riesgo.',['The main risk is that…','A later correction might not…'],'The main risk is that the board could approve spending based on figures that have not been checked. A later correction might not reverse a decision already made, so I recommend presenting only verified findings on Friday.',['Relacioné el riesgo con una decisión real.','Justifiqué una recomendación proporcionada.']),turn('Understood. Could you send a progress update before Friday so we can prepare?','Aceptá un compromiso intermedio y definí su contenido.',['I can send… by…','It will distinguish… from…'],'I can send a progress update by Thursday afternoon. It will distinguish confirmed findings from open questions and identify what will be ready for Friday.',['Ofrecí un compromiso verificable.','Separé lo confirmado de lo pendiente.'])]}]},
{id:'clarify-request',level:'B2',title:'Aclarar un pedido ambiguo',role:'Trabajás con un colega en una presentación.',brief:'Te piden una presentación “breve” para una reunión con personas no técnicas. Todavía no están definidos el propósito, la duración ni la decisión que debe tomar el público.',first:turn('Could you put together a short presentation about the new system for next week?','Pedí aclaraciones sobre el público y el resultado esperado.',['Who will be attending?','What should they be able to decide…?'],'Certainly. Who will be attending, and what should they be able to decide after the presentation? That will help me choose the right level of detail.',['Pregunté quién es el público.','Aclaré el propósito antes de asumirlo.']),choice:'Elegí qué aspecto necesitás precisar.',branches:[{id:'audience',label:'Adaptar el mensaje al público',turns:[turn('The audience will be department managers with little technical knowledge. They need to decide whether to join a pilot. What would you focus on?','Proponé un enfoque útil para esa decisión.',['I would focus on… rather than…','A practical example would…'],'I would focus on how the pilot would affect their teams rather than on the system’s architecture. A practical example would show the change in workload, the support available and what feedback we need.',['Relacioné el contenido con la decisión del público.','Elegí un ejemplo comprensible.']),turn('Good. One manager is worried about extra work. How would you address that without promising too much?','Reconocé la preocupación y explicá cómo se evaluará la carga.',['That is a reasonable concern.','We could test this by…'],'That is a reasonable concern. I would explain that the workload is not yet certain and that we could test it with a small pilot, recording the time required before deciding whether to expand.',['Reconocí la preocupación.','Propuse una comprobación sin garantizar un resultado.'])]},{id:'scope',label:'Acordar alcance y duración',turns:[turn('You will have ten minutes, including questions. Can you explain all the features in that time?','Rechazá la sobrecarga de contenido y proponé una selección.',['To leave time for questions…','I would prioritise…'],'To leave time for questions, I would prioritise the three features most relevant to joining the pilot. I can provide a separate reference sheet for the remaining features.',['Ajusté el alcance al tiempo disponible.','Ofrecí una alternativa para el detalle adicional.']),turn('Agreed. When can I review a draft, and what feedback would be most useful?','Proponé un plazo y pedí una revisión específica.',['I can share a draft by…','It would help if you checked…'],'I can share a draft by Wednesday afternoon. It would help if you checked whether the examples match the managers’ concerns and whether the final slide makes the decision clear.',['Propuse un plazo concreto.','Pedí feedback específico.'])]}]},
{id:'interview-example',level:'B2',title:'Responder una entrevista con ejemplos',role:'Participás en una entrevista laboral.',brief:'Podés usar una experiencia real o ficticia. Elegí una situación en la que un proyecto cambió y preparate para explicar tus acciones y lo aprendido.',first:turn('Tell me about a time when you had to adapt to an unexpected change at work or in your studies.','Describí la situación, tu acción y el resultado sin quedarte en generalidades.',['When the plan changed, I…','As a result,…'],'During a group project, a teammate became unavailable shortly before the deadline. I helped the group agree on the essential sections and divided the remaining work into smaller tasks. As a result, we delivered a shorter but complete presentation on time.',['Describí una situación concreta.','Diferencié mi acción del resultado del grupo.']),choice:'Elegí la repregunta que querés practicar.',branches:[{id:'reflection',label:'Profundizar en lo que aprendí',turns:[turn('Looking back, what would you have done differently, and why?','Analizá una alternativa y su posible efecto.',['In retrospect, I should have…','That might have allowed us to…'],'In retrospect, I should have agreed on a backup plan earlier. That might have allowed us to redistribute the work before the final week and leave more time to rehearse.',['Propuse una alternativa concreta.','Expliqué cómo podría haber cambiado el resultado.']),turn('How have you applied that lesson since then?','Contá una acción posterior o un plan verificable si no tenés otro ejemplo.',['Since then, I have…','In my next project, I will…'],'Since then, I have started projects by confirming responsibilities and a mid-project check-in. In my next project, I will also agree on a backup person for tasks that could block the rest of the team.',['Conecté la lección con una acción.','Evité afirmar un resultado que no puedo respaldar.'])]},{id:'teamwork',label:'Explicar cómo trabajé con otras personas',turns:[turn('How did you handle disagreement about which parts of the project to keep?','Explicá cómo escuchaste y usaste criterios para decidir.',['I asked each person to…','We agreed to prioritise…'],'I asked each person to explain which section they considered essential and why. We agreed to prioritise the sections that answered the assignment directly, rather than those we had spent the most time on.',['Expliqué cómo escuché las distintas opiniones.','Usé un criterio relacionado con el objetivo.']),turn('What would you do if a teammate still disagreed with the final decision?','Proponé una respuesta respetuosa que permita avanzar.',['I would acknowledge…','If we could not agree,…'],'I would acknowledge the concern and check whether we had missed an important risk. If we could not agree, I would use the decision process we had established, record the concern and make the next action clear.',['Reconocí el desacuerdo sin descalificar.','Expliqué cómo avanzar de forma concreta.'])]}]}
];
})();

</script>
<script>
(()=>{
const scenarios=window.klevyConversationScenarios,root=document.querySelector('#app');let run=null,scenario=null;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ensure(){state.conversations={records:{},drafts:{},...state.conversations};state.conversations.records=state.conversations.records||{};state.conversations.drafts=state.conversations.drafts||{}}
function persist(){try{localStorage.setItem('english-path-offline',JSON.stringify(state));return true}catch{const el=document.querySelector('#conv-status');if(el)el.textContent='No se pudo guardar en este navegador. Tu práctica sigue disponible mientras esta página esté abierta.';return false}}
function key(l,id){return l+':'+id}
function mediaCleanup(){window.klevyProductive.cleanup();window.klevyWordHelp?.close();root.querySelectorAll('audio').forEach(a=>a.pause());stopVoice()}
function cancel(){mediaCleanup();run=null;scenario=null}
function back(label,action){const b=document.querySelector('#simple-back');b.hidden=false;b.textContent='← '+label;b.onclick=()=>{mediaCleanup();action();window.scrollTo({top:0,behavior:'instant'})}}
function page(title,body){root.innerHTML=`<section class="panel conv" data-simple-screen="conversation"><p class="study-kicker">CONVERSACIÓN GUIADA · ${state.level}</p><h2>${E(title)}</h2>${body}<p id="conv-status" class="simple-note" role="status"></p></section>`;back('Conversaciones',hub);window.scrollTo({top:0,behavior:'instant'})}
function hub(){ensure();cancel();const list=scenarios.filter(s=>s.level===state.level);page('Hablá en una situación real',`<p>Escuchá, respondé y practicá una repregunta. Una conversación tiene tres turnos.</p><div class="simple-menu">${list.map(s=>{const k=key(state.level,s.id),draft=state.conversations.drafts[k],record=state.conversations.records[k];return `<button class="simple-choice" data-conversation="${s.id}"><span><strong>${E(s.title)}</strong><small>${draft?'Retomar · turno '+(draft.turn+1)+' de 3':record?'✓ Practicada · volver a intentar':'3 turnos · unos 5–8 minutos'}</small></span><span aria-hidden="true">→</span></button>`}).join('')}</div><details class="simple-details"><summary>Cómo funciona</summary><p>Son guiones preparados con voz sintética. Elegís una alternativa para orientar la repregunta: la app no interpreta tu voz ni evalúa tu pronunciación.</p><p>Podés grabarte para escucharte o practicar sin micrófono. El audio es temporal y no se sube; tus notas y avances se guardan en este navegador.</p></details>`);back('Explorar',()=>window.klevySimple.explore());root.querySelectorAll('[data-conversation]').forEach(b=>b.onclick=()=>start(b.dataset.conversation))}
function start(id){ensure();mediaCleanup();scenario=scenarios.find(s=>s.id===id&&s.level===state.level);if(!scenario)return hub();const k=key(state.level,id),draft=state.conversations.drafts[k];if(draft&&[0,1,2].includes(draft.turn)&&(!draft.turn||scenario.branches.some(b=>b.id===draft.branch))){run=draft;render()}else{run={id,level:state.level,turn:0,phase:'intro',branch:null,answers:[],startedAt:Date.now()};state.conversations.drafts[k]=run;persist();intro()}}
function intro(){page(scenario.title,`<p class="ep-badge">Tu papel</p><p><strong>${E(scenario.role)}</strong></p><p>${E(scenario.brief)}</p><button class="primary simple-main" id="conv-begin">Escuchar la primera pregunta →</button><p class="simple-note">Podés usar detalles ficticios. No hace falta memorizar una respuesta.</p>`);document.querySelector('#conv-begin').onclick=()=>{run.phase='speak';persist();render()}}
function currentTurn(){return run.turn===0?scenario.first:scenario.branches.find(b=>b.id===run.branch)?.turns[run.turn-1]}
function play(text){if(document.querySelector('#prod-stop-record')?.disabled===false){document.querySelector('#productive-status').textContent='Terminá la grabación antes de escuchar.';return}if(!('speechSynthesis'in window)){const transcript=document.querySelector('#conv-transcript');if(transcript)transcript.open=true;document.querySelector('#conv-status').textContent='La voz no está disponible. Podés leer la pregunta y responder en voz alta.';return}root.querySelectorAll('audio').forEach(a=>a.pause());stopVoice();const u=new SpeechSynthesisUtterance(text);const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.voiceURI===state.preferences.practiceVoice)||voices.find(v=>/^en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));u.lang=voice?.lang||'en-GB';if(voice)u.voice=voice;u.rate=.9;u.onerror=e=>{if(['canceled','interrupted'].includes(e.error))return;const t=document.querySelector('#conv-transcript');if(t)t.open=true;const s=document.querySelector('#conv-status');if(s)s.textContent='No se pudo reproducir la voz. Podés leer la pregunta.'};speechSynthesis.speak(u)}
function render(){if(run.phase==='intro')return intro();mediaCleanup();const t=currentTurn();if(!t)return hub();const k=key(run.level,run.id),saved=run.answers[run.turn]||{};page(scenario.title,`<p class="simple-step-label">Turno ${run.turn+1} de 3 · ${run.turn===0?'Abrir la conversación':'Responder a una repregunta'}</p><div class="conv-speaking"><p>${E(t.goal)}</p><button class="primary simple-main" id="conv-listen">♫ Escuchar pregunta</button><p class="simple-note">Voz sintética · después respondé con tus propias palabras.</p></div><details id="conv-transcript" class="simple-details"><summary>Leer la pregunta</summary><p lang="en">${E(t.question)}</p></details><details id="conv-help" class="simple-details"><summary>Frases para empezar</summary>${t.chunks.map(c=>`<p lang="en">${E(c)}</p>`).join('')}</details><section class="conv-recorder"><div class="conv-speaking"><p class="simple-note">Intentá una respuesta de 30–60 segundos. La grabación es opcional.</p><div class="conv-record-actions"><button id="prod-record">● Grabarme</button><button id="prod-stop-record" disabled>Terminar grabación</button><span id="prod-timer" class="simple-note"></span></div></div><p id="productive-status" class="simple-note" role="status"></p><audio id="prod-recording" controls hidden></audio><button id="prod-discard" hidden>Descartar audio</button></section><div class="conv-speaking"><button class="primary simple-main" id="conv-review">Revisar mi respuesta →</button></div><div id="conv-review-area"></div><p class="simple-note conv-audio-notice">El audio se borra al pasar de turno o salir. Las notas y la revisión sí se guardan.</p>`);
window.klevyProductive.prepareRecorder('conversation:'+k+':'+run.turn);document.querySelector('#conv-listen').onclick=()=>play(t.question);document.querySelector('#prod-record').onclick=()=>window.klevyProductive.startRecording('conversation:'+k+':'+run.turn);document.querySelector('#prod-stop-record').onclick=()=>window.klevyProductive.stopRecording();document.querySelector('#prod-discard').onclick=()=>{mediaCleanup();document.querySelector('#prod-recording').hidden=true;document.querySelector('#prod-discard').hidden=true;window.klevyProductive.prepareRecorder('conversation:'+k+':'+run.turn);document.querySelector('#productive-status').textContent='Audio descartado.'};document.querySelector('#prod-recording').onplay=stopVoice;document.querySelector('#conv-review').onclick=()=>review(t);if(run.phase==='review')review(t,true)}
function review(t,resuming=false){const begin=document.querySelector('#prod-record'),stop=document.querySelector('#prod-stop-record');if(begin.disabled&&stop.disabled){document.querySelector('#productive-status').textContent='Resolvé el permiso del micrófono antes de revisar. Podés salir desde el menú.';return}if(!resuming&&run.phase==='review')return;if(!stop.disabled)window.klevyProductive.stopRecording();stopVoice();run.phase='review';persist();root.querySelectorAll('.conv-speaking').forEach(el=>el.hidden=true);document.querySelector('#conv-help').open=false;document.querySelector('#conv-transcript').open=false;const saved=run.answers[run.turn]||{checks:[],note:''};run.answers[run.turn]=saved;document.querySelector('#conv-review-area').innerHTML=`<h3>Escuchate y elegí una mejora</h3><p>Si grabaste tu respuesta, escuchala arriba. Compará lo que comunicaste con estos puntos.</p>${t.checks.map((c,i)=>`<label class="conv-check"><input type="checkbox" data-conv-check="${i}" ${saved.checks[i]?'checked':''}> ${E(c)}</label>`).join('')}<details class="simple-details"><summary>Comparar con una respuesta posible</summary><p lang="en">${E(t.model)}</p><button id="conv-model">♫ Escuchar ejemplo</button><p class="simple-note">Es un ejemplo, no la única forma correcta de responder.</p></details><label for="conv-note">Una frase o idea para mejorar</label><textarea id="conv-note" rows="2" maxlength="600" placeholder="Por ejemplo: confirmar la fecha antes de despedirme.">${E(saved.note)}</textarea>${run.turn===0?`<fieldset class="conv-branch"><legend>${E(scenario.choice)}</legend><p class="simple-note">Esta elección determina la próxima pregunta; no se analiza tu grabación.</p>${scenario.branches.map(b=>`<label class="conv-check"><input type="radio" name="conv-branch" value="${b.id}" ${run.branch===b.id?'checked':''}> ${E(b.label)}</label>`).join('')}</fieldset>`:''}<button id="conv-retry">Volver a responder este turno</button><button id="conv-next" class="primary simple-main">${run.turn<2?'Registrar revisión y seguir →':'Terminar conversación →'}</button><p id="conv-validation" class="simple-note" role="status"></p>`;document.querySelector('#conv-retry').onclick=()=>{run.phase='speak';saved.checks=[];persist();render()};document.querySelector('#conv-model').onclick=()=>play(t.model);document.querySelector('#conv-note').oninput=e=>{saved.note=e.target.value;persist()};root.querySelectorAll('[data-conv-check]').forEach(el=>el.onchange=()=>{saved.checks=[...root.querySelectorAll('[data-conv-check]')].map(c=>c.checked);persist()});root.querySelectorAll('[name="conv-branch"]').forEach(el=>el.onchange=()=>{run.branch=el.value;persist()});document.querySelector('#conv-next').onclick=()=>{if(run.turn===0&&!run.branch){document.querySelector('#conv-validation').textContent='Elegí cómo querés continuar para escuchar la repregunta.';return}saved.reviewedAt=Date.now();persist();if(run.turn<2){run.turn++;run.phase='speak';persist();render()}else finish()}}
function finish(){mediaCleanup();const k=key(run.level,run.id),old=state.conversations.records[k]||{};state.conversations.records[k]={attempts:(old.attempts||0)+1,completedAt:Date.now(),branch:run.branch,answers:run.answers.map(a=>({...a}))};delete state.conversations.drafts[k];persist();const title=scenario.title,id=scenario.id;page('Conversación practicada',`<p>Completaste los tres turnos de <strong>${E(title)}</strong> y registraste tu revisión personal.</p><p>No es una puntuación de pronunciación o fluidez. Probá otra alternativa la próxima vez para responder a preguntas distintas.</p><details class="simple-details"><summary>Mis notas para mejorar</summary>${run.answers.map((a,i)=>`<p><strong>Turno ${i+1}:</strong> ${E(a.note||'Sin nota personal.')}</p>`).join('')}</details><button class="primary simple-main" id="conv-another">Elegir otra conversación →</button><button id="conv-repeat">Repetir esta situación</button>`);document.querySelector('#conv-another').onclick=hub;document.querySelector('#conv-repeat').onclick=()=>start(id)}
const style=document.createElement('style');style.textContent=`.conv p{line-height:1.8}.conv .simple-details{margin-top:16px}.conv audio{width:100%;margin:12px 0}.conv-record-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.conv textarea{display:block;font:inherit;width:100%;padding:12px;border:1px solid #c9d4c6;border-radius:10px;margin:10px 0 20px}.conv-check{display:block;padding:12px 0;line-height:1.7}.conv-check input{margin-right:8px}.conv-branch{border:1px solid #dce3d5;border-radius:12px;margin:20px 0;padding:16px}.conv-branch legend{font-weight:600;padding:0 6px}.conv-recorder{margin-top:18px}.conv #conv-repeat{margin-top:12px}.conv-audio-notice{margin-top:20px}@media(max-width:560px){.conv-record-actions button{flex:1}.conv-branch{padding:12px}}`;document.head.append(style);ensure();window.klevyConversations={hub,start,cancel,scenarios,get current(){return run}};
})();

</script>

<script>window.klevyNaturalListening=[{"id": "listen-manchester", "level": "B1", "title": "Una ciudad y su reputación", "voices": "Mathew (Reino Unido) y Todd (EE. UU.)", "sourceTitle": "Manchester · ELLLO 153", "source": "https://www.manythings.org/elllo/24.html", "gist": ["What is the main focus of the conversation?", ["How Mathew sees his home city", "How to book a hotel in Japan", "Why Todd wants to change jobs"], 0, "Mathew presenta su ciudad y contrasta su imagen industrial con la cultura y la música."], "detail": {"prompt": "Where was Mathew living before he moved to Japan? Respondé en inglés con el nombre de la ciudad o del país.", "accepted": ["Bangkok", "Thailand", "Bangkok Thailand", "in Bangkok", "in Thailand"], "answer": "Bangkok, Thailand", "why": "Dice que vivía en Bangkok, en Tailandia, antes de ir a Japón."}, "oral": "Describe a town you know. Explain one common impression of it and one thing visitors might not expect. Use one idea from Mathew’s comparison.", "model": "My town is often seen as a quiet place, but it also has a lively music scene. Like Mathew’s description of Manchester, its reputation does not tell the whole story. Visitors might be surprised by the concerts in the park.", "checks": ["Expliqué una impresión común y añadí un contraste.", "Relacioné mi respuesta con una idea del audio."], "mp3": "audio/elllo-153-manchester.mp3", "originalMp3": "https://www.elllo.org/Audio/A0151/153-Matt-Manchester.mp3", "lines": [{"speaker": "Todd", "text": "Hello, what is your name?"}, {"speaker": "Mathew", "text": "My name is Mathew Gill."}, {"speaker": "Todd", "text": "Mathew, where are you from?"}, {"speaker": "Mathew", "text": "I'm from England, from North of England, near Manchester."}, {"speaker": "Todd", "text": "Were you living in Manchester before you can to Japan?"}, {"speaker": "Mathew", "text": "No, I was living in Bangkok, in Thailand, before I came to Japan."}, {"speaker": "Todd", "text": "Wow, world traveler."}, {"speaker": "Mathew", "text": "Yes, something like that."}, {"speaker": "Todd", "text": "Tell us about Manchester. What is Manchester like?"}, {"speaker": "Mathew", "text": "Manchester's well know for being quite a grim, industrial town. but it's got a more modern reputation as a center of arts, and there's lots of cool music that comes out of there. Oasis from Manchester is the most famous band, and the Smiths, kind of fifteen years ago, came from Manchester."}, {"speaker": "Todd", "text": "Oh, that's great. I love the Smiths, actually. Do you like Manchester?"}, {"speaker": "Mathew", "text": "I think it's a fantastic place, yeah."}, {"speaker": "Todd", "text": "I'd love to live there in the future. It's a great city."}], "duration": "1:48"}, {"id": "listen-adelaide", "level": "B1", "title": "Hablar del lugar donde vivimos", "voices": "Sophie (Australia) y Todd (EE. UU.)", "sourceTitle": "Adelaide · ELLLO 155", "source": "https://www.manythings.org/elllo/31.html", "gist": ["How does Sophie mainly feel about living in Australia?", ["She wants to avoid returning there", "She values its lifestyle and people", "She dislikes the lack of space"], 1, "Sophie dice que le gustan el espacio, la limpieza, el estilo de vida y las personas."], "detail": {"prompt": "How long has Sophie lived in Adelaide at the time of this interview? Escribí el número en inglés o en cifras.", "accepted": ["six", "6", "six years", "6 years", "about six years"], "answer": "about six years", "why": "Según la entrevista, llevaba aproximadamente seis años viviendo allí; no había nacido en Adelaide."}, "oral": "Tell a visitor about a place you have lived in. Mention how long you lived there and two things you liked or would change.", "model": "I lived in a small town for three years. I liked the open spaces and the friendly people, but I would improve the bus service. Sophie values a healthy lifestyle, and being able to walk everywhere was important to me too.", "checks": ["Mencioné cuánto tiempo viví allí.", "Di dos detalles y relacioné al menos uno con el audio."], "mp3": "audio/elllo-155-adelaide.mp3", "originalMp3": "https://www.elllo.org/Audio/A0151/155-Sophie-Home.mp3", "lines": [{"speaker": "Todd", "text": "OK. Hello!"}, {"speaker": "Sophie", "text": "Hello!"}, {"speaker": "Todd", "text": "Hi. Could you say your name please?"}, {"speaker": "Sophie", "text": "Sophie Wilkins."}, {"speaker": "Todd", "text": "Sophie Wilkins. Sophie, where are you from?"}, {"speaker": "Sophie", "text": "I'm from Adelaide, South Australia."}, {"speaker": "Todd", "text": "Oh, nice. Adelaide. What's Adelaide like?"}, {"speaker": "Sophie", "text": "It's a big country town, although it is actually a capital city of South Australia."}, {"speaker": "Todd", "text": "OK. Is it like over a million people or?"}, {"speaker": "Sophie", "text": "It's about 1.8 million people."}, {"speaker": "Todd", "text": "Oh, that's pretty big. Nice. How long have you lived there?"}, {"speaker": "Sophie", "text": "I've lived there for about six years."}, {"speaker": "Todd", "text": "Six years!"}, {"speaker": "Sophie", "text": "Mm!"}, {"speaker": "Todd", "text": "OK. So, you weren't born there?"}, {"speaker": "Sophie", "text": "No, no. I was actually born on a farm in mid-north South Australia."}, {"speaker": "Todd", "text": "Oh, nice. Farmer girl."}, {"speaker": "Sophie", "text": "Yeah!"}, {"speaker": "Todd", "text": "That's cool. OK. So what, what do you think about Australia?"}, {"speaker": "Sophie", "text": "I love it. I love the space, how clean it is, the health, the lifestyle. It's very healthy, and the people as well."}, {"speaker": "Todd", "text": "OK. Great, so after Japan are you going to go back to Australia?"}, {"speaker": "Sophie", "text": "Temporarily I think yes. For a couple of months and then hopefully come back to Japan."}, {"speaker": "Todd", "text": "OK. Great. Thanks."}, {"speaker": "Sophie", "text": "Alright."}], "duration": "1:00"}, {"id": "listen-weekend", "level": "B1", "title": "Un plan para el fin de semana", "voices": "Adrianna (Reino Unido); origen del entrevistador no identificado por la fuente", "sourceTitle": "Weekend Get-away · ELLLO 41", "source": "https://www.manythings.org/elllo/55.html", "gist": ["Why is Adrianna travelling for the weekend?", ["To begin a new teaching job", "To move permanently to a new city", "To visit a friend she knows from university"], 2, "Va a Fukuoka para encontrarse con una amiga con quien estudió en la universidad."], "detail": {"prompt": "On which day are they planning a Thanksgiving celebration? Escribí el día de la semana en inglés.", "accepted": ["Sunday", "on Sunday"], "answer": "Sunday", "why": "Adrianna menciona una celebración el domingo, además de otros planes como ir a karaoke."}, "oral": "Invite a friend to spend a weekend with you. Suggest two activities and ask one question to check their preferences.", "model": "Would you like to visit next weekend? We could have lunch with my friends on Saturday and go for a walk on Sunday. Adrianna mentions karaoke; would you enjoy that, or would you prefer a quieter evening?", "checks": ["Propuse dos actividades concretas.", "Hice una pregunta para conocer la preferencia de mi amigo."], "mp3": "audio/elllo-041-weekend.mp3", "originalMp3": "https://www.elllo.org/Audio/A0001/041-Adrianne-Weekend.mp3", "lines": [{"speaker": "Unidentified", "text": "So what are you doing this weekend, Adriana?"}, {"speaker": "Adriana", "text": "I'm going to Fukuoka with...to meet my friend."}, {"speaker": "Unidentified", "text": "Oh, cool. How do you know her?"}, {"speaker": "Adriana", "text": "She went to university with me."}, {"speaker": "Unidentified", "text": "What's she doing in Fukuoka?"}, {"speaker": "Adriana", "text": "She's on the Jet Program, teaching."}, {"speaker": "Unidentified", "text": "Oh, cool. Does she like it?"}, {"speaker": "Adriana", "text": "Yeah, she likes it. She renewed her contract so this is her third year."}, {"speaker": "Unidentified", "text": "Excellent. Do you know what you are going to be doing down in Fukuoka?"}, {"speaker": "Adriana", "text": "I think she's going to take me to a pub."}, {"speaker": "Unidentified", "text": "You've not been to any of them in Japan?"}, {"speaker": "Adriana", "text": "No, not, first time. And we are going to... What are we going to do? Oh, we're going to have a Thankgiving celebration on Sunday and we're gonna go to karaoke."}, {"speaker": "Unidentified", "text": "OK, have you been to any karaoke bars here?"}, {"speaker": "Adriana", "text": "Yeah, I went to a karaoke bar in Roppongi."}, {"speaker": "Unidentified", "text": "Did you sing?"}, {"speaker": "Adriana", "text": "Of course ."}, {"speaker": "Unidentified", "text": "Excellent. In English?"}, {"speaker": "Adriana", "text": "Ah, yeah! My Japanese isn't too great."}], "duration": "1:24"}, {"id": "listen-computers", "level": "B2", "title": "Tecnología para mantener vínculos", "voices": "Jeanna y Todd (EE. UU.)", "sourceTitle": "Teens and Computers · ELLLO 81", "source": "https://www.manythings.org/elllo/56.html", "gist": ["What practical role does the computer play after Jeanna’s move?", ["It helps her maintain friendships at a distance", "It replaces all her school classes", "It allows her to avoid learning new skills"], 0, "Lo usa para seguir en contacto con amistades de su lugar anterior. La entrevista pertenece a otra época tecnológica."], "detail": {"prompt": "What does Jeanna want because her current device has become slow? Escribí el objeto principal en inglés.", "accepted": ["computer", "a computer", "a new computer", "new computer", "PC", "a new PC", "desktop computer"], "answer": "a new computer", "why": "Quiere una computadora nueva porque cree que dañó la que tiene y ahora funciona lentamente."}, "oral": "Compare one way people kept in touch in this archive interview with one way you use today. Discuss a benefit and a possible drawback without assuming everyone has the same habits.", "model": "In this interview, instant messaging helps Jeanna maintain older friendships after moving. Today, group chats can serve a similar purpose, although the platforms have changed. They make contact convenient, but frequent notifications can become distracting. The value depends partly on how people use them.", "checks": ["Distinguí el contexto de archivo de la situación actual.", "Desarrollé un beneficio y un límite, con un ejemplo."], "mp3": "audio/elllo-081-computers.mp3", "originalMp3": "https://www.elllo.org/Audio/A0051/081-Jeanna-Computers.mp3", "lines": [{"speaker": "Todd", "text": "OK, Jeanna, you like the computer!"}, {"speaker": "Jeanna", "text": "Yes, I do ."}, {"speaker": "Todd", "text": "OK. Talk to us about computers."}, {"speaker": "Jeanna", "text": "Well, I go on the computer a lot and I talk with friends through AOL instant messenger. And I just moved from my hometown to Sacremento so it's a good way to keep in touch with old friends."}, {"speaker": "Todd", "text": "Yeah. Do you learn about computers at school or on your own?"}, {"speaker": "Jeanna", "text": "I picked most of what I know, I've picked it up, through, ya know, the years, and some at school, like keyboarding and such."}, {"speaker": "Todd", "text": "OK. Do you have a laptop or a PC?"}, {"speaker": "Jeanna", "text": "I have a PC. A Compac."}, {"speaker": "Todd", "text": "Do you like your computer or do you want a new one?"}, {"speaker": "Jeanna", "text": "I want a new one cause I think I screwed mine up and it's a little bit slow now."}, {"speaker": "Todd", "text": "OK. How long have you had your computer?"}, {"speaker": "Jeanna", "text": "I've had it for about 3 or 4 years."}, {"speaker": "Todd", "text": "Oh, yeah, that's pretty old for a computer. Yeah, so do you talk to your friends every night by e-mail?"}, {"speaker": "Jeanna", "text": "Yeah, yes I do."}, {"speaker": "Todd", "text": "OK."}, {"speaker": "Jeanna", "text": "See going on and you know the gossip."}, {"speaker": "Todd", "text": "So nowadays, do high school kids talk by e-mail more than phone?"}, {"speaker": "Jeanna", "text": "Most people talk by either e-mail or cellular phone. You know a lot of people don't use their house phones as much, and a lot of people have cellular phones."}, {"speaker": "Todd", "text": "OK. Thanks a lot Jeanna."}], "duration": "1:24"}, {"id": "listen-diplomat", "level": "B2", "title": "Una aspiración y un plan", "voices": "Christian (Noruega) y Todd (EE. UU.)", "sourceTitle": "Dream Job · ELLLO 163", "source": "https://www.manythings.org/elllo/59.html", "gist": ["Why is studying Japanese important to Christian’s plan?", ["He has already been appointed ambassador", "He believes it could help his diplomatic career", "He wants to replace his International Relations studies"], 1, "Considera que saber un idioma que pocos compatriotas hablan puede darle una ventaja. Expresa una aspiración, no un nombramiento obtenido."], "detail": {"prompt": "Which country does Christian hope to represent as a diplomat? Escribí el país en inglés.", "accepted": ["Norway", "Norwegian embassy", "the Norwegian embassy", "represent Norway"], "answer": "Norway", "why": "Quiere representar a Noruega y espera trabajar en su embajada en Tokio."}, "oral": "Summarise Christian’s goal and one reason for his study choices. Then explain what additional information you would need before making a similar career plan.", "model": "Christian hopes to represent Norway in Japan, and he sees Japanese as a skill that could give him a competitive advantage. His plan connects language study with International Relations and further training. Before following a similar route, I would check current entry requirements and speak to people doing the job, because this is an archive interview rather than up-to-date career guidance.", "checks": ["Separé su aspiración de un resultado garantizado.", "Justifiqué una comprobación adicional antes de tomar una decisión."], "mp3": "audio/elllo-163-dream-job.mp3", "originalMp3": "https://www.elllo.org/Audio/A0151/163-Chris-Dreamjob.mp3", "lines": [{"speaker": "Todd", "text": "OK, Christian, what is your dream job, if you could have any job in the world?"}, {"speaker": "Christian", "text": "My dream job is to become a diplomat representing my country, preferably in Japan. That's why I came to Japan to learn Japanese and hopefully obtain a master degree in International Relations. After getting my master's degree in International Relations, I would like to go home and enter the diplomat school for the Ministry of Foreign Affairs, which is a three year program, and then, after that hopefully come back to Japan and work for the Norwegian Embassy in Tokyo."}, {"speaker": "Todd", "text": "Must be pretty competitive."}, {"speaker": "Christian", "text": "It's very competitive, but I think if you know a certain language that not many people speak it gives you a competitive edge nevertheless so that's why I came to Japan because I know at this stage there are only 300 hundred people from Norway living in Japan and not all of them are here to study Japanese, they represent different companies or schools, or they're missionaries so, that's the track I'm on right now but we'll see how it goes in the end."}, {"speaker": "Todd", "text": "How about when you were a child, what was your dream job? Did you want to be a diplomat when you were say, 10?"}, {"speaker": "Christian", "text": "No, when I was ten I probably didn't know what I wanted to do. I was just too busy playing in the street, you know, having fun with my friends and these things. When I was that young I really didn't have a dream job like fireman, police. I never really went through that stage, you know."}, {"speaker": "Todd", "text": "I wanted to be a baseball player."}, {"speaker": "Christian", "text": "Alright, fair enough."}, {"speaker": "Todd", "text": "I'm still dreaming."}, {"speaker": "Christian", "text": "Oh, that's good."}], "duration": "1:28"}, {"id": "listen-medical-career", "level": "B2", "title": "Escuchar una explicación con vacilaciones", "voices": "Jessica y Todd (EE. UU.)", "sourceTitle": "Dream Job · ELLLO 47", "source": "https://www.manythings.org/elllo/60.html", "gist": ["What does Jessica describe in this conversation?", ["A job she has already held for many years", "A plan to become a hospital architect", "A medical support career she hopes to pursue"], 2, "Habla de una carrera a la que aspira. Las vacilaciones y correcciones son parte de una conversación espontánea."], "detail": {"prompt": "Which activity does Jessica explicitly exclude from the smaller tasks she describes? Respondé en inglés con una palabra.", "accepted": ["surgery", "operations", "operation", "surgical operations"], "answer": "surgery", "why": "Dice not surgery al explicar las tareas menores. Esto reproduce su descripción, no define las funciones profesionales actuales."}, "oral": "Summarise what Jessica hopes to do. Identify one point you would ask her to clarify, and explain why that detail matters. Do not treat the interview as current professional guidance.", "model": "Jessica hopes to become a physician’s assistant and describes helping with smaller tasks in a medical setting. I would ask her to clarify the training route, because she gives several possible durations and corrects herself. Before making a career decision, I would check current requirements with an official source.", "checks": ["Resumí la intención de Jessica sin presentarla como un hecho ya logrado.", "Formulé una aclaración pertinente y expliqué por qué importa."], "mp3": "audio/elllo-047-dream-job.mp3", "originalMp3": "https://www.elllo.org/Audio/A0001/047-Jessica-DreamJob.mp3", "lines": [{"speaker": "Todd", "text": "OK. Jessica, we're back. We're gonna talk about your future. What do you want to be when you grow up?"}, {"speaker": "Jessica", "text": "Well, um, I wanna be a physician's assistant."}, {"speaker": "Todd", "text": "OK. What is a physician's assistant?"}, {"speaker": "Jessica", "text": "Well, normally when you go into a, into the doctor's office, you wouldn't usually get, well you would get your doctor all they do is check, give you check-ups or you know maybe take out stitches or something, not surgery. You just go in and do the little things. So the doctor does not have to do them."}, {"speaker": "Todd", "text": "Oh, OK. So that is what you want to do?"}, {"speaker": "Jessica", "text": "Yeah."}, {"speaker": "Todd", "text": "OK."}, {"speaker": "Jessica", "text": "And make lots of money."}, {"speaker": "Todd", "text": "You wanna make lots of money."}, {"speaker": "Jessica", "text": "OK. Nothing wrong with that."}, {"speaker": "Todd", "text": "How do you become a physici... physician's assistant. I can't even say it."}, {"speaker": "Jessica", "text": "It's a lot of schooling. You have like six years, four or six years of college and you obviously take the,like nursing and other kinds of classes like that and then you do like um, two, two or four years at like a hospital as a.."}, {"speaker": "Todd", "text": "Like an assistant, or.."}, {"speaker": "Jessica", "text": "Like, like you're actually doing."}, {"speaker": "Todd", "text": "Oh, an intern."}, {"speaker": "Jessica", "text": "An intern, yeah! An internship for two or four years at a hospital."}, {"speaker": "Todd", "text": "Then, that's it. You finish."}, {"speaker": "Jessica", "text": "And then you hopefully go on and maybe have your own little doctor's place and open that up or something."}, {"speaker": "Todd", "text": "Well, best wishes on becoming a physician's assistant. I'm sure you'll make a good one."}, {"speaker": "Jessica", "text": "Thank you."}], "duration": "1:31"}];</script>
<script>
(()=>{
const lessons=window.klevyNaturalListening,root=document.querySelector('#app');let run=null,lesson=null;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
function ensure(){state.listening={records:{},drafts:{},...state.listening};state.listening.records=state.listening.records||{};state.listening.drafts=state.listening.drafts||{}}
function persist(){try{localStorage.setItem('english-path-offline',JSON.stringify(state));return true}catch{const s=document.querySelector('#natural-status');if(s)s.textContent='No se pudo guardar en este navegador. Podés continuar durante esta sesión.';return false}}
const key=(l,id)=>l+':'+id;
function media(){window.klevyProductive.cleanup();window.klevyWordHelp?.close();root.querySelectorAll('audio').forEach(a=>a.pause());stopVoice()}
function cancel(){media();run=null;lesson=null}
function back(label,fn){const b=document.querySelector('#simple-back');b.hidden=false;b.textContent='← '+label;b.onclick=()=>{media();fn();window.scrollTo({top:0,behavior:'instant'})}}
function page(title,body){root.innerHTML=`<section class="panel natural" data-simple-screen="natural-listening"><p class="study-kicker">ESCUCHA EN CONTEXTO · ${state.level}</p><h2>${E(title)}</h2>${body}<p id="natural-status" class="simple-note" role="status"></p></section>`;back('Escuchas',hub);window.scrollTo({top:0,behavior:'instant'})}
function hub(){ensure();cancel();page('Escuchar y reaccionar',`<p>Primero la idea principal, después un detalle y al final tu respuesta oral.</p><div class="simple-menu">${lessons.filter(l=>l.level===state.level).map(l=>{const k=key(state.level,l.id),d=state.listening.drafts[k],r=state.listening.records[k];return `<button class="simple-choice" data-natural="${l.id}"><span><strong>${E(l.title)}</strong><small>${d?'Retomar · paso '+(d.step+1)+' de 3':r?'✓ Practicada · volver a escuchar':l.duration+' · audio original'}<br>${E(l.voices)}</small></span><span aria-hidden="true">→</span></button>`}).join('')}</div><details class="simple-details"><summary>Sobre estas escuchas</summary><p>Voces humanas originales de ELLLO; no son voces sintéticas. Las grabaciones son de archivo y conservan vacilaciones y referencias de su época. El nivel de la actividad es orientativo.</p><p>Audio y texto: ELLLO / Todd Beuckens. Transcripción de apoyo: ManyThings.org. Uso educativo no comercial según la <a href="https://www.manythings.org/elllo/about.html" target="_blank" rel="noopener noreferrer">información de la fuente</a>. Las preguntas y los ejemplos de respuesta fueron creados para Klevy.</p><p>El audio se aloja con Klevy y necesita conexión para cargarse. Podés abrir la transcripción como ayuda. Se registra si la consultaste.</p></details>`);back('Situaciones reales',()=>window.klevySimple.open('library'));root.querySelectorAll('[data-natural]').forEach(b=>b.onclick=()=>start(b.dataset.natural))}
function start(id){ensure();media();lesson=lessons.find(l=>l.id===id&&l.level===state.level);if(!lesson)return hub();const k=key(state.level,id);run=state.listening.drafts[k];if(!run||![0,1,2].includes(run.step)){run={id,level:state.level,step:0,help:[false,false,false],plays:[0,0,0],startedAt:Date.now(),oral:{checks:[],note:''}};state.listening.drafts[k]=run;persist()}render()}
function source(){return `<details class="simple-details"><summary>Fuente y permisos</summary><p><a href="${E(lesson.source)}" target="_blank" rel="noopener noreferrer">${E(lesson.sourceTitle)} ↗</a><br>${E(lesson.voices)}</p><p class="simple-note">Audio original completo, sin recortes. ELLLO / Todd Beuckens; transcripción de apoyo de ManyThings. Grabación de archivo: sus opiniones y datos pertenecen al momento de la entrevista. Las actividades y el ejemplo oral son de Klevy.</p><a href="https://www.manythings.org/elllo/about.html" target="_blank" rel="noopener noreferrer">Uso educativo no comercial y atribución ↗</a></details>`}
function transcript(){return `<details id="natural-transcript" class="simple-details"><summary>Ver transcripción (ayuda)</summary>${lesson.lines.map(l=>`<p><strong>${E(l.speaker)}:</strong> <span lang="en" data-context-sentence data-context-material="${lesson.id}">${E(l.text)}</span></p>`).join('')}<p class="simple-note">Versión textual de ManyThings. Puede contener errores de archivo; usala para apoyar la escucha, no como modelo gramatical.</p></details>`}
function render(){media();const active=run,s=run.step,graded=s===0?run.gist:s===1?run.detail:null;page(lesson.title,`<p class="simple-step-label">Paso ${s+1} de 3 · ${['Entender la idea principal','Recuperar un detalle','Responder en voz alta'][s]}</p>${s<2?`<p>${s===0?'Escuchá sin leer primero. Buscá el sentido general, sin intentar reconocer cada palabra.':'Escuchá otra vez y prestá atención al dato que pide la pregunta.'}</p>`:''}<div id="natural-player-box"><audio id="natural-audio" controls preload="none" src="${E(lesson.mp3)}"></audio><p class="simple-note">Audio original · ${lesson.duration} · voces humanas</p><p id="natural-audio-status" class="simple-note" role="status"></p></div>${s===0?`<p class="natural-question" lang="en">${E(lesson.gist[0])}</p><div class="options">${lesson.gist[1].map((a,i)=>`<button data-natural-choice="${i}" ${graded?'disabled':''}><span lang="en">${E(a)}</span></button>`).join('')}</div>`:s===1?`<p class="natural-question">${E(lesson.detail.prompt)}</p><form id="natural-form"><label for="natural-detail">Tu respuesta</label><input id="natural-detail" maxlength="160" autocomplete="off" autocapitalize="off" spellcheck="false" value="${E(run.detailText||'')}" ${graded?'readonly':''}><button class="primary" id="natural-check" ${graded?'disabled':''}>Comprobar respuesta</button></form>`:`<p lang="en">${E(lesson.oral)}</p><p>Respondé durante unos 45–90 segundos. Podés grabarte o practicar sin micrófono.</p><div class="natural-record-actions"><button id="prod-record">● Grabarme</button><button id="prod-stop-record" disabled>Terminar grabación</button><span id="prod-timer" class="simple-note"></span></div><p id="productive-status" class="simple-note" role="status"></p><audio id="prod-recording" controls hidden></audio><button id="prod-discard" hidden>Descartar audio</button><details class="simple-details"><summary>Comparar con un ejemplo de práctica</summary><p lang="en">${E(lesson.model)}</p></details>${lesson.checks.map((c,i)=>`<label class="natural-check"><input type="checkbox" data-natural-review="${i}" ${run.oral.checks[i]?'checked':''}> ${E(c)}</label>`).join('')}<label for="natural-note">Una idea para mejorar</label><textarea id="natural-note" rows="2" maxlength="600">${E(run.oral.note)}</textarea><button id="natural-finish" class="primary simple-main">Registrar mi autoevaluación →</button><p class="simple-note">El audio grabado es temporal y se borra al salir. La app no evalúa tu pronunciación.</p>`}<div id="natural-feedback" aria-live="polite"></div>${transcript()}${source()}`);
const audio=document.querySelector('#natural-audio');audio.onplay=()=>{if(run!==active){audio.pause();return}if(document.querySelector('#prod-stop-record')?.disabled===false){audio.pause();document.querySelector('#productive-status').textContent='Terminá la grabación antes de escuchar.';return}stopVoice();run.plays[s]++;persist()};audio.onerror=()=>{if(run!==active||!document.querySelector('#natural-audio-status'))return;document.querySelector('#natural-audio-status').innerHTML=`No se pudo cargar el audio. Podés <a href="${E(lesson.source)}" target="_blank" rel="noopener noreferrer">abrir la fuente ↗</a> o consultar la transcripción.`};document.querySelector('#natural-transcript').ontoggle=e=>{if(e.target.open&&run===active){run.help[s]=true;if(s===0&&run.gist)run.gist.help=true;if(s===1&&run.detail)run.detail.help=true;persist()}};
if(s===0)root.querySelectorAll('[data-natural-choice]').forEach(b=>b.onclick=()=>{if(run.gist)return;const choice=+b.dataset.naturalChoice;run.gist={choice,correct:choice===lesson.gist[2],help:run.help[0]};persist();render()});
if(s===1){document.querySelector('#natural-detail').oninput=e=>{run.detailText=e.target.value;persist()};document.querySelector('#natural-form').onsubmit=e=>{e.preventDefault();if(run.detail)return;const text=document.querySelector('#natural-detail').value.trim();if(!text){document.querySelector('#natural-feedback').textContent='Escribí una respuesta antes de comprobar.';return}run.detail={text,correct:lesson.detail.accepted.some(a=>normal(a)===normal(text)),help:run.help[1]};persist();render()}}
if(s===2){const k=key(run.level,run.id);window.klevyProductive.prepareRecorder('natural:'+k);document.querySelector('#prod-record').onclick=()=>{root.querySelectorAll('audio').forEach(a=>a.pause());window.klevyProductive.startRecording('natural:'+k)};document.querySelector('#prod-stop-record').onclick=()=>window.klevyProductive.stopRecording();document.querySelector('#prod-discard').onclick=()=>{media();document.querySelector('#prod-recording').hidden=true;document.querySelector('#prod-discard').hidden=true;window.klevyProductive.prepareRecorder('natural:'+k)};document.querySelector('#prod-recording').onplay=()=>{audio.pause();stopVoice()};root.querySelectorAll('[data-natural-review]').forEach(el=>el.onchange=()=>{run.oral.checks=[...root.querySelectorAll('[data-natural-review]')].map(c=>c.checked);persist()});document.querySelector('#natural-note').oninput=e=>{run.oral.note=e.target.value;persist()};document.querySelector('#natural-finish').onclick=finish;const player=document.querySelector('#natural-player-box'),d=document.createElement('details');d.className='simple-details';d.innerHTML='<summary>Volver a escuchar el audio original</summary>';player.before(d);d.append(player)}
if(graded){const correct=graded.correct,box=document.querySelector('#natural-feedback');box.innerHTML=`<div class="feedback"><strong>${correct?'Respuesta esperada.':'Compará con el audio.'}</strong><p>${E(s===0?lesson.gist[3]:lesson.detail.why)}</p>${s===1?`<p lang="en"><strong>${E(lesson.detail.answer)}</strong></p>`:''}${graded.help?'<p class="simple-note">Consultaste la transcripción en este paso.</p>':''}${s===1&&!correct?'<button id="natural-equivalent">Mi respuesta expresa lo mismo: registrar revisión personal</button>':''}</div><button id="natural-next" class="primary simple-main">${s===0?'Escuchar para recuperar un detalle →':'Usar lo que entendí al hablar →'}</button>`;document.querySelector('#natural-next').onclick=()=>{run.step++;persist();render()};if(document.querySelector('#natural-equivalent'))document.querySelector('#natural-equivalent').onclick=e=>{run.detail.correct=null;run.detail.selfReviewed=true;persist();e.target.disabled=true;e.target.textContent='Registrada como revisión personal'}}}
function finish(){const begin=document.querySelector('#prod-record'),stop=document.querySelector('#prod-stop-record');if(begin.disabled&&stop.disabled){document.querySelector('#productive-status').textContent='Resolvé el permiso del micrófono antes de salir, o usá el menú para cancelar.';return}media();const k=key(run.level,run.id),old=state.listening.records[k]||{},result={attempts:(old.attempts||0)+1,completedAt:Date.now(),gist:{...run.gist},detail:{...run.detail},oral:{...run.oral},help:[...run.help],plays:[...run.plays]};state.listening.records[k]=result;delete state.listening.drafts[k];const saved=persist();const checked=[result.gist,result.detail].filter(r=>r.correct!==null),correct=checked.filter(r=>r.correct).length,id=lesson.id;page('De escuchar a responder',`<p>Completaste los tres pasos. ${correct} de ${checked.length} respuestas coincidieron con las previstas. La respuesta oral se registró como autoevaluación.</p><p>${result.help.some(Boolean)?'Consultaste la transcripción como ayuda. Podés repetir otro día intentando escuchar primero sin texto.':'En esta práctica no abriste la transcripción.'}</p><button id="natural-another" class="primary simple-main">Elegir otra escucha →</button><button id="natural-repeat">Volver a intentarlo</button>`);if(!saved)document.querySelector('#natural-status').textContent='No se pudo guardar el resultado en este navegador.';document.querySelector('#natural-another').onclick=hub;document.querySelector('#natural-repeat').onclick=()=>start(id)}
window.addEventListener('klevy:save-expression',e=>{const l=lessons.find(l=>l.id===e.detail.materialId);if(!l)return;const item=state.notebook[window.klevyLexicon.normalize(e.detail.term)];if(item){item.source={source:'ELLLO / ManyThings · '+l.sourceTitle,url:l.source};persist()}});
const style=document.createElement('style');style.textContent=`.natural audio{display:block;width:100%;margin:16px 0}.natural p{line-height:1.8}.natural-question{font-size:20px}.natural input:not([type=checkbox]),.natural textarea{font:inherit;width:100%;padding:12px;border:1px solid #c9d4c6;border-radius:10px;display:block;margin:10px 0 16px}.natural .options button{width:100%}.natural-check{display:block;padding:12px 0;line-height:1.7}.natural-record-actions{display:flex;gap:10px;flex-wrap:wrap}.natural #natural-repeat{margin-top:14px}.natural [data-natural-review]{margin-right:8px}.natural #natural-equivalent{font-size:14px}@media(max-width:560px){.natural-question{font-size:18px}.natural-record-actions button{flex:1}}`;document.head.append(style);ensure();window.klevyListening={hub,start,cancel,lessons,get current(){return run}};
})();

</script>

<script>
(()=>{
const root=document.querySelector('#app'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null,payload=null,loading=null,epoch=0,curatedPromise;
const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const date=s=>new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',dateStyle:'medium',timeStyle:'short'}).format(new Date(s));
function ensure(){state.news={selections:{},drafts:{},records:{},...state.news};for(const k of ['selections','drafts','records'])state.news[k]=state.news[k]||{}}
function saveNews(){try{localStorage.setItem('english-path-offline',JSON.stringify(state));return true}catch{const el=document.querySelector('#news-status');if(el)el.textContent='No se pudo guardar en este navegador. Tu texto sigue disponible durante esta sesión.';return false}}
function valid(p){if(!p||p.version!==1||!p.article)return false;const a=p.article;try{const u=new URL(a.url);return u.protocol==='https:'&&(u.hostname==='nasa.gov'||u.hostname.endsWith('.nasa.gov'))&&a.id===a.url&&typeof a.title==='string'&&typeof a.excerpt==='string'&&a.excerpt.length>=40&&a.excerpt.length<=3000&&a.title.length<400&&Number.isFinite(Date.parse(a.publishedAt))&&Date.parse(a.publishedAt)<=Date.now()+60000&&Number.isFinite(Date.parse(p.checkedAt))}catch{return false}}
async function getJSON(url){const r=await fetch(url,{cache:'no-cache',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('fetch');return r.json()}
async function load(){ensure();const d=day(),cached=state.news.selections[d];if(valid(cached)&&!cached.fallback)return cached;if(loading)return loading;loading=(async()=>{let p;try{p=await getJSON('api/news');if(!valid(p)||p.selectionDay!==d)throw Error('invalid');p.fallback=false}catch{const candidates=Object.values(state.news.selections).filter(valid).sort((a,b)=>Date.parse(b.checkedAt)-Date.parse(a.checkedAt));p=candidates[0];if(!p){try{p=await getJSON('news/latest.json')}catch{}}if(!valid(p))throw Error('unavailable');p={...p,fallback:true}}
try{curatedPromise=curatedPromise||getJSON('news/curated.json').catch(()=>{curatedPromise=null;return {}});const all=await curatedPromise;p.adaptation=all[p.article.id]||p.adaptation||null}catch{}state.news.selections[d]=p;for(const k of Object.keys(state.news.selections).sort().slice(0,-7))delete state.news.selections[k];saveNews();return p})().finally(()=>{loading=null});return loading}
function media(){window.klevyProductive.cleanup();window.klevyWordHelp?.close();root.querySelectorAll('audio').forEach(a=>a.pause());stopVoice()}
function cancel(){epoch++;media();current=null;payload=null}
function back(){const b=document.querySelector('#simple-back');b.hidden=false;b.textContent='← Hoy';b.onclick=()=>window.klevySimple.today()}
function page(title,body){root.innerHTML=`<section class="panel news" data-simple-screen="news"><p class="study-kicker">EL INGLÉS DE HOY · ${state.level}</p><h2>${E(title)}</h2>${body}<p id="news-status" class="simple-note" role="status"></p></section>`;back();window.scrollTo({top:0,behavior:'instant'})}
function attach(){const host=root.querySelector('[data-simple-screen="today"]');if(!host||document.querySelector('#news-daily'))return;const d=document.createElement('details');d.id='news-daily';d.className='simple-details';d.innerHTML='<summary>El inglés de hoy · una noticia para practicar</summary><div id="news-teaser"></div>';const plan=host.querySelector('.simple-details');host.insertBefore(d,plan);d.ontoggle=()=>{if(d.open)teaser(d)}}
async function teaser(detail){const box=detail.querySelector('#news-teaser');box.innerHTML='<p class="simple-note" role="status">Buscando una lectura reciente…</p>';try{const p=await load();if(!box.isConnected)return;box.innerHTML=`<p class="news-headline" lang="en">${E(p.article.title)}</p><p class="simple-note">${E(p.article.publisher)} · Publicado: ${E(date(p.article.publishedAt))}</p>${p.fallback?`<p class="simple-note" role="status">No se pudo actualizar. Última selección guardada, consultada el ${E(date(p.checkedAt))}.</p>`:''}<button id="news-open" type="button">Leer y practicar →</button>`;box.querySelector('button').onclick=()=>open(p)}catch{if(!box.isConnected)return;box.innerHTML='<p role="status">No pudimos cargar una noticia. Podés seguir con tu práctica de hoy.</p><button id="news-retry">Volver a intentar</button>';box.querySelector('button').onclick=()=>teaser(detail)}}
async function open(p){media();const ticket=++epoch;if(!valid(p)){page('Preparando la lectura','<p role="status">Buscando la selección…</p>');try{p=await load()}catch{if(ticket!==epoch)return;page('No pudimos actualizar','<p>Podés volver a Hoy y continuar tu práctica. Tu progreso se conserva.</p>');return}}if(ticket!==epoch)return;payload=p;ensure();const k=state.level+':'+p.article.id;current=state.news.drafts[k];if(!current){current={level:state.level,id:p.article.id,stage:0,comprehension:'',opinion:'',checks:[],startedAt:Date.now()};state.news.drafts[k]=current;saveNews()}render()}
function adaptation(){return payload.adaptation?.[current.level]||null}

function source(){const a=payload.article;return `<details class="simple-details"><summary>Fuente y actualización</summary><p><a href="${E(a.url)}" target="_blank" rel="noopener noreferrer">Abrir publicación original de ${E(a.publisher)} ↗</a></p><p class="simple-note">Consulta de la fuente: ${E(date(payload.checkedAt))}. La selección se consulta al abrir esta sección y queda guardada durante el día en este navegador. Puede repetirse si no hay nuevas publicaciones adecuadas.</p><p class="simple-note">Las nuevas selecciones usan el resumen RSS original. Las adaptaciones, preguntas y ejemplos de Klevy se identifican aparte. Este proyecto no está afiliado a NASA.</p></details>`}
function reading(text){return text.split(/\n+/).filter(Boolean).map(p=>`<p lang="en" data-context-sentence data-context-material="news:${E(payload.article.id)}">${E(p)}</p>`).join('')}
function render(){media();const a=payload.article,t=adaptation(),s=current.stage;page(a.title,`${metadata()}<p class="simple-step-label">Paso ${s+1} de 3 · ${['Leer','Comprender','Opinar'][s]}</p>${s===0?`<p class="simple-note">${t?'Adaptación de Klevy · '+current.level:'Fragmento original del resumen RSS · guía '+current.level+'. El texto no está simplificado automáticamente.'}</p><div class="news-reading">${reading(t?.text||a.excerpt)}</div>${t?`<details class="simple-details"><summary>Leer el fragmento original del RSS</summary>${reading(a.excerpt)}</details>`:''}<details class="simple-details"><summary>Una guía para leer</summary><p>${current.level==='B1'?'Buscá quién participa, qué pasó y un dato concreto. Tocá las palabras que necesites y guardá una expresión útil.':'Identificá el hecho principal y separá lo observado de lo previsto. ¿Qué afirma realmente el texto y qué información falta?'}</p></details><button id="news-understand" class="primary simple-main">Comprobar lo que entendí →</button>`:s===1?`<details class="simple-details"><summary>Volver a leer</summary>${reading(t?.text||a.excerpt)}</details>${t?`<p lang="en">${E(t.question[0])}</p><div class="options">${t.question[1].map((o,i)=>`<button data-news-choice="${i}" ${current.answer!==undefined?'disabled':''}><span lang="en">${E(o)}</span></button>`).join('')}</div><div id="news-feedback" role="status"></div>`:`<p>${current.level==='B1'?'En una o dos frases en inglés, explicá qué pasó y mencioná un dato del resumen.':'Resumí el hecho principal en inglés y señalá algo que este fragmento no permite concluir.'}</p><label for="news-comprehension">Mi resumen</label><textarea id="news-comprehension" rows="4" maxlength="1500">${E(current.comprehension)}</textarea><button id="news-review">Comparar con una guía</button><div id="news-feedback" role="status"></div>`}`:`<p lang="en">${E(t?.oral||(current.level==='B1'?'Explain the news in your own words. Mention one fact and give your opinion with a reason.':'Summarise the development, distinguish one reported fact from your interpretation, and ask a question this short text does not answer.'))}</p><p class="simple-note">Respondé durante 45–90 segundos, o escribí unas frases si preferís.</p><div class="news-record-actions"><button id="prod-record">● Grabarme</button><button id="prod-stop-record" disabled>Terminar grabación</button><span id="prod-timer" class="simple-note"></span></div><p id="productive-status" class="simple-note" role="status"></p><audio id="prod-recording" controls hidden></audio><button id="prod-discard" hidden>Descartar audio</button><label for="news-opinion">Mi opinión o una frase para mejorar</label><textarea id="news-opinion" rows="3" maxlength="2500">${E(current.opinion)}</textarea><details class="simple-details"><summary>${t?'Una respuesta posible':'Frases para organizar mi respuesta'}</summary><p lang="en">${E(t?.model||(current.level==='B1'?'The news is about… One detail is… I think this is interesting because…':'The report describes… The evidence mentioned is… In my view… One question that remains is…'))}</p><p class="simple-note">Ejemplo o guía de Klevy; no es una cita de la noticia.</p></details>${['Incluí un dato del texto sin cambiar su significado.','Di mi opinión con una razón.','Separé lo que dice la fuente de lo que yo pienso.'].map((c,i)=>`<label class="news-check"><input type="checkbox" data-news-check="${i}" ${current.checks[i]?'checked':''}> ${c}</label>`).join('')}<button id="news-finish" class="primary simple-main">Registrar mi práctica →</button><p class="simple-note">Autoevaluación: no hay una nota automática de escritura o pronunciación. La grabación es temporal y se borra al salir.</p>`}${source()}`);
if(s===0)document.querySelector('#news-understand').onclick=()=>{current.stage=1;saveNews();render()};
if(s===1){if(t){const feedback=()=>{if(current.answer===undefined)return;document.querySelector('#news-feedback').innerHTML=`<div class="feedback"><strong>${current.answer===t.question[2]?'¡Bien!':'Revisemos la idea.'}</strong><p>${E(t.question[3])}</p></div><button id="news-opine" class="primary simple-main">Ahora, mi opinión →</button>`;document.querySelector('#news-opine').onclick=()=>{current.stage=2;saveNews();render()}};root.querySelectorAll('[data-news-choice]').forEach(b=>b.onclick=()=>{if(current.answer!==undefined)return;current.answer=+b.dataset.newsChoice;saveNews();root.querySelectorAll('[data-news-choice]').forEach(b=>b.disabled=true);feedback()});feedback()}else{document.querySelector('#news-comprehension').oninput=e=>{current.comprehension=e.target.value;saveNews()};document.querySelector('#news-review').onclick=()=>{if(!current.comprehension.trim()){document.querySelector('#news-feedback').textContent='Escribí un resumen antes de revisar.';return}current.selfReviewed=true;saveNews();document.querySelector('#news-feedback').innerHTML='<div class="feedback"><p>Comprobá si tu resumen identifica quién participa y qué cambió o se anunció. Buscá un detalle que esté escrito en el fragmento; si añadiste una explicación propia, señalala como tu interpretación.</p><p class="simple-note">Esta guía no comprueba automáticamente tu respuesta.</p></div><button id="news-opine" class="primary simple-main">Ahora, mi opinión →</button>';document.querySelector('#news-opine').onclick=()=>{current.stage=2;saveNews();render()}}}}
if(s===2){const k=current.level+':'+current.id;window.klevyProductive.prepareRecorder('news:'+k);document.querySelector('#prod-record').onclick=()=>window.klevyProductive.startRecording('news:'+k);document.querySelector('#prod-stop-record').onclick=()=>window.klevyProductive.stopRecording();document.querySelector('#prod-discard').onclick=()=>{media();document.querySelector('#prod-recording').hidden=true;document.querySelector('#prod-discard').hidden=true;window.klevyProductive.prepareRecorder('news:'+k)};document.querySelector('#news-opinion').oninput=e=>{current.opinion=e.target.value;saveNews()};root.querySelectorAll('[data-news-check]').forEach(b=>b.onchange=()=>{current.checks=[...root.querySelectorAll('[data-news-check]')].map(b=>b.checked);saveNews()});document.querySelector('#news-finish').onclick=finish}}
function finish(){if(document.querySelector('#prod-record').disabled&&document.querySelector('#prod-stop-record').disabled){document.querySelector('#productive-status').textContent='Resolvé el permiso del micrófono antes de continuar, o salí desde el menú.';return}media();const k=current.level+':'+current.id,t=adaptation();state.news.records[k]={...current,completedAt:Date.now(),correct:t?current.answer===t.question[2]:null};delete state.news.drafts[k];saveNews();page('Una noticia, una idea propia','<p>Registraste tu lectura y tu práctica personal. Podés volver al original para profundizar o seguir con tu plan de hoy.</p><button id="news-done" class="primary simple-main">Volver a Hoy →</button>');document.querySelector('#news-done').onclick=()=>window.klevySimple.today()}
window.addEventListener('klevy:save-expression',e=>{const id=e.detail.materialId;if(!id?.startsWith('news:'))return;const a=Object.values(state.news.selections).map(p=>p.article).find(a=>a.id===id.slice(5));const n=state.notebook[window.klevyLexicon.normalize(e.detail.term)];if(a&&n){n.source={source:a.publisher+' · '+a.title,url:a.url};saveNews()}});
const observer=new MutationObserver(attach);observer.observe(root,{childList:true});const originalLevel=level.onchange;level.onchange=e=>{const active=!!current;originalLevel?.(e);if(active)open()};
const style=document.createElement('style');style.textContent=`.news p{line-height:1.85}.news h2{font-size:25px}.news-reading{border-left:3px solid #8ca174;padding-left:16px;margin:22px 0}.news textarea{display:block;width:100%;font:inherit;padding:12px;border:1px solid #c9d4c6;border-radius:10px;margin:10px 0 16px}.news-check{display:block;padding:10px 0;line-height:1.75}.news-check input{margin-right:8px}.news audio{width:100%;margin:14px 0}.news-record-actions{display:flex;gap:10px;flex-wrap:wrap}.news-stale{padding:12px;border-radius:10px;background:#fff3df;font-size:13px}.news-headline{font-weight:600}#news-daily .news-headline{margin-top:18px}.news .options button{width:100%}@media(max-width:560px){.news h2{font-size:23px}.news-record-actions button{flex:1}}`;document.head.append(style);ensure();window.klevyNews={attach,open,cancel,load,day,valid,get current(){return current}};attach();
})();
