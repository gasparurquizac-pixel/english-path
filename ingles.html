<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Path · B1/B2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5ee;color:#203d34;font:16px system-ui}
main{max-width:850px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{font-size:28px;margin:0}
h2{line-height:1.4}
p{line-height:1.7}
small{color:#63766a}
button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #c9d4c6;cursor:pointer}
button{background:white;color:#203d34}
button:hover{border-color:#286348}
button:focus-visible,select:focus-visible{outline:3px solid #c88740}
.primary{background:#286348;color:white;border:0}
.panel{background:white;padding:25px;border:1px solid #dce3d5;border-radius:18px;margin:22px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{text-align:left;padding:22px}
.card b{display:block;margin-bottom:8px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.stats span{background:#e4ebd9;padding:12px;border-radius:10px}
.options{display:grid;gap:12px;margin:24px 0}
.options button{text-align:left}
.correct{background:#dcefd9;border-color:#569a58}
.wrong{background:#f9e0d8;border-color:#c77b61}
.feedback{background:#eef2e5;padding:18px;border-radius:12px;margin:20px 0;line-height:1.7}
.reading{border-left:4px solid #92a67a;padding:16px;background:#f4f6ef}
nav{display:flex;gap:10px;margin:22px 0}
nav button{flex:1}
.progress{height:8px;background:#e4ebd9;border-radius:6px;overflow:hidden}
.progress div{background:#286348;height:100%}
footer{font-size:12px;color:#63766a;margin-top:30px}
@media(max-width:500px){main{padding:16px}.grid{grid-template-columns:1fr}.panel{padding:18px}h1{font-size:23px}}
</style>
</head>
<body>
<main>
<header>
<div><h1>English Path ✳</h1><small>Un poco cada día.</small></div>
<label>Nivel
<select id="level"><option>B1</option><option>B2</option></select>
</label>
</header>
<nav>
<button id="home">Practicar</button>
<button id="progress">Mi progreso</button>
</nav>
<div id="app"></div>
<footer>
El progreso se guarda en este navegador si permite almacenamiento local.
La voz depende de las voces disponibles en tu navegador.
Estas prácticas no certifican tu nivel.
</footer>
</main>
<script>
const data={
B1:{

["will stay","would stay","stayed"],0,

["This book ___ by a young author.",
["wrote","was written","has writing"],1,
"Pasiva en pasado: was/were + participio. El libro fue escrito: was written."]
],
"Vocabulario":[
["Could you ___ my cat this weekend?",
["look up","look after","look for"],1,
"Look after significa cuidar. Look up es consultar información; look for significa buscar."],
["I am very ___ in photography.",
["interested","interesting","interest"],0,
"Interested describe cómo te sientes. Interesting describe algo que provoca interés."],
["We need to ___ a decision.",
["do","make","give"],1,
"La combinación habitual es make a decision: tomar una decisión."]
],

["Gloves and bags","Water","Tickets"],1,
"El aviso pide llevar agua. La organización proporciona los guantes y las bolsas.",

],

"Half past six significa las seis y media. La película empieza a las siete.",
"Hi Sam! The film starts at seven, but let us meet outside the cinema at half past six. We can buy tickets together."],

"Pide un café negro y un sándwich de queso.",
"Could I have a black coffee and a cheese sandwich, please? I do not need any sugar."],

["Bad weather","A technical problem","A late driver"],1,
"Due to a technical problem significa debido a un problema técnico.",
"The train to Oxford is delayed by twenty minutes due to a technical problem. We apologise for the inconvenience."]
]
},

"Tercer condicional: if + past perfect, would have + participio. Imagina un pasado diferente."],
["By this time next year, she ___ her degree.",
["will have finished","will finish","has finished"],0,
"El futuro perfecto expresa algo que estará terminado antes de un momento futuro: will have finished."],

["I had sat","did I sit","had I sat"],2,
"Cuando hardly inicia esta estructura, se invierten sujeto y auxiliar: Hardly had I sat down when…"]

};

const app=document.querySelector("#app");
const level=document.querySelector("#level");
let state={answers:0,correct:0,completed:[],level:"B1"};
try{
 const saved=JSON.parse(localStorage.getItem("english-path-offline"));
 if(saved)state={...state,...saved};
}catch{}
if(!data[state.level])state.level="B1";
level.value=state.level;
let session=null;

function save(){
 try{localStorage.setItem("english-path-offline",JSON.stringify(state))}catch{}
}
function stopVoice(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
}
function speak(text){
 if(!("speechSynthesis" in window)){
  alert("La voz no está disponible. Usá la transcripción.");
  return;
 }
 stopVoice();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="en-GB";
 utterance.rate=.85;
 speechSynthesis.speak(utterance);
}
function home(){
 stopVoice();
 session=null;
 app.innerHTML=`
 <section class="panel">
 <small>TU PRÓXIMO PASO · ${state.level}</small>
 <h2>Small steps. Real progress.</h2>
 <p>Elegí una habilidad. Cada sesión tiene tres ejercicios
 con correcciones explicadas en español.</p>
 <div class="grid">
 ${Object.keys(data[state.level]).map((name,i)=>`
 <button class="card" data-type="${name}">
 <b>${["Aa","✳","▤","♫"][i]} ${name}</b>
 <small>${state.completed.includes(state.level+":"+name)?
 "✓ Completada · Volver a practicar":"3 ejercicios · Comenzar →"}</small>
 </button>`).join("")}
 </div>
 </section>`;
 app.querySelectorAll("[data-type]").forEach(button=>{
  button.onclick=()=>{
   session={level:state.level,type:button.dataset.type,index:0,score:0,answered:false};
   question();
  };
 });
}
function question(){
 stopVoice();
 const s=session;
 s.answered=false;
 const q=data[s.level][s.type][s.index];
 app.innerHTML=`
 <section class="panel">
 <small>${s.level} · ${s.type} · ${s.index+1} DE 3</small>
 <div class="progress" style="margin-top:15px">
 <div style="width:${s.index/3*100}%"></div>
 </div>
 ${s.type==="Lectura"?`<p class="reading" lang="en">${q[4]}</p>`:""}
 ${s.type==="Escucha"?`
 <p>Escuchá el audio y elegí la respuesta.</p>
 <button id="listen" class="primary">♫ Reproducir audio</button>
 <details style="margin-top:18px">
 <summary>Ver transcripción</summary>
 <p lang="en">${q[4]}</p>
 </details>`:""}
 <h2 lang="en">${q[0]}</h2>
 <div class="options">
 ${q[1].map((answer,i)=>`
 <button data-answer="${i}" lang="en">
 ${String.fromCharCode(65+i)}. ${answer}
 </button>`).join("")}
 </div>
 <div id="feedback" aria-live="polite"></div>
 <button id="back">Salir de la sesión</button>
 </section>`;
 if(document.querySelector("#listen")){
  document.querySelector("#listen").onclick=()=>speak(q[4]);
 }
 document.querySelector("#back").onclick=home;
 app.querySelectorAll("[data-answer]").forEach(button=>{
  button.onclick=()=>answer(Number(button.dataset.answer));
 });
}
function answer(index){
 const s=session;
 if(s.answered)return;
 s.answered=true;
 const q=data[s.level][s.type][s.index];
 const correct=index===q[2];
 state.answers++;
 if(correct){state.correct++;s.score++}
 save();
 app.querySelectorAll("[data-answer]").forEach(button=>{
  const n=Number(button.dataset.answer);
  button.disabled=true;
  if(n===q[2])button.classList.add("correct");
  else if(n===index)button.classList.add("wrong");
 });
 document.querySelector("#feedback").innerHTML=`
 <div class="feedback">
 <b>${correct?"¡Muy bien!":"Una oportunidad para aprender."}</b>
 <br>${q[3]}
 </div>
 <button class="primary" id="next">
 ${s.index<2?"Siguiente ejercicio →":"Ver resultado →"}
 </button><br><br>`;
 document.querySelector("#next").onclick=()=>{
  if(s.index<2){s.index++;question()}
  else finish();
 };
}
function finish(){
 stopVoice();
 const key=session.level+":"+session.type;
 if(!state.completed.includes(key))state.completed.push(key);
 save();
 app.innerHTML=`
 <section class="panel">
 <small>SESIÓN COMPLETADA</small>
 <h2>${session.score===3?"Great work!":"Keep going!"}</h2>
 <p>Acertaste <b>${session.score} de 3</b> ejercicios.</p>
 <div class="feedback">
 ${session.score===3?
 "Probá otra habilidad para seguir avanzando.":
 "Podés repetir la sesión para afianzar las explicaciones. Equivocarse también es aprender."}
 </div>
 <button class="primary" id="continue">Continuar →</button>
 </section>`;
 document.querySelector("#continue").onclick=home;
}
function progress(){
 stopVoice();
 session=null;
 app.innerHTML=`
 <section class="panel">
 <h2>Cada paso cuenta.</h2>
 <div class="stats">
 <span>${state.answers} respuestas</span>
 <span>${state.answers?Math.round(state.correct/state.answers*100):0}% correctas</span>
 <span>${state.completed.length} de 8 sesiones</span>
 </div>
 ${["B1","B2"].map(l=>{
 const n=state.completed.filter(x=>x.startsWith(l+":")).length;
 return `<h3>Ruta ${l} · ${n}/4</h3>
 <div class="progress"><div style="width:${n*25}%"></div></div>`;
 }).join("")}
 <p>Las estadísticas incluyen los intentos repetidos.
 Una sesión completada significa que respondiste sus tres ejercicios.</p>
 <button id="reset">Borrar mi progreso</button>
 </section>`;
 document.querySelector("#reset").onclick=()=>{
  if(confirm("¿Borrar todo el progreso guardado?")){
   state={answers:0,correct:0,completed:[],level:level.value};
   save();progress();
  }
 };
}
level.onchange=()=>{
 state.level=level.value;
 save();home();
};
document.querySelector("#home").onclick=home;
document.querySelector("#progress").onclick=progress;
window.addEventListener("pagehide",stopVoice);
home();
</script>
</body>
</html>

answer=function(i){
 const s=session;
 if(s.answered)return;
 s.answered=true;

 const id=s.ids[s.index];
 const q=data[s.level][s.type][id];
 const ok=i===q[2];

 state.answers++;
 if(ok){
  state.correct++;
  s.score++;
 }

 state.practice[key(s.level,s.type,id)]={correct:ok};
 save();

 app.querySelectorAll("[data-answer]").forEach(button=>{
  button.disabled=true;
  const n=Number(button.dataset.answer);

  if(n===q[2])button.classList.add("correct");
  else if(n===i)button.classList.add("wrong");
 });

 document.querySelector("#feedback").innerHTML=`
 <div class="feedback">
 <b>${ok?"¡Muy bien!":"Una oportunidad para aprender."}</b>
 <br>${q[3]}
 </div>
 <button class="primary" id="next">
 ${s.index<s.ids.length-1?
 "Siguiente ejercicio →":"Ver resultado →"}
 </button><br><br>`;

 document.querySelector("#next").onclick=()=>{
  if(s.index<s.ids.length-1){
   s.index++;
   question();
  }else{
   finish();
  }
 };
};

const make=(text,correct,wrong1,wrong2,why,passage)=>{
 const choices=[correct,wrong1,wrong2];
 const position=[...text].reduce(
  (n,c)=>n+c.charCodeAt(0),0
 )%3;

 for(let n=0;n<position;n++){
  choices.unshift(choices.pop());
 }

 return [
  text,choices,position,why,
  ...(passage?[passage]:[])
 ];
};

for(const level of ["B1","B2"]){
 for(const type of ["Lectura","Escucha"]){
  const offset=type==="Escucha"?2:0;

  const questions=passages[level].flatMap(builder=>
   contexts.map((_,j)=>{
    const original=contexts[(j+offset)%contexts.length];

    const context=type==="Escucha"?{
     ...original,
     n:["Noah","Isla","Leo","Grace","Jack"][j],
     city:["Reading","Norwich","Lincoln","Lancaster","Winchester"][j],
     day:["Saturday","Sunday","Friday","Tuesday","Monday"][j],
     time:["8:15","9:45","12:00","14:15","15:00"][j],
     later:["10:30","12:00","14:30","16:00","17:30"][j]
    }:original;

    const row=builder(context);

    const prefix=type==="Escucha"?
     `You hear the following message about ${context.city}. `:"";

    return make(
     `${row[0]} [${context.city} · ${type}]`,
     row[1],row[2],row[3],row[5],
     prefix+row[4]
    );
   })
  );

  add(level,type,questions);
 }
}

const previousHome=home;

   "y situaciones. Algunas practican el mismo patrón con otros "+
   "datos. Las sesiones priorizan lo que todavía no hiciste.";
 }
};

document.querySelector("#home").onclick=home;

level.onchange=()=>{

 home();
