<script>
(()=>{
const gap=(id,topic,title,context,prompt,accepted,model,why)=>({id,type:'gap',topic,title,context,prompt,accepted,model,why});
const fix=(id,topic,title,context,prompt,accepted,model,why)=>({id,type:'correction',topic,title,context,prompt,accepted,model,why});
const listen=(id,topic,title,audio,prompt,accepted,model,why)=>({id,type:'listening',topic,title,audio,prompt,accepted,model,why});
window.klevyVariedTasks={B1:[
gap('b1-keys','Pasado simple y perfecto','Un objeto que sigue perdido','You cannot open the door because you do not have your keys now.','I ___ my keys. (lose: usá present perfect)',["have lost","'ve lost"],'I have lost my keys.','Have lost conecta un hecho pasado con su consecuencia presente. No se menciona un momento pasado terminado.'),
gap('b1-missed-call','Pasado simple y perfecto','Devolver una llamada','Your colleague asks about a call yesterday.','I ___ your call because I was on the train yesterday. (miss)', ['missed'],'I missed your call because I was on the train yesterday.','Yesterday sitúa la llamada en un tiempo terminado: pasado simple.'),
gap('b1-cancel-plan','Infinitivo y gerundio','Cambiar de plan','The weather is getting worse, so your group changes its plan.','We decided ___ at home instead. (stay: incluí to si corresponde)',['to stay'],'We decided to stay at home instead.','Decide va seguido de to + verbo. La decisión se expresa dentro de una situación concreta.'),
fix('b1-advice','Consejos y obligación','Un consejo para un amigo','A friend has an early flight. Correct only the verb phrase; keep the rest of the sentence.','You should to leave early.', ['You should leave early'],'You should leave early.','Después de should usamos el verbo base sin to. Es un consejo, no una orden.'),
fix('b1-quantity','Cantidad','Una compra para la cena','You are describing the rice you bought. Correct the quantifier and keep the rest.','We bought too many rice.', ['We bought too much rice'],'We bought too much rice.','Rice es incontable en este uso. Usamos too much para una cantidad excesiva.'),
fix('b1-question','Estilo indirecto','Pedir una indicación con cortesía','Correct the word order after where; keep the rest.','Could you tell me where is the library?', ['Could you tell me where the library is'],'Could you tell me where the library is?','Dentro de la pregunta indirecta se usa orden afirmativo: the library is.'),
listen('b1-platform','Escucha · Transporte','Un cambio en la estación','Attention, passengers. The train to York will now leave from platform six, not platform four. The departure time is unchanged.','Escribí en inglés solo el número del andén nuevo.',['six','6'],'six','La corrección not platform four indica que four era el andén anterior; el nuevo es six.'),
listen('b1-return','Escucha · Compras','Devolver un producto','You can return the shoes within fourteen days. Please bring the receipt. You do not need the original box.','¿Qué documento tenés que llevar? Escribí una palabra en inglés.',['receipt','the receipt','a receipt'],'receipt','Pide el comprobante de compra, receipt. La caja original no hace falta.'),
listen('b1-meeting','Escucha · Trabajo','Qué llevar a una reunión','The meeting is at ten tomorrow. Bring your laptop, please. We have printed the reports already, so you can leave those at home.','¿Qué objeto te piden llevar? Escribí una palabra en inglés.',['laptop','a laptop','your laptop','my laptop','the laptop'],'laptop','Pide llevar la computadora; los informes ya están impresos.')
],B2:[
gap('b2-condition','Condicionales avanzados','Apoyo con una condición','The team can support a pilot only if extra support is available.','We can support the pilot provided ___ extra support is available. (una palabra)',['that'],'We can support the pilot provided that extra support is available.','Provided that introduce una condición. También existe provided sin that; aquí se pide completar la construcción con una palabra.'),
gap('b2-regret','Condicionales avanzados','Revisar una decisión pasada','You did not check the timetable and therefore missed the last train.','If I had checked the timetable, I ___ the last train. (not miss: completá la frase verbal)',["would not have missed","wouldn't have missed","would not've missed"],'If I had checked the timetable, I would not have missed the last train.','Para imaginar un resultado distinto de un hecho pasado usamos would have + participio, con negación en este caso.'),
gap('b2-gerund','Gerundio e infinitivo','Un seguimiento profesional','A colleague has offered to send you the revised proposal.','I look forward to ___ your revised proposal. (receive)', ['receiving'],'I look forward to receiving your revised proposal.','En look forward to, to es una preposición. Después usamos gerundio, receiving.'),
fix('b2-despite','Concesión','Reconocer una dificultad','Keep despite and the full clause; add the words needed to connect them.','Despite the deadline was tight, we finished on time.', ['Despite the fact that the deadline was tight, we finished on time'],'Despite the fact that the deadline was tight, we finished on time.','Despite puede ir seguido de un sustantivo o de the fact that + oración. No va directamente delante de una oración conjugada.'),
fix('b2-inversion','Inversión','Destacar una limitación','Correct the structure after Only then, keeping the same meaning.','Only then we understood the risk.', ['Only then did we understand the risk'],'Only then did we understand the risk.','Con only then al comienzo invertimos auxiliar y sujeto: did we understand. Después de did, el verbo vuelve a la forma base.'),
fix('b2-report','Estilo indirecto avanzado','Transmitir una pregunta','Correct the word order inside the reported question.','She asked why had the delivery been delayed.', ['She asked why the delivery had been delayed'],'She asked why the delivery had been delayed.','Una pregunta referida mantiene el orden de una afirmación: the delivery had been delayed.'),
listen('b2-priority','Escucha · Negociar prioridades','Qué se deja para después','We should keep the security checks in the first release. The colour themes can wait until the second release. That way, we protect users without missing the deadline.','¿Qué se posterga? Respondé en inglés con la frase de dos palabras que empieza con colour.',['colour themes','color themes'],'colour themes','Se mantienen las comprobaciones de seguridad y se posponen los temas de color.'),
listen('b2-cause','Escucha · Evaluar evidencia','Una explicación alternativa','The volunteers improved their scores, but they also received extra tutoring. We cannot be sure the new app caused the improvement. The tutoring may account for part of the difference.','¿Qué apoyo adicional podría explicar la mejora? Escribí la expresión de dos palabras que empieza con extra.',['extra tutoring'],'extra tutoring','La tutoría adicional es una explicación alternativa; el audio no atribuye toda la mejora a la app.'),
listen('b2-contract','Escucha · Comparar proveedores','Lo que el presupuesto excluye','The quote covers installation and training. Ongoing maintenance is charged separately. Before we choose a supplier, we need the total cost over three years.','¿Qué concepto se cobra aparte? Escribí una palabra en inglés.',['maintenance','ongoing maintenance'],'maintenance','El mantenimiento se cobra por separado. La instalación y la formación sí están incluidas.')
]};
})();

</script>
<script>
(()=>{
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s).toLowerCase().normalize('NFKC').replace(/[’‘]/g,"'").replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim();
const labels={gap:'Completar sin opciones',correction:'Corregir una frase',listening:'Escuchar y recuperar un dato',writing:'Escribir una respuesta propia',speaking:'Responder en voz alta'};
let current=null;
function ensure(){state.variety={seen:[],records:{},...state.variety};state.variety.records=state.variety.records||{}}
function persist(){try{localStorage.setItem('english-path-offline',JSON.stringify(state));return true}catch{return false}}
function tasks(l=state.level){return [...window.klevyVariedTasks[l],...window.klevyPracticeTasks.writing[l].map(t=>({...t,id:'write:'+t.id,type:'writing',topic:'Comunicación escrita'})),...window.klevyPracticeTasks.speaking[l].map(t=>({...t,id:'speak:'+t.id,type:'speaking',topic:'Comunicación oral'}))]}
function record(t,l=state.level){ensure();return state.variety.records[l+':'+t.id]}
function focusTopics(l=state.level){const groups=new Map();for(const type of ['Gramática','Vocabulario','Lectura','Escucha'])data[l][type].forEach((q,index)=>{if(state.practice[`${l}:${type}:${index}`]?.correct!==false)return;const name=q[5]?.topic||'Repaso general',k=type+':'+name;let g=groups.get(k);if(!g){g={type,topic:name,rows:[]};groups.set(k,g)}const row={type,index,q};if(!g.rows.some(x=>window.klevyVariety.alike(x,row)))g.rows.push(row)});for(const t of tasks(l)){if(!['gap','correction','listening'].includes(t.type)||record(t,l)?.correct!==false)continue;let g=[...groups.values()].find(g=>g.topic===t.topic);if(!g){g={type:t.type==='listening'?'Escucha':'Gramática',topic:t.topic,rows:[]};groups.set('varied:'+t.topic,g)}g.variedErrors=(g.variedErrors||0)+1}return [...groups.values()].map(g=>({...g,count:g.rows.length+(g.variedErrors||0)})).sort((a,b)=>b.count-a.count).slice(0,3)}
function cleanup(){window.klevyProductive.cleanup();window.klevyWordHelp?.close();document.querySelectorAll('#app audio').forEach(a=>a.pause());stopVoice()}
function nav(){document.querySelectorAll('nav button').forEach(b=>b.removeAttribute('aria-current'));document.querySelector('#home').setAttribute('aria-current','page')}
function panel(title,body){app.innerHTML=`<section class="panel varied"><p class="study-kicker">PRÁCTICA VARIADA · ${E(current?.level||state.level)}</p><h2>${E(title)}</h2>${body}</section>`}
function start(){ensure();cleanup();session=null;nav();const l=state.level,pool=tasks(l),focus=focusTopics(l).map(g=>g.topic);const selected=[],chosenTopics=new Set();for(const type of ['gap','correction','listening','writing','speaking']){const list=pool.filter(t=>t.type===type);list.sort((a,b)=>{const x=record(a,l),y=record(b,l);const rank=t=>record(t,l)?.lastAt?1:0;return rank(a)-rank(b)||(x?.lastAt||0)-(y?.lastAt||0)||Number(chosenTopics.has(a.topic))-Number(chosenTopics.has(b.topic))||Number(!focus.includes(a.topic))-Number(!focus.includes(b.topic))});const chosen=list[0];selected.push(chosen.id);chosenTopics.add(chosen.topic)}current={level:l,ids:selected,index:0,results:[],drafts:{}};render()}
function render(){cleanup();const s=current,t=tasks(s.level).find(t=>t.id===s.ids[s.index]);if(!t)return finish();s.answered=false;s.revealed=false;const own=['writing','speaking'].includes(t.type);panel(t.title,`<p class="varied-step">${s.index+1} de ${s.ids.length} · ${labels[t.type]}</p><div class="progress"><div style="width:${s.index/s.ids.length*100}%"></div></div><p class="ep-badge">${E(t.topic)}</p><p class="varied-instruction">${E(({gap:"Completá el espacio con la forma indicada.",correction:"Corregí la frase siguiendo la indicación.",listening:"Escuchá el mensaje y respondé la pregunta.",writing:"Escribí una respuesta propia para esta situación.",speaking:"Respondé en voz alta a esta situación."})[t.type])}</p>${t.context?`<p class="varied-context">${E(t.context)}</p>`:''}${t.type==='listening'?`<p>Escuchá el mensaje y recuperá el dato. El audio de práctica usa voz sintética.</p><button id="varied-listen">♫ Escuchar mensaje</button><button id="varied-stop">Detener audio</button><details id="varied-transcript"><summary>Ver transcripción (ayuda)</summary><p lang="en">${E(t.audio)}</p></details><p>${E(t.prompt)}</p>`:t.type==='gap'||t.type==='correction'?`<p class="varied-prompt" lang="en">${E(t.prompt)}</p>`:t.type==='writing'?`<p>${E(t.goal)}</p><p class="varied-prompt" lang="en">${E(t.prompt)}</p><ul>${t.points.map(x=>`<li>${E(x)}</li>`).join('')}</ul><p class="ep-muted">Para esta práctica breve, escribí 3–5 frases. Es una autoevaluación; podés desarrollar el texto completo desde “Hablar y escribir”.</p>`:`<p>${E(t.goal)}</p><ul>${t.brief.map(x=>`<li>${E(x)}</li>`).join('')}</ul><p class="varied-prompt" lang="en">${E(t.question)}</p><details><summary>Una pregunta de seguimiento</summary><p lang="en">${E(t.followUp)}</p></details><p>Respondé durante unos ${t.seconds} segundos. Podés grabarte o practicar sin micrófono.</p><div class="varied-actions"><button id="prod-record">● Grabarme</button><button id="prod-stop-record" disabled>Terminar grabación</button><span id="prod-timer"></span></div><p id="productive-status" role="status"></p><audio id="prod-recording" controls hidden></audio><button id="prod-discard" hidden>Descartar audio</button><p class="ep-muted">Audio temporal: queda en este dispositivo y se borra al salir. La app no evalúa tu pronunciación.</p>`}${t.type!=='speaking'?`<form id="varied-form"><label for="varied-input">${t.type==='writing'?'Mi respuesta en inglés':t.type==='correction'?'Escribí la oración corregida':'Tu respuesta'}</label><textarea id="varied-input" rows="${t.type==='writing'?5:2}" maxlength="4000" spellcheck="false" autocapitalize="off">${E(s.drafts[t.id]||record(t,s.level)?.draft||'')}</textarea><button class="primary" id="varied-check" type="submit">${own?'Comparar y revisar':'Comprobar respuesta'}</button></form>`:'<button class="primary" id="varied-self">Ya respondí: comparar y revisar</button>'}<div id="varied-feedback" aria-live="polite"></div><p id="varied-storage" role="status"></p><button id="varied-leave">← Volver a Practicar</button>`);
if(t.type==='listening'){document.querySelector('#varied-listen').onclick=()=>speak(t.audio);document.querySelector('#varied-stop').onclick=stopVoice;document.querySelector('#varied-transcript').ontoggle=e=>{if(e.target.open)s.usedHelp=true}}

function saveResult(t,correct,self=false){const s=current,k=s.level+':'+t.id,old=state.variety.records[k]||{};state.variety.records[k]={...old,correct:self?undefined:correct,selfReviewed:self||!!old.selfReviewed,attempts:(old.attempts||0)+1,lastAt:Date.now(),usedHelp:!!s.usedHelp};s.results.push({id:t.id,type:t.type,correct:self?null:correct,usedHelp:!!s.usedHelp});if(!persist())document.querySelector('#varied-storage').textContent='No se pudo guardar el resultado en este navegador.';s.answered=true}
function nextButton(){const b=document.createElement('button');b.id='varied-next';b.className='primary';b.textContent=current.index<current.ids.length-1?'Otra forma de practicar →':'Ver mi resumen →';document.querySelector('#varied-feedback').appendChild(b);b.onclick=()=>{current.index++;if(current.index<current.ids.length)render();else finish()}}

function review(t){if(current.revealed)return;current.revealed=true;stopVoice();if(document.querySelector('#prod-stop-record')?.disabled===false)window.klevyProductive.stopRecording();const criteria=t.type==='writing'?t.points:t.review;document.querySelector('#varied-feedback').innerHTML=`<h3>Compará y elegí una mejora</h3><details><summary>Ver una respuesta posible</summary><p lang="en">${E(t.model)}</p></details><p>No hace falta coincidir con el modelo. Revisá si comunicaste lo que pide la situación.</p>${criteria.map((c,i)=>`<label class="varied-review"><input type="checkbox" data-varied-review="${i}"> ${E(c)}</label>`).join('')}<label for="varied-improvement">Una mejora para mi próxima respuesta</label><textarea id="varied-improvement" rows="2" maxlength="600">${E(record(t,current.level)?.improvement||'')}</textarea><button id="varied-register" class="primary">Registrar mi autoevaluación</button>`;document.querySelector('#varied-register').onclick=()=>{if(current.answered)return;const k=current.level+':'+t.id;state.variety.records[k]={...state.variety.records[k],checks:[...app.querySelectorAll('[data-varied-review]')].map(c=>c.checked),improvement:document.querySelector('#varied-improvement').value};saveResult(t,true,true);document.querySelector('#varied-register').disabled=true;nextButton()}}
function finish(){cleanup();const s=current,scored=s.results.filter(r=>r.correct!==null),ok=scored.filter(r=>r.correct).length;panel('Un tema se aprende de varias maneras',`<p>Completaste ${s.results.length} actividades con ${new Set(s.results.map(r=>r.type)).size} formatos.</p><p>${ok} de ${scored.length} respuestas coincidieron con las variantes previstas. Las respuestas propias se registraron como autoevaluación.</p><p>La siguiente sesión prioriza actividades que todavía no completaste. Cuando se agotan, retoma las menos recientes.</p><button id="varied-again" class="primary">Otra sesión variada</button><button id="varied-home">Volver a Practicar</button>`);document.querySelector('#varied-again').onclick=start;document.querySelector('#varied-home').onclick=()=>{current=null;home()}}

const oldProgress=progress;progress=function(){oldProgress();const n=document.createElement('section');n.className='panel varied';n.innerHTML=focusHTML();app.append(n);bindFocus()};const progressClick=document.querySelector('#progress').onclick;document.querySelector('#progress').onclick=e=>{progressClick?.(e);if(!app.querySelector('[data-varied-focus]')&&!app.querySelector('.varied')){const n=document.createElement('section');n.className='panel varied';n.innerHTML=focusHTML();app.append(n);bindFocus()}};

<script>
(()=>{

const root=document.querySelector('#app'),legacy=document.querySelector('nav');legacy.id='legacy-nav';legacy.hidden=true;

const oldDaily=window.klevyDaily.renderDay;

function mark(){root.dataset.simpleGroup=group;for(const b of mainNav.querySelectorAll('button')){const active=b.id==='nav-'+group;if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}document.title='Klevy · '+({today:'Hoy',explore:'Explorar',learning:'Mi aprendizaje'}[group]||'Inglés')}
function goBack(label,action){back.hidden=!label;back.textContent=label?'← '+label:'';back.onclick=()=>{cleanup();action?.();top()}}
function page(name,title,subtitle,body){screen=name;root.innerHTML=`<section class="panel simple-page" data-simple-screen="${name}"><p class="study-kicker">${state.level} · ${group==='learning'?'MI APRENDIZAJE':group==='today'?'HOY':'EXPLORAR'}</p><h2>${E(title)}</h2>${subtitle?`<p class="simple-intro">${E(subtitle)}</p>`:''}${body}</section>`;mark()}
function menuButton(id,title,subtitle){return `<button class="simple-choice" id="${id}"><span><strong>${E(title)}</strong><small>${E(subtitle)}</small></span><span aria-hidden="true">→</span></button>`}
function today(){busy=true;cleanup();group='today';oldDaily();const plan=window.klevyDaily.getPlan(),answered=plan.items.filter(x=>plan.answers[x.type+':'+x.index]).length;
const actions={review:document.querySelector('#daily-start')?.onclick,speaking:document.querySelector('#daily-speaking')?.onclick,writing:document.querySelector('#daily-writing')?.onclick};
const done=Number(answered===plan.items.length)+Number(plan.speakingDone)+Number(plan.writingDone),next=answered<plan.items.length?'review':!plan.speakingDone?'speaking':!plan.writingDone?'writing':'complete';
const messages={review:['Retomá lo aprendido',`${answered?`${answered} de ${plan.items.length} preguntas respondidas. `:''}Una sesión breve de preguntas de tu ruta y repasos pendientes.`,answered?'Continuar repaso':'Empezar repaso'],speaking:['Una respuesta en voz alta','Prepará tus ideas, respondé y escuchate. Elegí una cosa para mejorar.','Empezar práctica oral'],writing:['Dale forma a una idea','Escribí o retomá un borrador. Después revisalo con una guía.','Ir a mi texto'],complete:['Por hoy, objetivo cumplido','Terminaste la propuesta de hoy. Podés descansar o elegir otra actividad.','Explorar actividades']};const [title,text,label]=messages[next];

document.querySelector('#today-start').onclick=()=>{if(next==='complete'){explore();top();return}cleanup();actions[next]?.();screen=next==='review'?'daily-question':next;group='today';decorate();top()};goBack('',null);busy=false;mark()}
function explore(){cleanup();group='explore';parent='explore';page('explore','¿Qué querés practicar?','Elegí una forma de usar tu inglés.',`<div class="simple-menu">${menuButton('explore-context','Situaciones reales','Leer, escuchar y responder en contexto.')}${menuButton('explore-varied','Práctica variada','Completar, corregir, escuchar, escribir y hablar.')}${menuButton('explore-conversation','Conversaciones guiadas','Escuchar, responder y practicar una repregunta.')}</div><details class="simple-details"><summary>Más formas de practicar</summary><div class="simple-menu">${menuButton('explore-route','Ruta de estudio','Entender un tema y llevarlo a la práctica.')}${menuButton('explore-skills','Por habilidad','Gramática, vocabulario, lectura o escucha.')}${menuButton('explore-production','Hablar y escribir','Elegir una actividad de expresión.')}</div></details>`);document.querySelector('#explore-conversation').onclick=()=>open('conversation');document.querySelector('#explore-context').onclick=()=>open('library');document.querySelector('#explore-varied').onclick=()=>open('varied');document.querySelector('#explore-route').onclick=()=>open('course');document.querySelector('#explore-skills').onclick=()=>open('skills');document.querySelector('#explore-production').onclick=()=>open('production');goBack('',null)}

function open(name){cleanup();screen=name;parent=group==='learning'?'learning':'explore';
if(name==='listening'){group='explore';window.klevyListening.hub()}
if(name==='conversation'){group='explore';window.klevyConversations.hub()}
if(name==='library'){group='explore';window.klevyContext.hub()}

if(name==='skills'){group='explore';document.querySelector('#home').click()}
if(name==='production'){group='explore';document.querySelector('#productive-nav').click()}
decorate();top()}
function stats(){cleanup();group='learning';const l=state.level,types=['Gramática','Vocabulario','Lectura','Escucha'];const counts=types.map(t=>({type:t,total:data[l][t].length,seen:data[l][t].filter((_,i)=>state.practice[`${l}:${t}:${i}`]).length}));const seen=counts.reduce((n,x)=>n+x.seen,0),total=counts.reduce((n,x)=>n+x.total,0),units=window.englishStudy.overall(l);const done=t=>Object.entries(state.skills[t]||{}).filter(([k,v])=>k.startsWith(l+':')&&v.done).length;
page('stats','Tu progreso','La práctica se guarda en este navegador.',`<div class="simple-progress"><strong>${seen} de ${total}</strong><span>preguntas practicadas en ${l}</span><div class="progress"><div style="width:${seen/total*100}%"></div></div></div><div class="simple-metrics"><p><strong>${units} de 12</strong><span>unidades recorridas</span></p><p><strong>${done('speaking')}</strong><span>prácticas orales registradas</span></p><p><strong>${done('writing')}</strong><span>textos revisados</span></p></div><details class="simple-details"><summary>Ver por habilidad</summary><p>Escuchas en contexto: ${Object.keys(state.listening?.records||{}).filter(k=>k.startsWith(l+':')).length} actividades completadas.</p>${counts.map(x=>`<p>${x.type}: ${x.seen} de ${x.total}</p>`).join('')}<p class="simple-note">Las conversaciones, actividades variadas y resúmenes en contexto se guardan por separado. Estos números registran práctica; no certifican tu nivel.</p></details><details class="simple-details"><summary>Datos y reinicio</summary><p>El progreso y los borradores no se sincronizan automáticamente entre dispositivos. Una unidad recorrida registra lectura y práctica, no dominio del tema.</p><button id="simple-reset">Borrar todo mi progreso</button><p class="simple-note">Esto incluye respuestas, ruta, borradores, cuaderno, conversaciones, escuchas, noticias y repasos. Conserva tu nivel seleccionado.</p></details>`);goBack('Mi aprendizaje',learning);document.querySelector('#simple-reset').onclick=()=>{if(!confirm('¿Borrar respuestas, ruta, borradores, prácticas, planificación, actividades en contexto, cuaderno, práctica variada, conversaciones, escuchas y noticias de este navegador?'))return;cleanup();state.answers=0;state.correct=0;state.completed=[];state.practice={};state.study={lastUnit:{},read:{},checks:{}};state.skills={speaking:{},writing:{}};state.daily={version:1,plans:{}};state.context={lessons:{}};state.notebook={};state.variety={seen:[],records:{}};state.conversations={records:{},drafts:{}};state.listening={records:{},drafts:{}};state.news={selections:{},drafts:{},records:{}};save();stats()}}
function focus(){cleanup();group='learning';const rows=window.klevyVariedPractice.focusTopics();page('focus','Puntos a reforzar',rows.length?'Elegí un tema para entenderlo y volver a intentarlo.':'Todavía no hay errores pendientes para recomendarte un tema.',`<div class="simple-menu">${rows.map((r,i)=>menuButton('focus-'+i,r.topic,`${r.count} ${r.count===1?'patrón o actividad pendiente':'patrones o actividades pendientes'}`)).join('')}</div><details class="simple-details"><summary>¿Cómo se eligen estos temas?</summary><p>Se agrupan tus errores guardados y se reúnen variantes parecidas. Es una orientación para repasar, no un diagnóstico de nivel.</p></details>${rows.length?'':'<button id="focus-start" class="primary">Explorar actividades →</button>'}`);rows.forEach((r,i)=>document.querySelector('#focus-'+i).onclick=()=>{parent='focus';const unit=window.englishLessons[state.level].find(u=>u.practice[r.type]?.includes(r.topic));if(unit)window.englishStudy.openUnit(unit.id);else window.englishPathApp.choose(r.type,r.topic,'errors');screen=unit?'unit':'choose';schedule();top()});if(document.querySelector('#focus-start'))document.querySelector('#focus-start').onclick=explore;goBack('Mi aprendizaje',learning)}
function fold(nodes,label,container,before=null){nodes=nodes.filter(Boolean);if(!nodes.length)return null;const d=document.createElement('details');d.className='simple-details';const summary=document.createElement('summary');summary.textContent=label;d.append(summary);container.insertBefore(d,before);nodes.forEach(n=>d.append(n));return d}
function until(start,end){const nodes=[];for(let n=start;n&&n!==end;){const next=n.nextElementSibling;nodes.push(n);n=next}return nodes}
function wizard(section,steps,headings){if(section.dataset.simpleWizard)return;section.dataset.simpleWizard='1';const bar=document.createElement('p');bar.className='simple-step-label';bar.setAttribute('aria-live','polite');const controls=document.createElement('div');controls.className='simple-step-controls';controls.innerHTML='<button type="button" class="simple-prev">Paso anterior</button><button type="button" class="primary simple-next">Continuar →</button>';section.append(controls);section.querySelector('h2')?.after(bar);let index=0;const previous=controls.querySelector('.simple-prev'),next=controls.querySelector('.simple-next');
function change(i){const begin=section.querySelector('#prod-record'),stop=section.querySelector('#prod-stop-record');if(begin?.disabled&&stop?.disabled){const status=section.querySelector('#productive-status');if(status)status.textContent='Resolvé el permiso del micrófono antes de cambiar de paso. También podés salir desde el menú.';return}if(document.querySelector('#prod-stop-record')?.disabled===false)window.klevyProductive.stopRecording();stopVoice();section.querySelectorAll('audio').forEach(a=>a.pause());index=i;steps.forEach((s,n)=>s.hidden=n!==index);bar.textContent=`Paso ${index+1} de ${steps.length} · ${headings[index]}`;previous.hidden=index===0;next.hidden=index===steps.length-1;const ownCTA=steps[index].querySelector('#prod-review-text');if(ownCTA)next.hidden=true;const questionNext=steps[index].querySelector('#context-question-next'),questionPrev=steps[index].querySelector('#context-question-prev');if(questionNext&&!questionNext.hidden)next.hidden=true;if(questionPrev&&!questionPrev.hidden)previous.hidden=true;next.textContent=index===0?'Seguir con la práctica →':'Continuar →';top()}
previous.onclick=()=>change(Math.max(0,index-1));next.onclick=()=>change(Math.min(steps.length-1,index+1));section.simpleStep=change;change(0);return change}

function simplifyUnit(section){const starts=[section.querySelector('.study-sections'),[...section.children].find(n=>n.tagName==='H3'&&n.textContent==='Comprobación rápida'),[...section.children].find(n=>n.tagName==='H3'&&n.textContent==='Ahora, llevá la idea a la práctica')];if(starts.some(n=>!n))return;
// Do not move a boundary while collecting the next range.
